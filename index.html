<script>
// оформление (key | ide | note) и тема — до отрисовки; шрифты грузятся только для выбранного оформления (fonts/ на своём сайте)
(function () {
  var K = 'mobak-lms-v1', D = { key: 1, ide: 1, note: 1 }, root = document.documentElement, d = null, t = null;
  try { d = new URLSearchParams(location.search).get('design'); if (D[d]) localStorage.setItem(K + '-design', d); else d = localStorage.getItem(K + '-design'); t = localStorage.getItem(K + '-theme'); } catch (e) {}
  root.dataset.design = D[d] ? d : 'key';
  if (t) root.dataset.theme = t;
  var done = {};
  window.loadDesignFonts = function (x) {
    if (done[x] || !D[x]) return; done[x] = 1;
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'fonts/' + x + '.css';
    document.head.appendChild(l);
  };
  window.loadDesignFonts(root.dataset.design);
})();
</script>

<style>
/* Три оформления одного сайта: data-design = key («Ключ», по умолчанию) | ide («Рабочее место») | note («Тетрадь»).
   Логика и разметка шагов общие; оформления меняют токены ниже и раскладку (блоки «ОФОРМЛЕНИЕ …» в конце). */
:root, :root[data-design="key"] {
  --bg: #f6f5fb; --panel: #ffffff; --panel2: #f0eef8; --text: #19162e; --muted: #5e5a78; --faint: #8a86a3; --line: #e4e1f0; --line2: #d3cfe4;
  --accent: #5b3df5; --accent-hover: #4a2ee0; --accent-soft: #ece8ff; --on-accent: #ffffff;
  --ok: #128a4e; --ok-soft: #e1f5e9; --warn: #9a5a00; --warn-soft: #fcf0d9; --bad: #d63c41; --bad-soft: #fde8e8; --code-bg: #f8f7fc;
  --bit: #ffc93c; --bit-ink: #3b2a00;
  --hl-k: #7b3fe4; --hl-s: #128a4e; --hl-n: #b45309; --hl-b: #2563eb; --hl-c: #8a86a3;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --display: "Unbounded", "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 18px; --r-sm: 12px; --btn-r: 14px; --top-h: 60px; --shadow: none; --shadow-lg: 0 16px 40px rgba(25,22,46,.18); --bw: 2px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-design="ide"]):not([data-design="note"]), :root[data-design="key"]:not([data-theme="light"]) {
  --bg: #110f1e; --panel: #1a1730; --panel2: #221e3b; --text: #eceaf6; --muted: #a29fba; --faint: #8e8aaa; --line: #2e2a48; --line2: #3b3659;
  --accent: #9d8cff; --accent-hover: #b3a6ff; --accent-soft: #2a2450; --on-accent: #110f1e;
  --ok: #4cd68a; --ok-soft: #173627; --warn: #f0b356; --warn-soft: #3a2d16; --bad: #ff7a7e; --bad-soft: #3d1d24; --code-bg: #15132a;
  --hl-k: #c4b1ff; --hl-s: #7fe0a8; --hl-n: #ffc56b; --hl-b: #8fb4ff; --hl-c: #7d7998; --shadow-lg: 0 16px 40px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-design="key"][data-theme="dark"] {
  --bg: #110f1e; --panel: #1a1730; --panel2: #221e3b; --text: #eceaf6; --muted: #a29fba; --faint: #8e8aaa; --line: #2e2a48; --line2: #3b3659;
  --accent: #9d8cff; --accent-hover: #b3a6ff; --accent-soft: #2a2450; --on-accent: #110f1e;
  --ok: #4cd68a; --ok-soft: #173627; --warn: #f0b356; --warn-soft: #3a2d16; --bad: #ff7a7e; --bad-soft: #3d1d24; --code-bg: #15132a;
  --hl-k: #c4b1ff; --hl-s: #7fe0a8; --hl-n: #ffc56b; --hl-b: #8fb4ff; --hl-c: #7d7998; --shadow-lg: 0 16px 40px rgba(0,0,0,.5); color-scheme: dark;
}
/* «Рабочее место»: тёмная по умолчанию, светлая — по выбору */
:root[data-design="ide"] {
  --bg: #12161d; --panel: #171c25; --panel2: #1d2430; --text: #d9dee7; --muted: #8c97a8; --faint: #6b7687; --line: #2a3240; --line2: #364051;
  --accent: #f2b13d; --accent-hover: #ffc35a; --accent-soft: #2e2716; --on-accent: #12161d;
  --ok: #5cc98d; --ok-soft: #16301f; --warn: #f2b13d; --warn-soft: #2e2716; --bad: #f0736a; --bad-soft: #3a1f1d; --code-bg: #0f1319;
  --bit: #f2b13d; --bit-ink: #12161d;
  --hl-k: #d6a3ff; --hl-s: #9fd8a8; --hl-n: #f2b13d; --hl-b: #7cc7e8; --hl-c: #6b7687;
  --font: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; --display: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 6px; --r-sm: 4px; --btn-r: 4px; --top-h: 42px; --shadow: none; --shadow-lg: 0 12px 32px rgba(0,0,0,.5); --bw: 1px;
  color-scheme: dark;
}
:root[data-design="ide"][data-theme="light"] {
  --bg: #f3f4f6; --panel: #ffffff; --panel2: #eceff3; --text: #1d232d; --muted: #5a6474; --faint: #7b8494; --line: #d6dbe2; --line2: #c3cad4;
  --accent: #a15f00; --accent-hover: #844d00; --accent-soft: #fbefdc; --on-accent: #ffffff;
  --ok: #1b7a48; --ok-soft: #e2f3e9; --warn: #a15f00; --warn-soft: #fbefdc; --bad: #bf3a30; --bad-soft: #fbe7e5; --code-bg: #fbfbfc;
  --hl-k: #8a3fc4; --hl-s: #2b7a3d; --hl-n: #a15f00; --hl-b: #0b6f93; --hl-c: #7b8494; --shadow-lg: 0 12px 32px rgba(29,35,45,.18); color-scheme: light;
}
/* «Тетрадь» */
:root[data-design="note"] {
  --bg: #fbfcfe; --panel: #ffffff; --panel2: #f1f5fa; --text: #1c2b4a; --muted: #5d6679; --faint: #808a9c; --line: #cfd8e5; --line2: #b9c4d4; --grid: #e6edf6;
  --accent: #1c2b4a; --accent-hover: #d2423b; --accent-soft: #e8eef8; --on-accent: #ffffff; --rule: #d2423b;
  --ok: #23774a; --ok-soft: #e4f2ea; --warn: #9a5a00; --warn-soft: #fbefdc; --bad: #c2362f; --bad-soft: #fbe9e7; --code-bg: #f1f5fa;
  --bit: #d2423b; --bit-ink: #fff;
  --hl-k: #8a2be2; --hl-s: #23774a; --hl-n: #b5530a; --hl-b: #2b59c3; --hl-c: #808a9c;
  --font: "PT Serif", Georgia, "Times New Roman", serif; --display: "PT Serif", Georgia, serif; --ui: "PT Sans", "Segoe UI", system-ui, sans-serif; --mono: "PT Mono", ui-monospace, Consolas, monospace;
  --r: 4px; --r-sm: 4px; --btn-r: 4px; --top-h: 54px; --shadow: none; --shadow-lg: 0 12px 32px rgba(28,43,74,.2); --bw: 1.5px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root[data-design="note"]:not([data-theme="light"]) {
  --bg: #121824; --panel: #161e2c; --panel2: #1b2435; --text: #dfe5ef; --muted: #98a2b5; --faint: #7a8498; --line: #2c374b; --line2: #3a4760; --grid: #1a2232;
  --accent: #dfe5ef; --accent-hover: #ff7468; --accent-soft: #1f2a3e; --on-accent: #121824; --rule: #ff7468;
  --ok: #6fd39a; --ok-soft: #173024; --warn: #f0b356; --warn-soft: #3a2d16; --bad: #ff7468; --bad-soft: #3a1f22; --code-bg: #182132;
  --hl-k: #d6a3ff; --hl-s: #8fe0ad; --hl-n: #ffb37a; --hl-b: #9dbcff; --hl-c: #7a8498; --shadow-lg: 0 12px 32px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-design="note"][data-theme="dark"] {
  --bg: #121824; --panel: #161e2c; --panel2: #1b2435; --text: #dfe5ef; --muted: #98a2b5; --faint: #7a8498; --line: #2c374b; --line2: #3a4760; --grid: #1a2232;
  --accent: #dfe5ef; --accent-hover: #ff7468; --accent-soft: #1f2a3e; --on-accent: #121824; --rule: #ff7468;
  --ok: #6fd39a; --ok-soft: #173024; --warn: #f0b356; --warn-soft: #3a2d16; --bad: #ff7468; --bad-soft: #3a1f22; --code-bg: #182132;
  --hl-k: #d6a3ff; --hl-s: #8fe0ad; --hl-n: #ffb37a; --hl-b: #9dbcff; --hl-c: #7a8498; --shadow-lg: 0 12px 32px rgba(0,0,0,.5); color-scheme: dark;
}

/* ===== общее ===== */
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 500 16px/1.62 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
code, pre, .mono { font-family: var(--mono); font-size: .875em; font-variant-ligatures: none; }
code { background: var(--code-bg); border: 1px solid var(--line); padding: .05em .35em; border-radius: 5px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: var(--r-sm); overflow-x: auto; border: 1px solid var(--line); line-height: 1.55; }
pre code { background: none; border: none; padding: 0; font-size: 1em; }
:not(pre) > code, .step .body, .result { overflow-wrap: anywhere; }
table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; font-size: 15px; }
th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
th { background: var(--panel2); font-weight: 600; }
h1, h2, h3, h4 { line-height: 1.25; overflow-wrap: break-word; hyphens: auto; }  /* длинные русские слова на узком экране переносятся */
hr { border: none; border-top: 1px solid var(--line); margin: 20px 0; }
blockquote { margin: 12px 0; padding: 8px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
button { font: 700 15px/1.3 var(--ui, var(--font)); cursor: pointer; border-radius: var(--btn-r); border: var(--bw) solid var(--line2); background: var(--panel); color: var(--text); padding: 9px 16px; transition: background-color .12s, border-color .12s, color .12s; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
button:disabled, button:disabled:hover { opacity: .5; cursor: default; }
button.link { border: none; background: none; color: var(--accent); padding: 4px 6px; font-weight: 600; }
button.link:hover { text-decoration: underline; }
input[type=text], input[type=email], input[type=number], input[type=datetime-local], input[type=search], input[type=date], input[type=time], textarea, select { font: 500 16px var(--font); color: var(--text); background: var(--panel); border: var(--bw) solid var(--line2); border-radius: var(--r-sm); padding: 9px 12px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
.small { font-size: 14px; color: var(--muted); }
.loading { color: var(--muted); padding: 30px 0; }

/* шапка */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: var(--top-h); padding: 0 18px; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .brand { display: flex; align-items: center; gap: 10px; font: 700 18px var(--display); white-space: nowrap; cursor: pointer; min-width: 0; }
.top .brand .logo { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 15px; }
.top .brand small { font: 500 13px var(--font); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; }
.top .score { white-space: nowrap; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.top .score b { color: var(--text); font-variant-numeric: tabular-nums; }
.top .score .mini { width: 72px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.top .score .mini > i { display: block; height: 100%; background: var(--ok); }
.top button { padding: 7px 14px; white-space: nowrap; flex: none; font-size: 14px; }
#moreBtn, .menu-btn { width: 38px; padding: 7px 0; font-size: 18px; line-height: 1; }
.menu-btn { display: none; }
#expBtn { display: none; }
.show-sm { display: none; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
nav.side { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 10px 48px; overflow-y: auto; position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); scrollbar-width: thin; }
main { padding: 28px 40px 96px; width: 100%; min-width: 0; margin: 0 auto; max-width: 940px; }
.scrim { display: none; }
.status { display: none; }

/* меню курса (общая разметка, оформления меняют вид) */
.side a.ls.home { display: block; margin: 0 0 8px; padding: 8px 10px; border-radius: var(--r-sm); font-weight: 700; color: var(--text); text-decoration: none; }
.side a.ls.home.cur { background: var(--accent-soft); color: var(--accent); }
.side .wk { margin: 2px 0; }
.side .wk-h { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; user-select: none; }
.side .wk-h:hover { background: var(--panel2); }
.side .chev { color: var(--faint); font-size: 11px; line-height: 20px; transition: transform .15s; }
.side .wk.closed .chev { transform: rotate(-90deg); }
.side .wl { min-width: 0; }
.side .wn { display: block; font-size: 12px; font-weight: 700; color: var(--faint); line-height: 20px; }
.side .wt { display: block; font-size: 14px; font-weight: 700; line-height: 1.3; }
.side .wp { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; line-height: 20px; }
.side .wp.full { color: var(--ok); }
.side .wbar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: var(--panel2); overflow: hidden; margin-top: 4px; }
.side .wbar > i { display: block; height: 100%; background: var(--ok); }
.side .wk.closed a.ls, .side .wk.closed .files { display: none; }
.side a.ls { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px 6px 12px; margin-left: 12px; border-left: 2px solid var(--line); color: var(--muted); text-decoration: none; font-size: 14px; line-height: 1.4; }
.side a.ls:hover { color: var(--text); background: var(--panel2); }
.side a.ls.cur { color: var(--accent); font-weight: 700; border-left-color: var(--accent); background: var(--accent-soft); }
.side .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; border: 1.5px solid var(--line2); }
.side .dot.part { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
.side .dot.full { border-color: var(--ok); background: var(--ok); }
.side .files { display: none; }

/* значки типов шагов («файлы») */
.fi { flex: none; width: 18px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; font: 700 9.5px/1 var(--mono); color: #fff; }
.fi.md { background: #4a8fe0; } .fi.quiz { background: #a06ee8; } .fi.py { background: #e0a526; color: #1b1400; } .fi.parsons { background: #2fb39c; } .fi.txt { background: #7d8798; }

/* урок: общие элементы */
.crumbs { color: var(--muted); font-size: 14px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.lesson-h { margin: 6px 0 8px; font: 700 28px/1.2 var(--display); }
.stepbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 22px; }
.stepbar a { text-decoration: none; }
.stepbar .fi, .stepbar .fn, .stepbar .tn { display: none; }
.step { position: relative; background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 22px 28px 24px; margin: 0 0 16px; scroll-margin-top: calc(var(--top-h) + 14px); }
.step-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.step-h .num { display: none; }
.step-h .kind { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); font-weight: 600; }
.step-h .kind .t { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
.badge { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge.full { background: var(--ok-soft); color: var(--ok); }
.badge.part { background: var(--warn-soft); color: var(--warn); }
.step .body > :first-child { margin-top: 0; }
.step .body > :last-child { margin-bottom: 0; }
.step .body h2 { font-size: 1.3em; margin: 1.4em 0 .5em; }
.step .body h3 { font-size: 1.12em; margin: 1.3em 0 .4em; }
.step .body img { display: block; max-width: 100%; height: auto; margin: 1em 0; border-radius: var(--r-sm); background: #fff; padding: 8px; border: 1px solid var(--line); cursor: zoom-in; }
.step .body li + li { margin-top: 3px; }
.step p.hand { color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border: var(--bw) solid var(--line2); border-radius: var(--r-sm); cursor: pointer; background: var(--panel); transition: border-color .12s, background-color .12s; }
.opt:hover { border-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 5px; accent-color: var(--accent); flex: none; }
.opt.sel-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.sel-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt .fb { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.opt p { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.result { margin-top: 14px; padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--line); border-left-width: 4px; background: var(--panel2); white-space: pre-wrap; font-size: 15px; }
.result.ok { border-color: var(--ok); background: var(--ok-soft); }
.result.part { border-color: var(--warn); background: var(--warn-soft); }
.result.bad { border-color: var(--bad); background: var(--bad-soft); }
.result .ttl { font-weight: 800; }
.result.ok .ttl { color: var(--ok); } .result.part .ttl { color: var(--warn); } .result.bad .ttl { color: var(--bad); }
.result pre { margin: 6px 0 8px; background: var(--panel); white-space: pre-wrap; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.match-row select { width: 100%; }
.parsons { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-direction: column; gap: 6px; }
.parsons li { display: flex; align-items: center; gap: 6px; background: var(--code-bg); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 4px 6px 4px 10px; cursor: grab; }
.parsons li:hover { border-color: var(--accent); }
.parsons li.drag { opacity: .4; }
.parsons li .ln { flex: 1; white-space: pre; overflow-x: auto; font-family: var(--mono); font-size: 14px; padding: 4px 0; }
.parsons li button { padding: 4px 10px; font-size: 13px; }
.dataset pre { max-height: 260px; overflow: auto; }
.answer { width: 100%; }
.io { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin: 16px 0 0; }
.io > div > div { font-size: 12.5px; font-weight: 700; color: var(--faint); margin-bottom: 4px; }
.io pre { margin: 0; white-space: pre-wrap; }
.editor { border: var(--bw) solid var(--line2); border-radius: var(--r-sm); overflow: hidden; margin-top: 16px; background: var(--code-bg); }
.editor:focus-within { border-color: var(--accent); }
.editor .ed-h { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; font-size: 12.5px; font-weight: 700; color: var(--faint); background: var(--panel2); border-bottom: 1px solid var(--line); }
.editor textarea { display: block; width: 100%; min-height: 200px; border: none; border-radius: 0; background: var(--code-bg); font-family: var(--mono); font-size: 14px; tab-size: 4; resize: vertical; box-shadow: none; }
.CodeMirror { height: auto; min-height: 180px; font-family: var(--mono); font-size: 14.5px; line-height: 1.6; background: var(--code-bg); color: var(--text); }
.CodeMirror-scroll { min-height: 180px; max-height: 560px; }
.CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: var(--faint); padding: 0 10px 0 6px; }
.CodeMirror-lines { padding: 8px 0; }
.CodeMirror-cursor { border-left: 2px solid var(--accent); }
.CodeMirror-selected { background: var(--accent-soft) !important; }
.cm-s-default .cm-keyword { color: var(--hl-k); } .cm-s-default .cm-def { color: var(--hl-b); } .cm-s-default .cm-string { color: var(--hl-s); }
.cm-s-default .cm-number { color: var(--hl-n); } .cm-s-default .cm-comment { color: var(--hl-c); } .cm-s-default .cm-builtin { color: var(--hl-b); }
.cm-s-default .cm-variable, .cm-s-default .cm-variable-2, .cm-s-default .cm-property, .cm-s-default .cm-operator { color: var(--text); }
details.run { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
details.run summary { cursor: pointer; color: var(--accent); font-size: 14.5px; font-weight: 600; }
details.run textarea { width: 100%; min-height: 70px; margin-top: 8px; font-family: var(--mono); font-size: 14px; }
.pystat { font-size: 12.5px; color: var(--faint); margin-top: 10px; }
.pystat.err { color: var(--bad); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; }
.timer.low { color: var(--bad); }
.seg { display: none; }
.stepnav { display: none; }
.pager { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 28px; }
.pager button { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 16px; border-radius: var(--r-sm); background: var(--panel); }
.pager button .pl { font-size: 12.5px; font-weight: 600; color: var(--faint); }
.pager button.primary { background: var(--accent); }
.pager button.primary .pl { color: inherit; opacity: .8; }
.pager button.nx { grid-column: 2; text-align: right; align-items: flex-end; }

/* окна, меню, уведомления */
.modal { position: fixed; inset: 0; background: rgba(10,13,20,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 24px 26px; width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow-lg); }
.modal .box.wide { width: min(880px, 100%); }
.modal h2 { margin-top: 0; font-family: var(--display); }
.modal textarea { width: 100%; min-height: 320px; font-family: var(--mono); font-size: 13px; }
.modal.zoom { cursor: zoom-out; }
.modal.zoom img { max-width: 100%; max-height: 92vh; background: #fff; border-radius: var(--r-sm); padding: 10px; }
.menu { position: fixed; right: 12px; top: calc(var(--top-h) - 4px); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--shadow-lg); padding: 6px; display: flex; flex-direction: column; min-width: 260px; z-index: 40; }
.menu button { border: none; text-align: left; background: none; padding: 9px 12px; border-radius: 6px; color: var(--text); font-weight: 500; }
.menu button:hover { background: var(--panel2); }
.menu .mh { font-size: 12px; font-weight: 700; color: var(--faint); padding: 8px 12px 2px; }
.menu .sep { border-top: 1px solid var(--line); margin: 6px 0; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; z-index: 60; font-size: 14.5px; box-shadow: var(--shadow-lg); max-width: calc(100vw - 32px); }
.who { font-size: 14px; color: var(--muted); white-space: nowrap; }
.who b { color: var(--text); }
/* выбор оформления */
.pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 6px; }
.pick button { display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: left; padding: 12px; font-weight: 500; }
.pick button.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pick .sw { display: flex; height: 54px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.pick .sw i { flex: 1; }
.pick b { font-size: 15px; }
.pick span { font-size: 13px; color: var(--muted); line-height: 1.4; }
@media (max-width: 600px) { .pick { grid-template-columns: 1fr; } .pick .sw { height: 30px; } }

/* общие блоки главной */
.hero { background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 26px 28px; }
.hero h1 { margin: 0 0 10px; font: 700 clamp(26px, 3.4vw, 36px)/1.2 var(--display); }
.hero p { margin: 6px 0; color: var(--muted); }
.bar { height: 6px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 36px 2px 10px; }
.sec-h h2 { margin: 0; font: 700 21px var(--display); }

/* ведомость */
table.grade { display: table; font-size: 14px; white-space: nowrap; background: var(--panel); border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line); border-collapse: separate; border-spacing: 0; }
table.grade th, table.grade td { border: none; border-bottom: 1px solid var(--line); padding: 8px 10px; }
table.grade tr:last-child td { border-bottom: none; }
table.grade th { position: sticky; top: 0; font-size: 12.5px; color: var(--muted); }
table.grade td:first-child { white-space: normal; min-width: 180px; }
table.grade td:not(:first-child):not(:nth-child(2)) { text-align: right; font-variant-numeric: tabular-nums; }
table.grade tr:hover td { background: var(--panel2); }
table.grade.dl td:not(:first-child) { text-align: left; }
table.grade.dl input { font-size: 14px; padding: 5px 8px; }
table.grade.dl .src, table.grade.hist td { white-space: normal; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 10px 0; }
.filters label { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font: 700 24px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.tile span { font-size: 13.5px; color: var(--muted); }
.badge.late { background: var(--bad-soft); color: var(--bad); }
#main > h2 { margin-top: 26px; margin-bottom: 10px; font: 700 19px/1.3 var(--display); }
.ptabs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 14px 0 6px; border-bottom: 1px solid var(--line); }
.ptabs a { padding: 9px 14px; color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ptabs a:hover { color: var(--text); }
.ptabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
.ptabs > button { margin-left: auto; }
/* контрольная на паре */
.exambar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; gap: 10px; align-items: center; max-width: calc(100vw - 32px);
  background: #9b1c1c; color: #fff; padding: 6px 8px 6px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.exambar .b { display: flex; gap: 6px; }
.exambar button { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.45); padding: 4px 10px; font-size: 13px; }
.exlive { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.excodebox { display: flex; flex-direction: column; padding: 10px 18px; border: 2px solid var(--accent); border-radius: var(--r-sm); }
.excodebox b { font: 700 40px/1.1 var(--mono); letter-spacing: 4px; }
.modal.excode .box { text-align: center; }
.modal.excode .big { font: 700 min(20vw, 200px)/1 var(--mono); letter-spacing: .08em; margin: 10px 0 20px; }
table.examtab td.hot { color: #b3261e; font-weight: 700; }
.examgate .exCode { font: 600 22px var(--mono); letter-spacing: 4px; width: 9em; }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 14px; margin: 14px 0; align-items: start; }
.gcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gcard.new { border-style: dashed; }
.gcard.archived { opacity: .8; }
.gcard header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.gcard h2 { margin: 0; font: 700 20px/1.2 var(--display); }
.gcard .actions { margin-top: 2px; }
.gstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.gstats div { display: flex; flex-direction: column; gap: 2px; }
.gstats b { font: 700 20px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.gstats span { font-size: 12.5px; color: var(--muted); }
.gnotes { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.gnotes .warn { color: var(--warn); }
.invite { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--panel2); display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.invite.on { border-color: var(--ok); background: var(--ok-soft); }
.invite .actions { margin-top: 0; gap: 6px; }
.invite .actions button { padding: 6px 12px; font-size: 14px; }
.invite .actions button.link { padding: 6px 4px; }
.invite .ilink { width: 100%; font: 500 13.5px var(--mono, monospace); }
.invite p { margin: 0; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
details.arch > summary { cursor: pointer; color: var(--muted); margin: 6px 0; }
.pblock { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px 16px; margin: 12px 0; }
.pblock > summary { cursor: pointer; }
.pblock h2 { margin: 0 0 6px; font: 700 19px/1.3 var(--display); }
.tblock { margin-top: 22px; }
.gwrap { overflow-x: auto; max-width: 100%; }
table.grade.sheet td:first-child, table.grade.sheet th:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; }
table.grade.sheet th:first-child { z-index: 2; }
table.grade .sort { background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
table.grade .sort.on { color: var(--accent); }
table.grade td.st { white-space: normal; text-align: left; min-width: 150px; }
@media (max-width: 480px) { .gstats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
label.consent { align-items: flex-start; margin: 4px 0 2px; }
label.consent input { margin-top: 3px; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: var(--r-sm); margin: 6px 0; }
.notes { display: flex; flex-direction: column; gap: 4px; }
.ans + .ans { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 8px 0; }
.ach { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; opacity: .75; }
.ach.done { opacity: 1; border-color: var(--ok); background: var(--ok-soft); }
.ach span { font-size: 13px; color: var(--muted); }
.ach i { display: block; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--p), var(--line) var(--p)); }
table.grade.board tr.me td { font-weight: 700; background: var(--panel2); }
table.grade.oral input { width: 100%; min-width: 180px; font-size: 14px; padding: 5px 8px; }
table.grade.oral td, table.grade.log td { white-space: normal; text-align: left; }
.ocard h3 { margin: 10px 0 4px; font-size: 15px; }
.ocard ol { margin: 0; padding-left: 20px; }
.ocard.later { opacity: .8; }
.bars { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 3px; align-items: end; height: 140px; margin: 10px 0 4px; }
.bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.bar i { display: block; width: 100%; min-height: 1px; background: var(--accent); border-radius: 3px 3px 0 0; }
.bar span { font-size: 10px; color: var(--muted); margin-top: 2px; }
.step > summary { cursor: pointer; padding: 2px 0; }
.step[open] > summary { margin-bottom: 10px; }
/* экран входа: без меню курса, форма по центру */
body.bare .layout { grid-template-columns: minmax(0, 1fr) !important; }
body.bare nav.side, body.bare .menu-btn, body.bare #expBtn, body.bare .status { display: none !important; }
body.bare main { max-width: 620px; padding-top: 12vh; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.answer.otp { font: 700 28px/1.2 var(--mono); letter-spacing: .35em; text-align: center; max-width: 280px; display: block; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: fixed; left: 0; top: var(--top-h); width: min(330px, 88vw); z-index: 30; transform: translateX(-105%); transition: transform .22s ease; box-shadow: var(--shadow-lg); }
  body.nav-open nav.side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: var(--top-h) 0 0 0; background: rgba(10,13,20,.45); z-index: 25; }
  .menu-btn { display: inline-block; }
  main { padding: 20px 16px 96px; }
  .top { padding: 0 10px; gap: 8px; }
  .top .brand small, .top .hide-sm, .top .score .mini { display: none; }
  .show-sm { display: inline; }
}
@media (max-width: 600px) {
  .io, .match-row { grid-template-columns: minmax(0, 1fr); }
  .step { padding: 16px 16px 18px; }
  main { padding: 14px 12px 96px; }
  .pager { grid-template-columns: 1fr; } .pager button.nx { grid-column: 1; text-align: left; align-items: flex-start; }
}
@media (max-width: 520px) { .top .score .nm { display: none; } .top button { padding: 7px 11px; } }
@media (max-width: 400px) { .top .brand > span:not(.logo) { display: none; } }

/* ===== ОФОРМЛЕНИЕ «КЛЮЧ» ===== */
/* меню курса — выдвижное на любой ширине; урок — по одному шагу, кнопки снизу под пальцем */
:root[data-design="key"] .layout, :root[data-design="note"] .layout { grid-template-columns: minmax(0, 1fr); }
:root[data-design="key"] nav.side, :root[data-design="note"] nav.side { position: fixed; left: 0; top: var(--top-h); width: min(340px, 88vw); z-index: 30; transform: translateX(-105%); transition: transform .22s ease; box-shadow: var(--shadow-lg); }
:root[data-design="key"] body.nav-open nav.side, :root[data-design="note"] body.nav-open nav.side { transform: none; }
:root[data-design="key"] body.nav-open .scrim, :root[data-design="note"] body.nav-open .scrim { display: block; position: fixed; inset: var(--top-h) 0 0 0; background: rgba(10,13,20,.45); z-index: 25; }
:root[data-design="key"] .menu-btn, :root[data-design="note"] .menu-btn { display: inline-block; }
:root[data-design="key"] .top { border-bottom: none; }
:root[data-design="key"] .top .brand { text-transform: lowercase; }
:root[data-design="key"] .top .brand small { display: none; }
:root[data-design="key"] main { max-width: 1120px; }
:root[data-design="key"] main.in-lesson { max-width: 800px; }
:root[data-design="key"] h1, :root[data-design="key"] h2, :root[data-design="key"] h3 { letter-spacing: -.01em; }
:root[data-design="key"] .lesson-h { font-size: clamp(22px, 3vw, 30px); }
:root[data-design="key"] .stepbar { position: sticky; top: var(--top-h); z-index: 6; background: var(--bg); flex-wrap: nowrap; gap: 5px; padding: 10px 0; margin: 6px 0 14px; }
:root[data-design="key"] .stepbar a { flex: 1; height: 10px; border-radius: 5px; background: var(--line); min-width: 0; }
:root[data-design="key"] .stepbar a:not(.task) { flex: .45; }
:root[data-design="key"] .stepbar a.full { background: var(--ok); }
:root[data-design="key"] .stepbar a.part { background: var(--warn); }
:root[data-design="key"] .stepbar a.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
:root[data-design="key"] .stepbar .sn { display: none; }
:root[data-design="key"] .step { display: none; flex-direction: column; border-radius: 24px; padding: 26px 30px 0; }
:root[data-design="key"] .step.cur { display: flex; }
:root[data-design="key"] .step > *, :root[data-design="key"] .step .work > * { order: 0; }
:root[data-design="key"] .step .result { order: 1; }
:root[data-design="key"] .step > .actions, :root[data-design="key"] .step .work > .actions { order: 2; }
:root[data-design="key"] .step .stepnav, :root[data-design="key"] .step > .pystat { order: 3; }
:root[data-design="key"] .step > .actions { position: sticky; bottom: 0; z-index: 3; background: var(--panel); margin: 16px -30px 0; padding: 14px 30px; border-top: var(--bw) solid var(--line); }
:root[data-design="key"] .step .kind .t { background: var(--accent-soft); color: var(--accent); }
:root[data-design="key"] .opt { padding: 14px 16px; border-radius: 16px; font-weight: 600; }
:root[data-design="key"] .opt input { width: 19px; height: 19px; margin-top: 3px; }
:root[data-design="key"] button { padding: 12px 20px; }
:root[data-design="key"] .top button, :root[data-design="key"] .parsons li button, :root[data-design="key"] .menu button { padding: 7px 12px; }
:root[data-design="key"] .actions button.primary { min-width: 160px; }
:root[data-design="key"] .stepnav { display: flex; justify-content: space-between; gap: 10px; padding: 16px 0 22px; margin-top: 8px; }
:root[data-design="key"] .stepnav button:not(.primary) { background: none; }
:root[data-design="key"] .stepnav .nx { margin-left: auto; }
:root[data-design="key"] .pager { display: none; }
:root[data-design="key"] .crumbs { display: none; }
@media (min-width: 1100px) {
  :root[data-design="key"] main.in-lesson.wide { max-width: 1240px; }
  :root[data-design="key"] .step.split.cur { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 0 32px; align-items: start; }
  :root[data-design="key"] .step.split .stepnav { grid-column: 1 / -1; }
  :root[data-design="key"] .step.split .work { position: sticky; top: calc(var(--top-h) + 44px); display: flex; flex-direction: column; padding-bottom: 20px; }
  :root[data-design="key"] .step.split .editor { margin-top: 0; }
  :root[data-design="key"] .step.split .work > .actions { order: 1; }
  :root[data-design="key"] .step.split .work > .result { order: 2; }
  :root[data-design="key"] .step.split .work > details.run, :root[data-design="key"] .step.split .work > .pystat { order: 3; }
  :root[data-design="key"] .step.split .CodeMirror, :root[data-design="key"] .step.split .CodeMirror-scroll { min-height: 320px; }
}
/* главная «Ключ» */
.kh { background: var(--panel); border: var(--bw) solid var(--line); border-radius: 28px; padding: 32px 34px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 34px; }
.kh h1 { font: 700 clamp(26px, 3.4vw, 38px)/1.2 var(--display); margin: 0 0 12px; }
.kh p { color: var(--muted); margin: 0 0 22px; max-width: 34em; }
.dump { display: grid; grid-template-columns: auto repeat(8, 34px) auto; gap: 6px; align-items: center; margin: 0 0 18px; width: max-content; max-width: 100%; }
.dump .off, .dump .hx { font: 600 14px var(--mono); color: var(--muted); }
.dump .off { padding-right: 8px; }
.dump .hx { padding-left: 12px; color: var(--text); min-width: 3.2em; }
.dump .hx.zero { color: var(--muted); }
.bit { position: relative; width: 34px; height: 40px; border-radius: 9px; display: grid; place-items: center; font: 700 15px var(--mono); background: var(--code-bg); color: var(--muted); border: 1.5px solid var(--line); text-decoration: none; }
.bit.on { background: var(--bit); color: var(--bit-ink); border-color: var(--bit); }
.bit.half { background: linear-gradient(0deg, var(--bit) 42%, var(--code-bg) 42%); color: var(--text); border-color: var(--bit); }
.bit:hover { border-color: var(--accent); z-index: 1; }
.bit .w { position: absolute; top: -9px; left: -3px; font: 700 10px var(--font); background: var(--accent); color: var(--on-accent); border-radius: 5px; padding: 0 4px; line-height: 15px; }

async function pullProgress() {
  const [subs, scs, iss] = await Promise.all([
    sb.from('submissions').select('id, step_id, kind, payload, prelim_score, created_at').order('created_at').limit(10000),
    sb.from('scores').select('submission_id, score').limit(10000),
    sb.from('datasets_issued').select('step_id, set_no, issued_at').limit(10000)]);
  for (const x of [subs, scs, iss]) if (x.error) throw x.error;
  const ver = Object.fromEntries(scs.data.map(x => [x.submission_id, x.score]));
  const att = {};
  for (const x of subs.data) {
    const r = rec(x.step_id);
    att[x.step_id] = (att[x.step_id] || 0) + 1;
    r.score = Math.max(r.score || 0, x.prelim_score || 0);

    if (x.kind === 'dataset' && r.reply === undefined) r.reply = x.payload.reply;

  for (const [id, n] of Object.entries(att)) { const r = rec(id); r.att = Math.max(r.att || 0, n); r.pending = !!r.pendingSrv; delete r.pendingSrv; }

  }

}

import sys, io, builtins, math, random, types, json, marshal, base64

def _load(src):
    m = types.ModuleType("checker")
    if src.startswith("PYC:"):
        code = marshal.loads(base64.b64decode(src[4:]))
    else:
        code = compile(src, "checker.py", "exec")
    exec(code, m.__dict__)

def _sc(r):
    hint = ""
    if isinstance(r, tuple):
        hint = str(r[1]) if len(r) > 1 and r[1] else ""
        r = r[0]
    if r is True: s = 1.0
    elif r is False or r is None: s = 0.0
    else: s = float(r)
    return s, hint

def _ds(src, seed):
    m = _load(src)
    random.seed(seed)
    g = m.generate()
    ds, clue = g if isinstance(g, tuple) else (g, m.solve(g))
    return m, ds, clue

def ds_get(src, seed):
    return _ds(src, seed)[1]

def ds_check(src, seed, reply):
    m, ds, clue = _ds(src, seed)
    s, h = _sc(m.check(reply, clue))
    return json.dumps({"score": s, "hint": h})

def ds_selftest(src, seed, bad):
    m, ds, clue = _ds(src, seed)
    ans = m.solve(ds)
    wrong = eval(bad, {"ds": ds, "ans": ans, "random": random}) if bad else ans + " 1"
    return json.dumps([_sc(m.check(ans, clue))[0], _sc(m.check(wrong, clue))[0], _sc(m.check("", clue))[0]])

import hashlib, hmac as _hmac
if not hasattr(hashlib, "pbkdf2_hmac"):
    # в Python 3.12 убрана запасная реализация на чистом Python, а в Pyodide нет OpenSSL — возвращаем её (RFC 8018)
    def pbkdf2_hmac(hash_name, password, salt, iterations, dklen=None):
        password, salt = bytes(password), bytes(salt)
        inner, outer = hashlib.new(hash_name), hashlib.new(hash_name)
        blocksize = getattr(inner, "block_size", 64)
        if len(password) > blocksize:
            password = hashlib.new(hash_name, password).digest()
        password = password + b"\x00" * (blocksize - len(password))
        inner.update(password.translate(bytes(x ^ 0x36 for x in range(256))))
        outer.update(password.translate(bytes(x ^ 0x5C for x in range(256))))
        def prf(msg):
            icpy, ocpy = inner.copy(), outer.copy()
            icpy.update(msg)
            ocpy.update(icpy.digest())
            return ocpy.digest()
        if iterations < 1:
            raise ValueError(iterations)
        dklen = dklen or outer.digest_size
        dkey, loop = b"", 1
        while len(dkey) < dklen:
            prev = prf(salt + loop.to_bytes(4, "big"))
            rkey = int.from_bytes(prev, "big")
            for _ in range(iterations - 1):
                prev = prf(prev)
                rkey ^= int.from_bytes(prev, "big")
            loop += 1
            dkey += rkey.to_bytes(inner.digest_size, "big")
        return dkey[:dklen]
    hashlib.pbkdf2_hmac = pbkdf2_hmac

# Пакеты с C/Rust-расширениями нельзя выгружать между запусками: повторный импорт создаёт новые классы,
# и isinstance в cryptography перестаёт узнавать свои же объекты. Их оставляем в sys.modules.
_KEEP = ("cryptography", "numpy", "_cffi_backend", "cffi", "hashlib", "_hashlib", "hmac", "secrets", "base64", "typing")

def _snapshot():
    return dict(builtins.__dict__), dict(math.__dict__), set(sys.modules)

def _restore(snap):
    b, mt, mods = snap
    for d, saved in ((builtins.__dict__, b), (math.__dict__, mt)):
        for k in [k for k in d if k not in saved]:
            del d[k]
        for k, v in saved.items():
            if d.get(k, None) is not v:
                d[k] = v
    for k in [k for k in sys.modules if k not in mods and not k.split(".")[0] in _KEEP]:
        del sys.modules[k]

def _run(header, code, footer, stdin):
    hl = header.count("\n") + 1
    cl = code.count("\n") + 1
    script = "\n".join([header, code, footer])
    snap = _snapshot()
    old = sys.stdin, sys.stdout, sys.stderr
    out = io.StringIO()
    sys.stdin, sys.stdout, sys.stderr = io.StringIO(stdin), out, io.StringIO()
    err = ""
    try:
        exec(compile(script, "solution.py", "exec"), {"__name__": "__main__", "__builtins__": builtins})
    except SystemExit:
        pass
    except BaseException as e:
        line = getattr(e, "lineno", None) if isinstance(e, SyntaxError) else None
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == "solution.py":
                line = tb.tb_lineno
            tb = tb.tb_next
        where = ""
        if line is not None:
            if hl < line <= hl + cl:
                where = " (строка {} вашего кода)".format(line - hl)
            elif line > hl + cl:
                where = " (в проверочной части — проверьте, что функция возвращает значение нужного вида)"
        msg = e.msg if isinstance(e, SyntaxError) else e
        err = "{}: {}{}".format(type(e).__name__, msg, where)
    finally:
        sys.stdin, sys.stdout, sys.stderr = old
        _restore(snap)
    return out.getvalue(), err

def code_run(header, code, footer, stdin):
    out, err = _run(header, code, footer, stdin)
    return json.dumps({"out": out[:20000], "err": err})

def code_check(src, header, footer, code, samples):
    m = _load(src)
    random.seed(1)
    tests = [t if isinstance(t, (list, tuple)) else (t, m.solve(t)) for t in m.generate()]
    for i, (inp, clue) in enumerate(tests):
        out, err = _run(header, code, footer, inp)
        s, h = _sc(m.check(out, clue))
        if s < 1:
            r = {"ok": False, "n": i + 1, "total": len(tests), "err": err, "hint": h}
            if i < samples:
                r.update({"input": inp, "expected": str(clue), "got": out[:5000]})
            return json.dumps(r)
    return json.dumps({"ok": True, "total": len(tests)})

function pyStatus(state, msg) { PY.state = state; PY.msg = msg || ''; document.querySelectorAll('.pystat').forEach(paintPy); }
function paintPy(e) {
  e.className = 'pystat' + (PY.state === 'fail' ? ' err' : '');
  e.textContent = PY.state === 'loading' ? 'Загружается Python (при первом открытии ~10 МБ, нужен интернет)…'
    : PY.state === 'packages' ? 'Загружаются библиотеки (cryptography / numpy) — один раз, около 10 секунд…'
    : PY.state === 'ready' ? 'Python готов' : PY.state === 'fail' ? 'Python не загрузился: нужен интернет. Обновите страницу, когда сеть появится. ' + PY.msg : '';
}
function pyStart() {
  if (PY.ready) return PY.ready;
  pyStatus('loading');
  PY.ready = new Promise((res, rej) => {
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' }))); }
    catch (e) { pyStatus('fail', String(e)); PY.ready = null; return rej(e); }
    PY.w = w;
    w.onmessage = (e) => {
      const d = e.data;
      if (d.ready) { pyStatus('ready'); return res(); }
      if (d.fail) { pyStatus('fail', d.fail); PY.ready = null; w.terminate(); return rej(new Error(d.fail)); }
      if (d.status === 'packages') { if (PY.state !== 'packages') pyStatus('packages'); return; }
      const p = PY.pend[d.id]; if (!p) return; delete PY.pend[d.id]; clearTimeout(p.timer);
      if (PY.state === 'packages') pyStatus('ready');
      d.ok ? p.res(d.r) : p.rej(new Error(d.err));
    };
    w.onerror = (e) => { pyStatus('fail', e.message || ''); PY.ready = null; rej(e); };
    w.postMessage({ runner: RUNNER });
  });
  return PY.ready;
}
// imports — текст, по импортам в котором Pyodide догрузит пакеты (cryptography, numpy); время загрузки пакетов не входит в лимит
async function py(op, args, timeout = 20000, imports = '') {
  await pyStart();
  return new Promise((res, rej) => {
    const id = ++PY.seq;
    if (imports && /^\s*(import|from)\s+(cryptography|numpy)\b/m.test(imports)) timeout += 120000;  // первая загрузка пакетов
    const timer = setTimeout(() => {
      delete PY.pend[id]; PY.w.terminate(); PY.ready = null; pyStatus('idle');
      Object.values(PY.pend).forEach(p => p.rej(new Error('restart'))); PY.pend = {};
      const e = new Error('timeout'); e.timeout = true; rej(e); pyStart();
    }, timeout);
    PY.pend[id] = { res, rej, timer };
    PY.w.postMessage({ id, op, args, imports });
  });
}

/* ---------- оценка шага ---------- */
function setScore(s, score, extra = {}) {
  const r = rec(s.id), L = STEPMETA[s.id] && STEPMETA[s.id].lesson, was = L && lessonStat(L);
  r.att = (r.att || 0) + 1; r.last = score; r.score = Math.max(r.score || 0, score); r.ts = Date.now();
  Object.assign(r, extra); save(); refreshChrome(s);
  const now = L && lessonStat(L);
  if (now && now.n && now.done === now.n && was.done < was.n) setTimeout(() => lessonDone(L), 600);
}
function resultBox(box, score, title, text) {
  box.className = 'result ' + (score === 1 ? 'ok' : score > 0 ? 'part' : 'bad');
  box.innerHTML = '<div class="ttl">' + esc(title) + '</div>' + (text ? '<div>' + text + '</div>' : '');
  box.hidden = false;
}

R.parsons = (s, root) => {
  const r = rec(s.id);
  let items = r.order || shuffled(s.lines.map((l, i) => ({ i, lv: 0 })), S.uid + s.id);
  const ul = el('ol', { class: 'parsons' });
  let dragFrom = null;
  const draw = () => {
    ul.innerHTML = '';
    items.forEach((it, k) => {
      const li = el('li', { draggable: 'true' });
      const ln = el('span', { class: 'ln' }); ln.textContent = '    '.repeat(it.lv) + s.lines[it.i];
      const b = (t, title, fn) => el('button', { title, 'aria-label': title, on: { click: fn } }, t);
      li.append(b('↑', 'Выше', () => { if (k) { [items[k - 1], items[k]] = [items[k], items[k - 1]]; draw(); } }),
        b('↓', 'Ниже', () => { if (k < items.length - 1) { [items[k + 1], items[k]] = [items[k], items[k + 1]]; draw(); } }),
        ln,
        b('←', 'Убрать отступ', () => { if (it.lv) { it.lv--; draw(); } }),
        b('→', 'Добавить отступ', () => { if (it.lv < 4) { it.lv++; draw(); } }));
      li.addEventListener('dragstart', () => { dragFrom = k; li.classList.add('drag'); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => e.preventDefault());
      li.addEventListener('drop', e => { e.preventDefault(); if (dragFrom === null || dragFrom === k) return; const [m] = items.splice(dragFrom, 1); items.splice(k, 0, m); dragFrom = null; draw(); });
      ul.appendChild(li);
    });
  };
  draw();
  const box = el('div', { class: 'result', hidden: '' });
  const btn = el('button', { class: 'primary', on: { click: async () => {
    const ok = (await sha(s.id, ...items.map(it => it.lv + ':' + s.lines[it.i]))) === s.key;
    const orderOk = ok || (await sha(s.id, ...items.map(it => s.lines[it.i]))) === s.okey;
    setScore(s, ok ? 1 : 0, { order: items });
    API.submit(s, 'parsons', { lines: items.map(it => [it.lv, s.lines[it.i]]) }, ok ? 1 : 0, '');
    resultBox(box, ok ? 1 : 0, ok ? 'Верно!' : 'Пока неверно', ok ? '' : orderOk ? 'Порядок строк верный — проверьте отступы.' : 'Проверьте порядок строк.');
  } } }, 'Отправить');
  root.append(el('p', { class: 'small' }, 'Перетаскивайте строки мышью или кнопками ↑ ↓; отступ — кнопками → ←.'), ul, el('div', { class: 'actions' }), box);
  $('.actions', root).append(btn);
};

R.dataset = (s, root) => {
  const r = rec(s.id);
  const area = el('div', { class: 'dataset' });
  const stat = el('div', { class: 'pystat' }); paintPy(stat);
  const getBtn = el('button', { class: 'primary' }, 'Скачать');
  const inp = el('input', { type: 'text', placeholder: 'Ваш ответ', class: 'answer', autocomplete: 'off' }); inp.value = r.reply || '';
  const send = el('button', { class: 'primary' }, 'Отправить');
  const timer = el('span', { class: 'timer' });
  const box = el('div', { class: 'result', hidden: '' });
  const seed = () => S.uid + '|' + s.id + '|' + (r.set || 0);   // общий контракт с перепроверкой (lms/grader)
  // время считается от выдачи на сервере; skew — поправка на расхождение часов компьютера с сервером
  const left = () => r.at ? DS_LIMIT - (Date.now() + (r.skew || 0) - r.at) : 0;
  let tick = null;
  const paintTimer = () => {
    const ms = left();
    if (!r.at || r.ds === undefined) { timer.textContent = ''; return; }
    if (ms <= 0) { timer.className = 'timer low'; timer.textContent = 'Время на ответ вышло — возьмите новый набор'; inp.disabled = send.disabled = true; clearInterval(tick); return; }
    const m = Math.floor(ms / 60000), sec = Math.floor(ms % 60000 / 1000);
    timer.className = 'timer' + (ms < 60000 ? ' low' : ''); timer.textContent = 'Осталось ' + m + ':' + String(sec).padStart(2, '0');
  };
  const show = () => {
    area.innerHTML = '';
    if (r.ds === undefined) { inp.disabled = send.disabled = true; getBtn.textContent = 'Скачать'; return; }
    inp.disabled = send.disabled = left() <= 0;
    area.append(el('div', { class: 'small' }, 'Ваши данные (набор №' + ((r.set || 0) + 1) + '):'), el('pre', {}, esc(r.ds)), el('div', { class: 'actions' }));
    const a = $('.actions', area);
    a.append(el('button', { class: 'link', on: { click: () => download(s.id + '.txt', r.ds) } }, 'Скачать файл ещё раз'),
      el('button', { class: 'link', on: { click: () => copy(r.ds) } }, 'Копировать'), timer);
    getBtn.textContent = 'Новый набор';
    clearInterval(tick); paintTimer(); tick = setInterval(() => { if (!document.body.contains(timer)) return clearInterval(tick); paintTimer(); }, 1000);
  };
  const fetchDs = async () => {
    getBtn.disabled = true;
    try {
      if (r.ds !== undefined || r.at) { r.set = (r.set || 0) + 1; delete r.ds; delete r.at; inp.value = ''; box.hidden = true; }
      const ds = await py('ds_get', [s.src, seed()]);
      const iss = await API.issue(s, r.set || 0);
      r.ds = ds; r.at = iss.issued_at; if (iss.skew !== null) r.skew = iss.skew; save(); show();
      download(s.id + '.txt', ds);
    } catch (e) { toast('Не получилось: ' + (e.timeout ? 'превышено время' : 'Python не загрузился')); }
    getBtn.disabled = false;
  };
  getBtn.addEventListener('click', fetchDs);
  const go = async () => {
    if (!inp.value.trim()) return toast('Введите ответ');
    if (left() <= 0) return toast('Время на ответ вышло — возьмите новый набор');
    send.disabled = true; send.textContent = 'Проверяем…';
    try {
      const res = JSON.parse(await py('ds_check', [s.src, seed(), inp.value]));
      setScore(s, res.score, { reply: inp.value });
      API.submit(s, 'dataset', { reply: inp.value, set_no: r.set || 0 }, res.score, res.hint);
      resultBox(box, res.score, res.score === 1 ? 'Верно!' : res.score > 0 ? 'Частично верно: ' + fmt(res.score * s.cost) + ' из ' + ofBalls(s.cost) : 'Неверно', esc(res.hint || ''));
    } catch (e) { toast(e.timeout ? 'Превышено время проверки' : 'Ошибка проверки: ' + e.message); }
    send.disabled = left() <= 0; send.textContent = 'Отправить';
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  send.addEventListener('click', go);
  root.append(el('div', { class: 'actions' }), area, inp, el('div', { class: 'actions' }), box, stat);
  root.querySelectorAll('.actions')[0].append(getBtn);
  root.querySelectorAll('.actions')[1].append(send);
  show();
  // набор выдан на другом устройстве: данные строятся заново по тому же seed, новая выдача не нужна
  if (r.at && r.ds === undefined) py('ds_get', [s.src, seed()]).then(ds => { r.ds = ds; save(); show(); }).catch(() => {});
};

function makeEditor(host, value, onChange) {
  if (window.CodeMirror) {
    const cm = CodeMirror(host, { value, mode: 'python', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false, viewportMargin: Infinity,
      extraKeys: { Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    '), 'Shift-Tab': c => c.indentSelection('subtract') } });
    cm.on('change', () => onChange(cm.getValue()));
    return { get: () => cm.getValue(), set: v => cm.setValue(v), refresh: () => cm.refresh() };
  }
  const ta = el('textarea', { spellcheck: 'false' }); ta.value = value; host.appendChild(ta);
  ta.addEventListener('input', () => onChange(ta.value));
  ta.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); onChange(ta.value); } });
  return { get: () => ta.value, set: v => { ta.value = v; }, refresh: () => {} };
}

R.code = (s, root) => {
  const r = rec(s.id), tpl = s.tpl.replace(/^\n$/, '');
  (s.examples || []).forEach((ex, k) => {
    const io = el('div', { class: 'io' });
    io.append(el('div', {}, '<div>Пример входных данных' + (s.examples.length > 1 ? ' ' + (k + 1) : '') + '</div><pre>' + esc(ex[0]) + '</pre>'),
      el('div', {}, '<div>Ожидаемый вывод</div><pre>' + esc(ex[1]) + '</pre>'));
    root.appendChild(io);
  });
  const host = el('div', { class: 'editor' }, '<div class="ed-h"><span>Ваше решение</span><span>Python 3.12</span></div>');
  root.appendChild(host);
  const ed = makeEditor(host, r.code !== undefined ? r.code : tpl, v => { r.code = v; save(); });
  const box = el('div', { class: 'result', hidden: '' });
  const stat = el('div', { class: 'pystat' }); paintPy(stat);
  const check = el('button', { class: 'primary' }, 'Отправить');
  const budget = () => Math.max(30000, (s.ntests || 10) * (s.tl || 5) * 1000);
  check.addEventListener('click', async () => {
    const code = ed.get();
    if (!code.trim() || code.trim() === tpl.trim()) return toast('Сначала напишите решение');
    if (s.server) {   // в браузере эту задачу не проверить — только сохранить для серверной перепроверки
      r.code = code; r.att = (r.att || 0) + 1; r.pending = code; save();
      API.submit(s, 'code', { code }, null, '');
      return resultBox(box, 0.5, 'Решение сохранено для проверки на сервере',
        'Эту задачу браузер проверить не может: ' + esc(s.server) + '. Балл появится после серверной перепроверки. Пока можно проверить части решения кнопкой «Запустить».');
    }
    check.disabled = true; check.textContent = 'Проверяем…';
    try {
      const res = JSON.parse(await py('code_check', [s.src, s.header, s.footer, code, (s.examples || []).length], budget(), s.header + '\n' + code + '\n' + s.footer));
      setScore(s, res.ok ? 1 : 0, { code, solved: res.ok ? code : r.solved });
      API.submit(s, 'code', { code }, res.ok ? 1 : 0, res.ok ? '' : res.hint || res.err || '');
      if (res.ok) resultBox(box, 1, 'Верно! Пройдены все тесты: ' + res.total + '.');
      else {
        let t = '';
        if (res.input !== undefined) t += 'Входные данные:<pre>' + esc(res.input) + '</pre>Ожидалось:<pre>' + esc(res.expected) + '</pre>Ваш вывод:<pre>' + (esc(res.got) || '<i>(пусто)</i>') + '</pre>';
        if (res.err) t += 'Ошибка: <code>' + esc(res.err) + '</code><br>';
        if (res.hint) t += esc(res.hint) + '<br>';
        if (!res.err && !res.hint && res.input === undefined) t += 'Неверный ответ на скрытом тесте. Проверьте граничные случаи (0, 1, отрицательные, большие числа).';
        resultBox(box, 0, 'Не пройден тест №' + res.n + ' из ' + res.total, t);
      }
    } catch (e) { resultBox(box, 0, e.timeout ? 'Превышено время работы' : 'Ошибка проверки', e.timeout ? 'Программа работает слишком долго — возможно, бесконечный цикл или ожидание лишнего input().' : esc(e.message)); r.att = (r.att || 0) + 1; save(); }
    check.disabled = false; check.textContent = 'Отправить';
  });
  const runIn = el('textarea', { spellcheck: 'false' }); runIn.value = (s.examples && s.examples[0]) ? s.examples[0][0] : '';
  const runOut = el('div', { class: 'result', hidden: '' });
  const runBtn = el('button', {}, 'Запустить');
  runBtn.addEventListener('click', async () => {
    runBtn.disabled = true; runBtn.textContent = 'Выполняется…';
    try {
      const code = ed.get();
      const res = JSON.parse(await py('code_run', [s.header, code, s.footer, runIn.value], (s.tl || 5) * 3000, s.header + '\n' + code + '\n' + s.footer));
      runOut.className = 'result' + (res.err ? ' bad' : '');
      runOut.innerHTML = '<div class="ttl">Вывод программы</div><pre>' + (esc(res.out) || '<i>(пусто)</i>') + '</pre>' + (res.err ? 'Ошибка: <code>' + esc(res.err) + '</code>' : '');
      runOut.hidden = false;
    } catch (e) { runOut.className = 'result bad'; runOut.innerHTML = e.timeout ? 'Превышено время работы (возможно, бесконечный цикл).' : esc(e.message); runOut.hidden = false; }
    runBtn.disabled = false; runBtn.textContent = 'Запустить';
  });
  const det = el('details', { class: 'run' }, '<summary>Запустить код на своих входных данных</summary>');
  det.append(runIn, el('div', { class: 'actions' }), runOut); $('.actions', det).append(runBtn);
  det.addEventListener('toggle', ed.refresh);
  const reset = el('button', { class: 'link', on: { click: () => { if (confirm('Вернуть исходный шаблон? Ваш код будет удалён.')) { ed.set(tpl); r.code = tpl; save(); } } } }, 'Сбросить код');
  const acts = el('div', { class: 'actions' }); acts.append(check, reset);
  root.append(acts, box, det, stat);
  if (r.solved) resultBox(box, 1, 'Задача уже решена. Можно улучшать код и отправлять снова.');
  setTimeout(ed.refresh, 0);
};

/* ---------- оформление: key «Ключ» | ide «Рабочее место» | note «Тетрадь» ----------
   Выбор хранится в браузере (KEY-design), начальное значение ставит скрипт в <head> до отрисовки. */
const DESIGNS = {
  key: { name: 'Ключ', about: 'Урок по одному шагу, кнопки снизу. Пройденные уроки зажигают биты ключа.', sw: ['#f6f5fb', '#5b3df5', '#ffc93c', '#19162e'] },
  ide: { name: 'Рабочее место', about: 'Как редактор кода: шаги — файлы, условие и код рядом, тёмная тема.', sw: ['#12161d', '#171c25', '#f2b13d', '#5cc98d'] },
  note: { name: 'Тетрадь', about: 'Весь урок одной страницей, как в учебнике: поля, клетка, пометки.', sw: ['#fbfcfe', '#e6edf6', '#1c2b4a', '#d2423b'] },
};
const design = () => document.documentElement.dataset.design || 'key';
const oneStep = () => design() !== 'note';   // «Ключ» и «Рабочее место» показывают по одному шагу
function setDesign(d) {

/* главная «Ключ»: каждый урок с задачами — бит ключа, ключ показан шестнадцатеричным дампом */
function keyHex(extra) {
  const bits = TASK_LESSONS().map(l => (l === extra || lstate(l) === 'done') ? 1 : 0);
  while (bits.length % 8) bits.push(0);
  return bits.join('').match(/.{8}/g).map(b => parseInt(b, 2).toString(16).toUpperCase().padStart(2, '0')).join(' ');
}
function dumpHtml(anim, extra, onlyRow) {
  const TL = TASK_LESSONS(); let h = '', lit = 0;
  for (let r = 0; r * 8 < TL.length; r++) {
    if (onlyRow !== undefined && r !== onlyRow) continue;
    let byte = 0;
    h += '<span class="off">' + (r * 8).toString(16).toUpperCase().padStart(2, '0') + '</span>';
    for (let c = 0; c < 8; c++) {
      const i = r * 8 + c, l = TL[i];
      if (!l) { h += '<span></span>'; continue; }
      const s = l === extra ? 'done' : lstate(l), first = !i || TL[i - 1].mod !== l.mod;
      if (s === 'done') byte |= 128 >> c;
      h += '<a class="bit ' + (s === 'done' ? 'on' : s === 'part' ? 'half' : '') + (l === extra ? ' new' : '') + '" style="--i:' + (s === 'done' ? lit++ : 0) + '" href="#' + l.key + '" title="' + esc(l.mod.label + ': ' + l.title) + '">' +
        (s === 'done' ? 1 : 0) + (first ? '<span class="w">' + (l.mod.n === 15 ? 'И' : l.mod.n) + '</span>' : '') + '</a>';
    }
    h += '<span class="hx' + (byte ? '' : ' zero') + '">' + byte.toString(16).toUpperCase().padStart(2, '0') + '</span>';
  }
  return '<div class="dump' + (anim ? ' anim' : '') + '" role="img" aria-label="Ключ: ' + keyHex(extra) + '">' + h + '</div>';
}

/* ---------- запись по ссылке ---------- */
// ?join=<код> — ссылка преподавателя. Код (и ФИО со страницы записи) хранится в браузере, пока запись не закончена:
// ссылка из письма открывает сайт уже без ?join.
const JKEY = KEY + '-join';
function pendingJoin() {
  const q = new URLSearchParams(location.search).get('join');
  if (q) { saveJoin({ code: q.trim().toLowerCase() }); history.replaceState(null, '', location.pathname + location.hash); }
  try { const j = JSON.parse(localStorage.getItem(JKEY) || 'null'); if (j && j.code && Date.now() - j.at < 2 * 864e5) return j; } catch (e) {}
  return null;
}
function saveJoin(j) { try { localStorage.setItem(JKEY, JSON.stringify(Object.assign({}, j, { at: Date.now() }))); } catch (e) {} }
function doneJoin() { try { localStorage.removeItem(JKEY); } catch (e) {} }

/* ---------- вход по почте (код из письма) ---------- */
// join — запись в группу по ссылке: { code, group, term }; тогда спрашиваем ещё ФИО, а код приглашения уходит в запрос письма
function loginScreen(msg, join) {
  $('#side').innerHTML = ''; document.body.classList.add('bare');
  const m = $('#main'); m.innerHTML = '';
  // вход в два шага: почта → код из письма (ссылка из того же письма тоже работает)
  const box = el('div', { class: 'hero' }, '<div class="eyebrow">МОБАК · ' + (join ? 'запись в группу ' + esc(join.group) : 'вход в курс') + '</div><h1>Математические основы и базовые алгоритмы криптографии</h1><p class="lead"></p>');
  const lead = $('.lead', box), form = el('div', { class: 'login-form' }), res = el('div', { class: 'result', hidden: '' });
  const say = (cls, html) => { res.className = 'result ' + cls; res.innerHTML = html; res.hidden = false; };
  const acts = (...b) => { const a = el('div', { class: 'actions' }); a.append(...b); return a; };
  let email = '', timer = null, fio = (join && join.name) || '';
  const send = async e => {
    const options = { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true };
    if (join) options.data = { invite: join.code, full_name: fio };   // триггер на auth.users пропустит почту не из списка с действующим кодом

    if (error) say('bad', 'Не получилось отправить письмо: ' + esc(join && /Database error saving new user/i.test(error.message || '') ? 'ссылка для записи больше не действует — попросите у преподавателя новую' : errText(error)) + '.');
    return !error;
  };
  const askEmail = () => {
    clearInterval(timer);
    if (join) lead.innerHTML = 'Вы записываетесь на курс в группу <b>' + esc(join.group) + '</b>' + (join.term ? ' (' + esc(join.term) + ')' : '') + '. Укажите фамилию и имя, как в журнале, и почту — на неё придёт письмо с кодом для входа. Пароль не нужен.';
    else lead.textContent = 'Введите почту, которую вы дали преподавателю. На неё придёт письмо с кодом для входа. Пароль не нужен.';
    form.innerHTML = '';
    const nm = join ? el('input', { type: 'text', class: 'answer', placeholder: 'Фамилия Имя', autocomplete: 'name', 'aria-label': 'Фамилия и имя', maxlength: '120' }) : null;
    if (nm) nm.value = fio;
    const inp = el('input', { type: 'email', class: 'answer', placeholder: 'почта@пример.ru', autocomplete: 'email', 'aria-label': 'Почта' }); inp.value = email;
    const btn = el('button', { class: 'primary' }, join ? 'Записаться' : 'Получить код');
    const cons = el('label', { class: 'chk consent' }, '<input type="checkbox"> <span>Согласен(на) на обработку моих данных (ФИО, почта, ответы и баллы) для учёта успеваемости по курсу. <a href="#" class="ppLink">Подробнее</a></span>');
    try { $('input', cons).checked = !!localStorage.getItem(KEY + '-consent'); } catch (e) {}
    $('.ppLink', cons).onclick = e => { e.preventDefault(); privacyModal(); };
    const go = async () => {
      const e = inp.value.trim().toLowerCase();
      if (!$('input', cons).checked) return toast('Отметьте согласие на обработку данных');
      try { localStorage.setItem(KEY + '-consent', new Date().toISOString()); } catch (x) {}
      if (nm) {

        if (fio.split(' ').length < 2 || fio.length < 5) { nm.focus(); return toast('Введите фамилию и имя'); }

      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast('Введите почту');

    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    if (nm) nm.addEventListener('keydown', e => { if (e.key === 'Enter') inp.focus(); });
    btn.addEventListener('click', go);
    const extra = [];
    if (join) extra.push(el('button', { class: 'link', on: { click: () => { doneJoin(); loginScreen(); } } }, 'Я уже в списке группы — просто войти'));

    const wait = () => { clearInterval(timer); left = 60; tick(); timer = setInterval(tick, 1000); };   // почта Supabase: не чаще раза в минуту
    wait();
    again.addEventListener('click', async () => { if (left > 0) return; again.disabled = true; if (await send(email)) { say('ok', 'Новый код отправлен на ' + esc(email) + '.'); wait(); } else again.disabled = false; });
    other.addEventListener('click', askEmail);

        code.select(); return;
      }
      clearInterval(timer); location.reload();
    };
    code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, '').slice(0, 8); });
    code.addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
    ok.addEventListener('click', verify);
    form.append(code, acts(ok, again, other)); code.focus();
  };
  if (msg) say('bad', esc(msg));
  box.append(form, res); m.appendChild(box);
  $('#score').textContent = '';
  askEmail();
}

// ошибка из ссылки входа (например, ссылка устарела) приходит в адресе после #
