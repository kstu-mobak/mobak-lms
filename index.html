<script>
// оформление (key | ide | note) и тема — до отрисовки; шрифты грузятся только для выбранного оформления (fonts/ на своём сайте)
(function () {
  var K = 'mobak-lms-v1', D = { key: 1, ide: 1, note: 1 }, root = document.documentElement, d = null, t = null;
  try { d = new URLSearchParams(location.search).get('design'); if (D[d]) localStorage.setItem(K + '-design', d); else d = localStorage.getItem(K + '-design'); t = localStorage.getItem(K + '-theme'); } catch (e) {}
  root.dataset.design = D[d] ? d : 'key';
  if (t) root.dataset.theme = t;
  var done = {};
  window.loadDesignFonts = function (x) {
    if (done[x] || !D[x]) return; done[x] = 1;
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'fonts/' + x + '.css';
    document.head.appendChild(l);
  };
  window.loadDesignFonts(root.dataset.design);
})();
</script>

<style>
/* Три оформления одного сайта: data-design = key («Ключ», по умолчанию) | ide («Рабочее место») | note («Тетрадь»).
   Логика и разметка шагов общие; оформления меняют токены ниже и раскладку (блоки «ОФОРМЛЕНИЕ …» в конце). */
:root, :root[data-design="key"] {
  --bg: #f6f5fb; --panel: #ffffff; --panel2: #f0eef8; --text: #19162e; --muted: #5e5a78; --faint: #6c697f; --line: #e4e1f0; --line2: #d3cfe4;
  --accent: #5b3df5; --accent-hover: #4a2ee0; --accent-soft: #ece8ff; --on-accent: #ffffff;
  --ok: #107c46; --ok-soft: #e1f5e9; --warn: #9a5a00; --warn-soft: #fcf0d9; --bad: #c1363a; --bad-soft: #fde8e8; --code-bg: #f8f7fc;
  --bit: #ffc93c; --bit-ink: #3b2a00;
  --hl-k: #7b3fe4; --hl-s: #128a4e; --hl-n: #b45309; --hl-b: #2563eb; --hl-c: #8a86a3;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --display: "Unbounded", "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 18px; --r-sm: 12px; --btn-r: 14px; --top-h: 60px; --shadow: none; --shadow-lg: 0 16px 40px rgba(25,22,46,.18); --bw: 2px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-design="ide"]):not([data-design="note"]), :root[data-design="key"]:not([data-theme="light"]) {
  --bg: #110f1e; --panel: #1a1730; --panel2: #221e3b; --text: #eceaf6; --muted: #a29fba; --faint: #8e8aaa; --line: #2e2a48; --line2: #3b3659;
  --accent: #9d8cff; --accent-hover: #b3a6ff; --accent-soft: #2a2450; --on-accent: #110f1e;
  --ok: #4cd68a; --ok-soft: #173627; --warn: #f0b356; --warn-soft: #3a2d16; --bad: #ff7a7e; --bad-soft: #3d1d24; --code-bg: #15132a;
  --hl-k: #c4b1ff; --hl-s: #7fe0a8; --hl-n: #ffc56b; --hl-b: #8fb4ff; --hl-c: #7d7998; --shadow-lg: 0 16px 40px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-design="key"][data-theme="dark"] {
  --bg: #110f1e; --panel: #1a1730; --panel2: #221e3b; --text: #eceaf6; --muted: #a29fba; --faint: #8e8aaa; --line: #2e2a48; --line2: #3b3659;
  --accent: #9d8cff; --accent-hover: #b3a6ff; --accent-soft: #2a2450; --on-accent: #110f1e;
  --ok: #4cd68a; --ok-soft: #173627; --warn: #f0b356; --warn-soft: #3a2d16; --bad: #ff7a7e; --bad-soft: #3d1d24; --code-bg: #15132a;
  --hl-k: #c4b1ff; --hl-s: #7fe0a8; --hl-n: #ffc56b; --hl-b: #8fb4ff; --hl-c: #7d7998; --shadow-lg: 0 16px 40px rgba(0,0,0,.5); color-scheme: dark;
}
/* «Рабочее место»: тёмная по умолчанию, светлая — по выбору */
:root[data-design="ide"] {
  --bg: #12161d; --panel: #171c25; --panel2: #1d2430; --text: #d9dee7; --muted: #8c97a8; --faint: #868f9d; --line: #2a3240; --line2: #364051;
  --accent: #f2b13d; --accent-hover: #ffc35a; --accent-soft: #2e2716; --on-accent: #12161d;
  --ok: #5cc98d; --ok-soft: #16301f; --warn: #f2b13d; --warn-soft: #2e2716; --bad: #f0736a; --bad-soft: #3a1f1d; --code-bg: #0f1319;
  --bit: #f2b13d; --bit-ink: #12161d;
  --hl-k: #d6a3ff; --hl-s: #9fd8a8; --hl-n: #f2b13d; --hl-b: #7cc7e8; --hl-c: #6b7687;
  --font: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; --display: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 6px; --r-sm: 4px; --btn-r: 4px; --top-h: 42px; --shadow: none; --shadow-lg: 0 12px 32px rgba(0,0,0,.5); --bw: 1px;
  color-scheme: dark;
}
:root[data-design="ide"][data-theme="light"] {
  --bg: #f3f4f6; --panel: #ffffff; --panel2: #eceff3; --text: #1d232d; --muted: #5a6474; --faint: #626a76; --line: #d6dbe2; --line2: #c3cad4;
  --accent: #9b5b00; --accent-hover: #844d00; --accent-soft: #fbefdc; --on-accent: #ffffff;
  --ok: #1b7a48; --ok-soft: #e2f3e9; --warn: #a15f00; --warn-soft: #fbefdc; --bad: #bf3a30; --bad-soft: #fbe7e5; --code-bg: #fbfbfc;
  --hl-k: #8a3fc4; --hl-s: #2b7a3d; --hl-n: #a15f00; --hl-b: #0b6f93; --hl-c: #7b8494; --shadow-lg: 0 12px 32px rgba(29,35,45,.18); color-scheme: light;
}
/* «Тетрадь» */
:root[data-design="note"] {
  --bg: #fbfcfe; --panel: #ffffff; --panel2: #f1f5fa; --text: #1c2b4a; --muted: #5d6679; --faint: #666e7d; --line: #cfd8e5; --line2: #b9c4d4; --grid: #e6edf6;
  --accent: #1c2b4a; --accent-hover: #d2423b; --accent-soft: #e8eef8; --on-accent: #ffffff; --rule: #d2423b;
  --ok: #23774a; --ok-soft: #e4f2ea; --warn: #9a5a00; --warn-soft: #fbefdc; --bad: #c2362f; --bad-soft: #fbe9e7; --code-bg: #f1f5fa;
  --bit: #d2423b; --bit-ink: #fff;
  --hl-k: #8a2be2; --hl-s: #23774a; --hl-n: #b5530a; --hl-b: #2b59c3; --hl-c: #808a9c;
  --font: "PT Serif", Georgia, "Times New Roman", serif; --display: "PT Serif", Georgia, serif; --ui: "PT Sans", "Segoe UI", system-ui, sans-serif; --mono: "PT Mono", ui-monospace, Consolas, monospace;
  --r: 4px; --r-sm: 4px; --btn-r: 4px; --top-h: 54px; --shadow: none; --shadow-lg: 0 12px 32px rgba(28,43,74,.2); --bw: 1.5px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root[data-design="note"]:not([data-theme="light"]) {
  --bg: #121824; --panel: #161e2c; --panel2: #1b2435; --text: #dfe5ef; --muted: #98a2b5; --faint: #858ea0; --line: #2c374b; --line2: #3a4760; --grid: #1a2232;
  --accent: #dfe5ef; --accent-hover: #ff7468; --accent-soft: #1f2a3e; --on-accent: #121824; --rule: #ff7468;
  --ok: #6fd39a; --ok-soft: #173024; --warn: #f0b356; --warn-soft: #3a2d16; --bad: #ff7468; --bad-soft: #3a1f22; --code-bg: #182132;
  --hl-k: #d6a3ff; --hl-s: #8fe0ad; --hl-n: #ffb37a; --hl-b: #9dbcff; --hl-c: #7a8498; --shadow-lg: 0 12px 32px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-design="note"][data-theme="dark"] {
  --bg: #121824; --panel: #161e2c; --panel2: #1b2435; --text: #dfe5ef; --muted: #98a2b5; --faint: #858ea0; --line: #2c374b; --line2: #3a4760; --grid: #1a2232;
  --accent: #dfe5ef; --accent-hover: #ff7468; --accent-soft: #1f2a3e; --on-accent: #121824; --rule: #ff7468;
  --ok: #6fd39a; --ok-soft: #173024; --warn: #f0b356; --warn-soft: #3a2d16; --bad: #ff7468; --bad-soft: #3a1f22; --code-bg: #182132;
  --hl-k: #d6a3ff; --hl-s: #8fe0ad; --hl-n: #ffb37a; --hl-b: #9dbcff; --hl-c: #7a8498; --shadow-lg: 0 12px 32px rgba(0,0,0,.5); color-scheme: dark;
}

/* ===== общее ===== */
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 500 16px/1.62 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
code, pre, .mono { font-family: var(--mono); font-size: .875em; font-variant-ligatures: none; }
code { background: var(--code-bg); border: 1px solid var(--line); padding: .05em .35em; border-radius: 5px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: var(--r-sm); overflow-x: auto; border: 1px solid var(--line); line-height: 1.55; }
pre code { background: none; border: none; padding: 0; font-size: 1em; }
:not(pre) > code, .step .body, .result { overflow-wrap: anywhere; }
table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; font-size: 15px; }
th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
th { background: var(--panel2); font-weight: 600; }
h1, h2, h3, h4 { line-height: 1.25; overflow-wrap: break-word; hyphens: auto; }  /* длинные русские слова на узком экране переносятся */
hr { border: none; border-top: 1px solid var(--line); margin: 20px 0; }
blockquote { margin: 12px 0; padding: 8px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
button { font: 700 15px/1.3 var(--ui, var(--font)); cursor: pointer; border-radius: var(--btn-r); border: var(--bw) solid var(--line2); background: var(--panel); color: var(--text); padding: 9px 16px; transition: background-color .12s, border-color .12s, color .12s; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
button:disabled, button:disabled:hover { opacity: .5; cursor: default; }
button.link { border: none; background: none; color: var(--accent); padding: 4px 6px; font-weight: 600; }
button.link:hover { text-decoration: underline; }
input[type=text], input[type=email], input[type=number], input[type=datetime-local], input[type=search], input[type=date], input[type=time], textarea, select { font: 500 16px var(--font); color: var(--text); background: var(--panel); border: var(--bw) solid var(--line2); border-radius: var(--r-sm); padding: 9px 12px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
.small { font-size: 14px; color: var(--muted); }
.loading { color: var(--muted); padding: 30px 0; }

/* шапка */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: var(--top-h); padding: 0 18px; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .brand { display: flex; align-items: center; gap: 10px; font: 700 18px var(--display); white-space: nowrap; cursor: pointer; min-width: 0; }
.top .brand .logo { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 15px; }
.top .brand small { font: 500 13px var(--font); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; }
.top .score { white-space: nowrap; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.top .score b { color: var(--text); font-variant-numeric: tabular-nums; }
.top .score .mini { width: 72px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.top .score .mini > i { display: block; height: 100%; background: var(--ok); }
.top button { padding: 7px 14px; white-space: nowrap; flex: none; font-size: 14px; }
#moreBtn, .menu-btn { width: 38px; padding: 7px 0; font-size: 18px; line-height: 1; }
.menu-btn { display: none; }
#expBtn { display: none; }
.show-sm { display: none; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
nav.side { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 10px 48px; overflow-y: auto; position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); scrollbar-width: thin; }
main { padding: 28px 40px 96px; width: 100%; min-width: 0; margin: 0 auto; max-width: 940px; }
.scrim { display: none; }
.status { display: none; }

/* меню курса (общая разметка, оформления меняют вид) */
.side a.ls.home { display: block; margin: 0 0 8px; padding: 8px 10px; border-radius: var(--r-sm); font-weight: 700; color: var(--text); text-decoration: none; }
.side a.ls.home.cur { background: var(--accent-soft); color: var(--accent); }
.side .wk { margin: 2px 0; }
.side .wk-h { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; user-select: none; }
.side .wk-h:hover { background: var(--panel2); }
.side .chev { color: var(--faint); font-size: 11px; line-height: 20px; transition: transform .15s; }
.side .wk.closed .chev { transform: rotate(-90deg); }
.side .wl { min-width: 0; }
.side .wn { display: block; font-size: 12px; font-weight: 700; color: var(--faint); line-height: 20px; }
.side .wt { display: block; font-size: 14px; font-weight: 700; line-height: 1.3; }
.side .wp { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; line-height: 20px; }
.side .wp.full { color: var(--ok); }
.side .wbar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: var(--panel2); overflow: hidden; margin-top: 4px; }
.side .wbar > i { display: block; height: 100%; background: var(--ok); }
.side .wk.closed a.ls, .side .wk.closed .files { display: none; }
.side a.ls { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px 6px 12px; margin-left: 12px; border-left: 2px solid var(--line); color: var(--muted); text-decoration: none; font-size: 14px; line-height: 1.4; }
.side a.ls:hover { color: var(--text); background: var(--panel2); }
.side a.ls.cur { color: var(--accent); font-weight: 700; border-left-color: var(--accent); background: var(--accent-soft); }
.side .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; border: 1.5px solid var(--line2); }
.side .dot.part { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
.side .dot.full { border-color: var(--ok); background: var(--ok); }
.side .files { display: none; }

/* значки типов шагов («файлы») */
.fi { flex: none; width: 18px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; font: 700 9.5px/1 var(--mono); color: #fff; }
.fi.md { background: #4a8fe0; } .fi.quiz { background: #a06ee8; } .fi.py { background: #e0a526; color: #1b1400; } .fi.parsons { background: #2fb39c; } .fi.txt { background: #5f6878; }

/* урок: общие элементы */
.crumbs { color: var(--muted); font-size: 14px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.lesson-h { margin: 6px 0 8px; font: 700 28px/1.2 var(--display); }
.stepbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 22px; }
.stepbar a { text-decoration: none; }
.stepbar .fi, .stepbar .fn, .stepbar .tn { display: none; }
.step { position: relative; background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 22px 28px 24px; margin: 0 0 16px; scroll-margin-top: calc(var(--top-h) + 14px); }
.step-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.step-h .num { display: none; }
.step-h .kind { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); font-weight: 600; }
.step-h .kind .t { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
.badge { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge.full { background: var(--ok-soft); color: var(--ok); }
.badge.part { background: var(--warn-soft); color: var(--warn); }
.step .body > :first-child { margin-top: 0; }
.step .body > :last-child { margin-bottom: 0; }
.step .body h2 { font-size: 1.3em; margin: 1.4em 0 .5em; }
.step .body h3 { font-size: 1.12em; margin: 1.3em 0 .4em; }
.step .body img { display: block; max-width: 100%; height: auto; margin: 1em 0; border-radius: var(--r-sm); background: #fff; padding: 8px; border: 1px solid var(--line); cursor: zoom-in; }
.step .body li + li { margin-top: 3px; }
.step p.hand { color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border: var(--bw) solid var(--line2); border-radius: var(--r-sm); cursor: pointer; background: var(--panel); transition: border-color .12s, background-color .12s; }
.opt:hover { border-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 5px; accent-color: var(--accent); flex: none; }
.opt.sel-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.sel-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt .fb { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.opt p { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.actions button { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.result { margin-top: 14px; padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--line); border-left-width: 4px; background: var(--panel2); white-space: pre-wrap; font-size: 15px; }
.result.ok { border-color: var(--ok); background: var(--ok-soft); }
.result.part { border-color: var(--warn); background: var(--warn-soft); }
.result.bad { border-color: var(--bad); background: var(--bad-soft); }
.result .ttl { font-weight: 800; }
.result.ok .ttl { color: var(--ok); } .result.part .ttl { color: var(--warn); } .result.bad .ttl { color: var(--bad); }
.result pre { margin: 6px 0 8px; background: var(--panel); white-space: pre-wrap; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.match-row select { width: 100%; }
.parsons { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-direction: column; gap: 6px; }
.parsons li { display: flex; align-items: center; gap: 6px; background: var(--code-bg); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 4px 6px 4px 10px; cursor: grab; }
.parsons li:hover { border-color: var(--accent); }
.parsons li.drag { opacity: .4; }
.parsons li .ln { flex: 1; white-space: pre; overflow-x: auto; font-family: var(--mono); font-size: 14px; padding: 4px 0; }
.parsons li button { padding: 4px 10px; font-size: 13px; }

/* окна, меню, уведомления */

/* общие блоки главной */

/* ведомость */

.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 10px 0; }

}

  background: #9b1c1c; color: #fff; padding: 6px 8px 6px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.25); }

}
.exambar button { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.45); padding: 4px 10px; font-size: 13px; }
.exlive { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }

.examgate .exCode { font: 600 22px var(--mono); letter-spacing: 4px; width: 9em; }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 14px; margin: 14px 0; align-items: start; }
.gcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gcard.new { border-style: dashed; }

.gcard h2 { margin: 0; font: 700 20px/1.2 var(--display); }
.gcard .actions { margin-top: 2px; }
.gstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.gstats div { display: flex; flex-direction: column; gap: 2px; }
.gstats b { font: 700 20px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.gstats span { font-size: 12.5px; color: var(--muted); }
.gnotes { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }

.invite { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--panel2); display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.invite.on { border-color: var(--ok); background: var(--ok-soft); }
.invite .actions { margin-top: 0; gap: 6px; }
.invite .actions button { padding: 6px 12px; font-size: 14px; }
.invite .actions button.link { padding: 6px 4px; }
.invite .ilink { width: 100%; font: 500 13.5px var(--mono, monospace); }
.invite p { margin: 0; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
details.arch > summary { cursor: pointer; color: var(--muted); margin: 6px 0; }
.pblock { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px 16px; margin: 12px 0; }
.pblock > summary { cursor: pointer; }
.pblock h2 { margin: 0 0 6px; font: 700 19px/1.3 var(--display); }
/* инструменты: песочница и разборы по шагам */
.tsub { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
.tool [hidden], .tout [hidden] { display: none !important; }   /* .actions и .filters label задают display — hidden иначе не скрывает */

.tool input, .tool textarea { font-family: var(--mono); }
.filters label.wide { flex: 1 1 100%; flex-direction: column; align-items: stretch; gap: 4px; }
.filters label.wide textarea { width: 100%; font-size: 14px; }
.filters label.chk, .actions label.chk { display: inline-flex; gap: 6px; align-items: center; }
.tw { overflow-x: auto; margin: 12px 0 0; max-width: 100%; }
table.steps { border-collapse: collapse; font: 14px/1.45 var(--mono); background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.steps th { font: 700 12.5px/1.3 var(--ui, var(--font)); color: var(--muted); background: var(--panel2); text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }

pre.cout { white-space: pre-wrap; word-break: break-word; }
.fqgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 24px; margin-top: 12px; }
.fq { display: grid; grid-template-columns: 1.3em minmax(0, 1fr) auto; gap: 8px; align-items: center; font: 13.5px/1.7 var(--mono); }
.fq .bar { height: 10px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.fq .bar i { display: block; height: 100%; background: var(--accent); }
.fqgrid .lang .bar i { background: var(--faint); }
.sbin { display: block; margin-top: 12px; }

.tblock { margin-top: 22px; }
.gwrap { overflow-x: auto; max-width: 100%; }

@media (max-width: 480px) { .gstats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
label.consent { align-items: flex-start; margin: 4px 0 2px; }
label.consent input { margin-top: 3px; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: var(--r-sm); margin: 6px 0; }
.notes { display: flex; flex-direction: column; gap: 4px; }
.ans + .ans { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 8px 0; }
.ach { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; opacity: .75; }

.examgate .exCode::placeholder { letter-spacing: normal; font-size: 16px; }

.ocard h3 { margin: 10px 0 4px; font-size: 15px; }

.dump { display: grid; grid-template-columns: auto repeat(8, 34px) auto; gap: 6px; align-items: center; margin: 0 0 18px; width: max-content; max-width: 100%; }
.dump .off, .dump .hx { font: 600 14px var(--mono); color: var(--muted); }
.dump .off { padding-right: 8px; }

.bit { position: relative; width: 34px; height: 40px; border-radius: 9px; display: grid; place-items: center; font: 700 15px var(--mono); background: var(--code-bg); color: var(--muted); border: 1.5px solid var(--line); text-decoration: none; }
.bit.on { background: var(--bit); color: var(--bit-ink); border-color: var(--bit); }

.bit:hover { border-color: var(--accent); z-index: 1; }
.bit .w { position: absolute; top: -9px; left: -3px; font: 700 10px var(--font); background: var(--accent); color: var(--on-accent); border-radius: 5px; padding: 0 4px; line-height: 15px; }
.hex { font: 600 15px var(--mono); color: var(--muted); }
.hex b { color: var(--text); }
@media (prefers-reduced-motion: no-preference) {
  .dump.anim .bit.on { animation: lit .35s ease-out backwards; animation-delay: calc(var(--i) * 45ms + 150ms); }
  @keyframes lit { from { background: var(--code-bg); border-color: var(--line); color: var(--muted); transform: scale(.85); } }
  .bit.new { animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) .35s backwards; box-shadow: 0 0 0 4px var(--accent-soft); }
  @keyframes pop { 0% { background: var(--code-bg); border-color: var(--line); color: var(--muted); transform: scale(.6); } 60% { transform: scale(1.18); } }
}

const CONFIG = {"supabase_url": "https://tdyxkkylfhqpvdlbpwzs.supabase.co", "supabase_anon_key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkeXhra3lsZmhxcHZkbGJwd3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NzQyMTYsImV4cCI6MjEwODQ1MDIxNn0.5qUbBaZG2PNBJdbF1OYVjhmfjxVYYJR5dG_UhMQvsYo", "weights": {"week": 10, "prac": 10, "lab": 40, "ctrl": 20, "final": 15, "test": 5}, "uni_modules": [{"name": "Модуль 1", "short": "М1", "max": 30, "from": 1, "to": 7}, {"name": "Модуль 2", "short": "М2", "max": 30, "from": 8, "to": 15}], "bonus_max": 20};

const DEVICE = (() => {

    if (!d) { d = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); localStorage.setItem('mobak-device', d); }

function loadLocal(key) {

}
if (!SERVER) { loadLocal(KEY); if (!S.uid) S.uid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); }
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEYU, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('Браузер не даёт сохранять прогресс. Сохраняйте его в файл через меню ⋯'); } }
}
const rec = id => (S.steps[id] = S.steps[id] || {});

// понятный текст ошибки сервера
function errText(e) {
  const m = ((e && (e.message || e.error_description || e.msg)) || String(e)).replace(/^МОБАК:\s*/, '');
  if (/Database error saving new user|не входит в список группы/i.test(m)) return 'эта почта не входит в список группы — обратитесь к преподавателю';
  if (e && (e.code === 'PT429' || e.status === 429) || /rate limit|too many/i.test(m)) return 'слишком часто — подождите минуту и попробуйте снова';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'нет связи с сервером';
  if (/row-level security|permission denied/i.test(m)) return 'нет прав на это действие (чужая группа или нужна роль руководителя курса)';
  if (/roster_group_name_fkey/.test(m)) return 'такой группы нет — её создаёт руководитель курса';
  return m;
}
const isNetwork = e => /Failed to fetch|NetworkError|Load failed|fetch/i.test((e && e.message) || '') && !(e && e.code);

// очередь сдач, которые не ушли из-за сети: отправляются при следующем запуске и после каждой сдачи
const outboxKey = () => KEYU + '-outbox';
function outbox() { try { return JSON.parse(localStorage.getItem(outboxKey()) || '[]'); } catch (e) { return []; } }
function setOutbox(a) { try { localStorage.setItem(outboxKey(), JSON.stringify(a)); } catch (e) {} }
async function flushOutbox() {
  if (!sb || !ME) return;
  const left = [];
  for (const row of outbox()) {
    const { error } = await sb.from('submissions').insert(row);
    if (error && isNetwork(error)) left.push(row);
  }
  setOutbox(left);
}

// Точки связи с сервером. Время выдачи данных и время сдачи ставит сервер (триггеры в lms/supabase/schema.sql).
const API = {
  async issue(step, setNo) {
    if (!sb) return { issued_at: Date.now(), skew: 0 };
    const t0 = Date.now();
    const ins = await sb.from('datasets_issued').insert({ step_id: step.id, set_no: setNo }).select('issued_at').single();
    if (!ins.error) { const at = Date.parse(ins.data.issued_at); return { issued_at: at, skew: at - Math.round((t0 + Date.now()) / 2) }; }
    if (ins.error.code === '23505') {   // этот набор уже выдан (например, на другом устройстве)
      const old = await sb.from('datasets_issued').select('issued_at').eq('step_id', step.id).eq('set_no', setNo).single();
      if (!old.error) return { issued_at: Date.parse(old.data.issued_at), skew: null };
    }
    throw new Error(errText(ins.error));
  },
  async submit(step, kind, payload, prelim, hint) {
    if (!sb || !ME) return;
    const row = { step_id: step.id, kind, payload, prelim_score: prelim, prelim_hint: (hint || '').slice(0, 4000) || null };
    const { error } = await sb.from('submissions').insert(row);
    const r = rec(step.id);
    if (!error) { r.pending = true; save(); refreshChrome(step); flushOutbox(); return; }
    if (isNetwork(error)) { setOutbox(outbox().concat([row])); r.pending = true; save(); refreshChrome(step); toast('Нет связи с сервером: ответ сохранён и отправится позже'); }
    else toast('Сервер не принял ответ: ' + errText(error));
  },
};

// Прогресс с сервера: сдачи, проверенные баллы, выданные наборы данных. Сервер — главный источник.
async function pullProgress() {
  const [subs, scs, iss] = await Promise.all([
    sb.from('submissions').select('id, step_id, kind, payload, prelim_score, created_at').order('created_at').limit(10000),
    sb.from('scores').select('submission_id, score').limit(10000),
    sb.from('datasets_issued').select('step_id, set_no, issued_at').limit(10000)]);
  for (const x of [subs, scs, iss]) if (x.error) throw x.error;
  const ver = Object.fromEntries(scs.data.map(x => [x.submission_id, x.score]));
  const att = {};
  for (const x of subs.data) {
    const r = rec(x.step_id);
    att[x.step_id] = (att[x.step_id] || 0) + 1;
    r.score = Math.max(r.score || 0, x.prelim_score || 0);
    if (x.id in ver) r.vscore = Math.max(r.vscore === undefined ? 0 : r.vscore, ver[x.id]);
    else r.pendingSrv = true;
    if (x.kind === 'code') { if (r.code === undefined) r.code = x.payload.code; if (x.prelim_score === 1) r.solved = x.payload.code; }
    if (x.kind === 'dataset' && r.reply === undefined) r.reply = x.payload.reply;
  }
  for (const [id, n] of Object.entries(att)) { const r = rec(id); r.att = Math.max(r.att || 0, n); r.pending = !!r.pendingSrv; delete r.pendingSrv; }
  for (const d of iss.data) {   // последний выданный набор: на другом устройстве данные построятся заново по тому же seed
    const r = rec(d.step_id);
    if (d.set_no > (r.set || 0) || (d.set_no === (r.set || 0) && !r.at)) { if (d.set_no !== (r.set || 0)) delete r.ds; r.set = d.set_no; r.at = Date.parse(d.issued_at); }
  }
  save();
}

/* ---------- каталог курса ---------- */
let CAT = null;            // data/course.json: модули, уроки, шаги (без содержимого)

  if (!MOD[n]) MOD[n] = fetch('data/m' + String(n).padStart(2, '0') + '.json', { cache: 'no-cache' }).then(r => r.json());

/* ---------- утилиты ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
function el(tag, attrs = {}, html) {
  const e = document.createElement(tag);
  for (const k in attrs) { if (k === 'on') for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); else e.setAttribute(k, attrs[k]); }
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function shuffled(arr, seed) { const a = arr.slice(), r = rng(seed); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// тот же хеш, что в lms/build.py: sha256(части через U+241F)
async function sha(...parts) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(parts.map(String).join('␟')));
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const normNum = x => { const v = parseFloat(String(x).replace(',', '.')); return Number.isFinite(v) ? String(Number(v.toPrecision(12))) : null; };
const fmt = x => (Math.round(x * 100) / 100).toString().replace('.', ',');
const ofBalls = n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'балла' : 'баллов');
function toast(msg) { const t = el('div', { class: 'toast' }, esc(msg)); document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
function download(name, text) { const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })), download: name }); document.body.appendChild(a); a.click(); a.remove(); }

const TYPE = { text: 'Теория', choice: 'Тест', number: 'Числовой ответ', matching: 'Сопоставление', parsons: 'Собрать код', dataset: 'Задача на данные', code: 'Программа' };
// балл для показа: проверенный сервером, а пока есть непроверенные сдачи — лучший из проверенного и предварительного
const shownScore = r => !r ? 0 : r.vscore === undefined ? (r.score || 0) : r.pending ? Math.max(r.vscore, r.score || 0) : r.vscore;
const sc = id => shownScore(S.steps[id]);
const got = s => s.cost * sc(s.id);
const isTask = s => s.t !== 'text';
function lessonStat(l) { let g = 0, m = 0, done = 0, n = 0; l.steps.forEach(s => { if (!isTask(s)) return; n++; g += got(s); m += s.cost; if (sc(s.id) === 1) done++; }); return { g, m, done, n }; }
function modStat(M) { let g = 0, m = 0; M.lessons.forEach(l => { const t = lessonStat(l); g += t.g; m += t.m; }); return { g, m }; }
const totalGot = () => Object.values(STEPMETA).reduce((a, s) => a + got(s), 0);

/* ---------- Python в браузере (Pyodide в Web Worker) ---------- */
const RUNNER = String.raw`
import sys, io, builtins, math, random, types, json, marshal, base64, ast

def _load(src):
    m = types.ModuleType("checker")
    if src.startswith("PYC:"):
        code = marshal.loads(base64.b64decode(src[4:]))
    else:
        code = compile(src, "checker.py", "exec")
    exec(code, m.__dict__)
    return m

def _sc(r):
    hint = ""
    if isinstance(r, tuple):
        hint = str(r[1]) if len(r) > 1 and r[1] else ""
        r = r[0]
    if r is True: s = 1.0
    elif r is False or r is None: s = 0.0
    else: s = float(r)
    return s, hint

def _ds(src, seed):
    m = _load(src)
    random.seed(seed)
    g = m.generate()
    ds, clue = g if isinstance(g, tuple) else (g, m.solve(g))
    return m, ds, clue

def ds_get(src, seed):
    return _ds(src, seed)[1]

def ds_check(src, seed, reply):
    m, ds, clue = _ds(src, seed)
    s, h = _sc(m.check(reply, clue))
    return json.dumps({"score": s, "hint": h})

def ds_selftest(src, seed, bad):
    m, ds, clue = _ds(src, seed)
    ans = m.solve(ds)
    wrong = eval(bad, {"ds": ds, "ans": ans, "random": random}) if bad else ans + " 1"
    return json.dumps([_sc(m.check(ans, clue))[0], _sc(m.check(wrong, clue))[0], _sc(m.check("", clue))[0]])

import hashlib, hmac as _hmac
if not hasattr(hashlib, "pbkdf2_hmac"):
    # в Python 3.12 убрана запасная реализация на чистом Python, а в Pyodide нет OpenSSL — возвращаем её (RFC 8018)
    def pbkdf2_hmac(hash_name, password, salt, iterations, dklen=None):
        password, salt = bytes(password), bytes(salt)
        inner, outer = hashlib.new(hash_name), hashlib.new(hash_name)
        blocksize = getattr(inner, "block_size", 64)
        if len(password) > blocksize:
            password = hashlib.new(hash_name, password).digest()
        password = password + b"\x00" * (blocksize - len(password))
        inner.update(password.translate(bytes(x ^ 0x36 for x in range(256))))
        outer.update(password.translate(bytes(x ^ 0x5C for x in range(256))))

            icpy, ocpy = inner.copy(), outer.copy()
            icpy.update(msg)
            ocpy.update(icpy.digest())
            return ocpy.digest()
        if iterations < 1:
            raise ValueError(iterations)

        dkey, loop = b"", 1
        while len(dkey) < dklen:
            prev = prf(salt + loop.to_bytes(4, "big"))
            rkey = int.from_bytes(prev, "big")
            for _ in range(iterations - 1):
                prev = prf(prev)
                rkey ^= int.from_bytes(prev, "big")
            loop += 1
            dkey += rkey.to_bytes(inner.digest_size, "big")

_KEEP = ("cryptography", "numpy", "_cffi_backend", "cffi", "hashlib", "_hashlib", "hmac", "secrets", "base64", "typing")

def _snapshot():
    return dict(builtins.__dict__), dict(math.__dict__), set(sys.modules)

def _restore(snap):
    b, mt, mods = snap
    for d, saved in ((builtins.__dict__, b), (math.__dict__, mt)):
        for k in [k for k in d if k not in saved]:
            del d[k]
        for k, v in saved.items():
            if d.get(k, None) is not v:
                d[k] = v
    for k in [k for k in sys.modules if k not in mods and not k.split(".")[0] in _KEEP]:

def _run(header, code, footer, stdin, tree=None, extra=None):
    hl = header.count("\n") + 1
    cl = code.count("\n") + 1
    script = "\n".join([header, code, footer])
    snap = _snapshot()
    old = sys.stdin, sys.stdout, sys.stderr
    out = io.StringIO()
    sys.stdin, sys.stdout, sys.stderr = io.StringIO(stdin), out, io.StringIO()
    err = ""
    try:
        g = {"__name__": "__main__", "__builtins__": builtins}
        g.update(extra or {})
        exec(compile(script if tree is None else tree, "solution.py", "exec"), g)
    except SystemExit:
        pass
    except BaseException as e:
        line = getattr(e, "lineno", None) if isinstance(e, SyntaxError) else None
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == "solution.py":
                line = tb.tb_lineno
            tb = tb.tb_next
        where = ""
        if line is not None:
            if hl < line <= hl + cl:
                where = " (строка {} вашего кода)".format(line - hl)
            elif line > hl + cl:
                where = " (в проверочной части — проверьте, что функция возвращает значение нужного вида)"
        msg = e.msg if isinstance(e, SyntaxError) else e
        err = "{}: {}{}".format(type(e).__name__, msg, where)
    finally:
        sys.stdin, sys.stdout, sys.stderr = old
        _restore(snap)
    return out.getvalue(), err

def code_run(header, code, footer, stdin):
    out, err = _run(header, code, footer, stdin)
    return json.dumps({"out": out[:20000], "err": err})

def _show(v):
    if v is not None:
        print(repr(v))

def sbx_run(code, stdin):
    try:
        tree = ast.parse(chr(10).join(["", code, ""]), "solution.py")
    except SyntaxError:
        return code_run("", code, "", stdin)
    for i, st in enumerate(tree.body):
        v = st.value if isinstance(st, ast.Expr) else None

    out, err = _run("", code, "", stdin, tree, {"_mobak_show": _show})
    return json.dumps({"out": out[:20000], "err": err})

def code_check(src, header, footer, code, samples):
    m = _load(src)
    random.seed(1)
    tests = [t if isinstance(t, (list, tuple)) else (t, m.solve(t)) for t in m.generate()]
    for i, (inp, clue) in enumerate(tests):
        out, err = _run(header, code, footer, inp)
        s, h = _sc(m.check(out, clue))

            if i < samples:

            return json.dumps(r)

const WORKER = `
let py = null;
const ready = (async () => {
  importScripts('${PYODIDE}pyodide.js');
  py = await loadPyodide({ indexURL: '${PYODIDE}' });
  py.runPython(self.RUNNER_SRC);
})();
onmessage = async (e) => {
  if (e.data.runner) { self.RUNNER_SRC = e.data.runner; ready.then(() => postMessage({ ready: true }), err => postMessage({ fail: String(err) })); return; }
  const { id, op, args, imports } = e.data;
  try {
    await ready;
    if (imports) { postMessage({ id, status: 'packages' }); await py.loadPackagesFromImports(imports); }
    const r = py.globals.get(op)(...args);
    postMessage({ id, ok: true, r });
  } catch (err) { postMessage({ id, ok: false, err: String(err) }); }
};`;
const PY = { w: null, ready: null, seq: 0, pend: {}, state: 'idle', msg: '' };
function pyStatus(state, msg) { PY.state = state; PY.msg = msg || ''; document.querySelectorAll('.pystat').forEach(paintPy); }
function paintPy(e) {
  e.className = 'pystat' + (PY.state === 'fail' ? ' err' : '');
  e.textContent = PY.state === 'loading' ? 'Загружается Python (при первом открытии ~10 МБ, нужен интернет)…'
    : PY.state === 'packages' ? 'Загружаются библиотеки (cryptography / numpy) — один раз, около 10 секунд…'
    : PY.state === 'ready' ? 'Python готов' : PY.state === 'fail' ? 'Python не загрузился: нужен интернет. Обновите страницу, когда сеть появится. ' + PY.msg : '';
}
function pyStart() {
  if (PY.ready) return PY.ready;
  pyStatus('loading');
  PY.ready = new Promise((res, rej) => {
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' }))); }
    catch (e) { pyStatus('fail', String(e)); PY.ready = null; return rej(e); }
    PY.w = w;
    w.onmessage = (e) => {
      const d = e.data;
      if (d.ready) { pyStatus('ready'); return res(); }
      if (d.fail) { pyStatus('fail', d.fail); PY.ready = null; w.terminate(); return rej(new Error(d.fail)); }
      if (d.status === 'packages') { if (PY.state !== 'packages') pyStatus('packages'); return; }
      const p = PY.pend[d.id]; if (!p) return; delete PY.pend[d.id]; clearTimeout(p.timer);
      if (PY.state === 'packages') pyStatus('ready');
      d.ok ? p.res(d.r) : p.rej(new Error(d.err));
    };
    w.onerror = (e) => { pyStatus('fail', e.message || ''); PY.ready = null; rej(e); };
    w.postMessage({ runner: RUNNER });
  });
  return PY.ready;
}
// imports — текст, по импортам в котором Pyodide догрузит пакеты (cryptography, numpy); время загрузки пакетов не входит в лимит
async function py(op, args, timeout = 20000, imports = '') {
  await pyStart();
  return new Promise((res, rej) => {
    const id = ++PY.seq;
    if (imports && /^\s*(import|from)\s+(cryptography|numpy|sympy|pandas|scipy|networkx|Crypto)\b/m.test(imports)) timeout += 120000;  // первая загрузка пакетов
    const timer = setTimeout(() => {
      delete PY.pend[id]; PY.w.terminate(); PY.ready = null; pyStatus('idle');
      Object.values(PY.pend).forEach(p => p.rej(new Error('restart'))); PY.pend = {};
      const e = new Error('timeout'); e.timeout = true; rej(e); pyStart();
    }, timeout);
    PY.pend[id] = { res, rej, timer };
    PY.w.postMessage({ id, op, args, imports });
  });
}

  const box = el('div', { class: 'result', hidden: '' });
  const stat = el('div', { class: 'pystat' }); paintPy(stat);
  const check = el('button', { class: 'primary' }, 'Отправить');
  const budget = () => Math.max(30000, (s.ntests || 10) * (s.tl || 5) * 1000);
  check.addEventListener('click', async () => {
    const code = ed.get();
    if (!code.trim() || code.trim() === tpl.trim()) return toast('Сначала напишите решение');
    if (s.server) {   // в браузере эту задачу не проверить — только сохранить для серверной перепроверки
      r.code = code; r.att = (r.att || 0) + 1; r.pending = code; save();
      API.submit(s, 'code', { code }, null, '');
      return resultBox(box, 0.5, 'Решение сохранено для проверки на сервере',
        'Эту задачу браузер проверить не может: ' + esc(s.server) + '. Балл появится после серверной перепроверки. Пока можно проверить части решения кнопкой «Запустить».');
    }
    check.disabled = true; check.textContent = 'Проверяем…';
    try {
      const res = JSON.parse(await py('code_check', [s.src, s.header, s.footer, code, (s.examples || []).length], budget(), s.header + '\n' + code + '\n' + s.footer));
      setScore(s, res.ok ? 1 : 0, { code, solved: res.ok ? code : r.solved });
      API.submit(s, 'code', { code }, res.ok ? 1 : 0, res.ok ? '' : res.hint || res.err || '');
      if (res.ok) resultBox(box, 1, 'Верно! Пройдены все тесты: ' + res.total + '.');
      else {
        let t = '';
        if (res.input !== undefined) t += 'Входные данные:<pre>' + esc(res.input) + '</pre>Ожидалось:<pre>' + esc(res.expected) + '</pre>Ваш вывод:<pre>' + (esc(res.got) || '<i>(пусто)</i>') + '</pre>';
        if (res.err) t += 'Ошибка: <code>' + esc(res.err) + '</code><br>';
        if (res.hint) t += esc(res.hint) + '<br>';
        if (!res.err && !res.hint && res.input === undefined) t += 'Неверный ответ на скрытом тесте. Проверьте граничные случаи (0, 1, отрицательные, большие числа).';
        resultBox(box, 0, 'Не пройден тест №' + res.n + ' из ' + res.total, t);
      }
    } catch (e) { resultBox(box, 0, e.timeout ? 'Превышено время работы' : 'Ошибка проверки', e.timeout ? 'Программа работает слишком долго — возможно, бесконечный цикл или ожидание лишнего input().' : esc(e.message)); r.att = (r.att || 0) + 1; save(); }
    check.disabled = false; check.textContent = 'Отправить';
  });
  const runIn = el('textarea', { spellcheck: 'false' }); runIn.value = (s.examples && s.examples[0]) ? s.examples[0][0] : '';
  const runOut = el('div', { class: 'result', hidden: '' });
  const runBtn = el('button', {}, 'Запустить');
  runBtn.addEventListener('click', async () => {
    runBtn.disabled = true; runBtn.textContent = 'Выполняется…';
    try {
      const code = ed.get();
      const res = JSON.parse(await py('code_run', [s.header, code, s.footer, runIn.value], (s.tl || 5) * 3000, s.header + '\n' + code + '\n' + s.footer));
      runOut.className = 'result' + (res.err ? ' bad' : '');
      runOut.innerHTML = '<div class="ttl">Вывод программы</div><pre>' + (esc(res.out) || '<i>(пусто)</i>') + '</pre>' + (res.err ? 'Ошибка: <code>' + esc(res.err) + '</code>' : '');
      runOut.hidden = false;
    } catch (e) { runOut.className = 'result bad'; runOut.innerHTML = e.timeout ? 'Превышено время работы (возможно, бесконечный цикл).' : esc(e.message); runOut.hidden = false; }
    runBtn.disabled = false; runBtn.textContent = 'Запустить';
  });
  const det = el('details', { class: 'run' }, '<summary>Запустить код на своих входных данных</summary>');
  det.append(runIn, el('div', { class: 'actions' }), runOut); $('.actions', det).append(runBtn);
  det.addEventListener('toggle', ed.refresh);
  const reset = el('button', { class: 'link', on: { click: () => { if (confirm('Вернуть исходный шаблон? Ваш код будет удалён.')) { ed.set(tpl); r.code = tpl; save(); } } } }, 'Сбросить код');
  const acts = el('div', { class: 'actions' }); acts.append(check, reset);
  root.append(acts, box, det, stat);
  if (r.solved) resultBox(box, 1, 'Задача уже решена. Можно улучшать код и отправлять снова.');
  setTimeout(ed.refresh, 0);
};

/* ---------- оформление: key «Ключ» | ide «Рабочее место» | note «Тетрадь» ----------
   Выбор хранится в браузере (KEY-design), начальное значение ставит скрипт в <head> до отрисовки. */
const DESIGNS = {
  key: { name: 'Ключ', about: 'Урок по одному шагу, кнопки снизу. Пройденные уроки зажигают биты ключа.', sw: ['#f6f5fb', '#5b3df5', '#ffc93c', '#19162e'] },
  ide: { name: 'Рабочее место', about: 'Как редактор кода: шаги — файлы, условие и код рядом, тёмная тема.', sw: ['#12161d', '#171c25', '#f2b13d', '#5cc98d'] },
  note: { name: 'Тетрадь', about: 'Весь урок одной страницей, как в учебнике: поля, клетка, пометки.', sw: ['#fbfcfe', '#e6edf6', '#1c2b4a', '#d2423b'] },
};
const design = () => document.documentElement.dataset.design || 'key';
const oneStep = () => design() !== 'note';   // «Ключ» и «Рабочее место» показывают по одному шагу
function setDesign(d) {
  if (!DESIGNS[d]) return;
  document.documentElement.dataset.design = d;

}
function pickDesign(first) {

  const box = $('.pick', md);
  Object.entries(DESIGNS).forEach(([k, v]) => {

    b.onclick = () => { setDesign(k); box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };

/* ---------- экраны ---------- */
function badgeText(s) {
  const g = got(s), r = S.steps[s.id] || {};
  const t = s.cost ? fmt(g) + ' из ' + ofBalls(s.cost) : sc(s.id) ? 'выполнено' : 'без баллов';
  return t + (SERVER && r.att ? (r.pending ? ' · ждёт проверки' : r.vscore !== undefined ? ' · проверено' : '') : '');
}
const stCls = id => { const v = sc(id); return !v ? '' : v === 1 ? 'full' : 'part'; };
function refreshChrome(s) {
  const tg = totalGot();
  $('#score').innerHTML = (S.name ? '<span class="nm">' + esc(S.name) + '</span>' : '') + '<span class="mini"><i style="width:' + (100 * tg / CAT.total).toFixed(1) + '%"></i></span><span><b>' + fmt(tg) + '</b> из ' + CAT.total + '</span>';

}
function paintStatus() {

  st.innerHTML = '<span class="pystat"></span><span class="hide-sm">' + where + '</span><span class="grow"></span><span><b>' + fmt(totalGot()) + '</b>/' + CAT.total + ' баллов</span>' + (S.name ? '<span class="hide-sm">' + esc(S.name) + '</span>' : '');

}

let CUR = null, STEP = 0;
const OPEN = new Set();
const shortTitle = M => M.title.replace(/^Неделя \d+\.\s*|^Итоговая работа\.\s*/, '');
// шаги как файлы (для «Рабочего места»): 4-деление-с-остатком.py

const slug = t => strip(t || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').split('-').slice(0, 3).join('-') || 'шаг';
const fname = s => s.num + '-' + slug(s.title) + '.' + EXT[s.t];
const fi = s => '<span class="fi ' + EXT[s.t] + '" aria-hidden="true">' + ICON[EXT[s.t]] + '</span>';

function drawSide() {

      '<span class="wp' + (ms.m && ms.g >= ms.m ? ' full' : '') + '">' + fmt(ms.g) + '/' + ms.m + '</span><span class="wbar"><i style="width:' + (ms.m ? 100 * ms.g / ms.m : 0).toFixed(1) + '%"></i></span>');

          fi(s) + '<span class="nm">' + esc(fname(s).replace(/\.[a-z]+$/, '')) + '</span>' + (sc(s.id) === 1 ? '<span class="ok">✓</span>' : '<span>.' + EXT[s.t] + '</span>'))));

const TASK_LESSONS = () => LESSONS.filter(l => lessonStat(l).n);
const lstate = l => { const t = lessonStat(l); return !t.n ? 'none' : t.done === t.n ? 'done' : t.g > 0 ? 'part' : 'new'; };
const nextLesson = () => LESSONS.find(l => { const s = lessonStat(l); return s.n && s.done < s.n; }) || LESSONS[0];

/* главная «Ключ»: каждый урок с задачами — бит ключа, ключ показан шестнадцатеричным дампом */
function keyHex(extra) {
  const bits = TASK_LESSONS().map(l => (l === extra || lstate(l) === 'done') ? 1 : 0);
  while (bits.length % 8) bits.push(0);
  return bits.join('').match(/.{8}/g).map(b => parseInt(b, 2).toString(16).toUpperCase().padStart(2, '0')).join(' ');
}
function dumpHtml(anim, extra, onlyRow) {
  const TL = TASK_LESSONS(); let h = '', lit = 0;
  for (let r = 0; r * 8 < TL.length; r++) {
    if (onlyRow !== undefined && r !== onlyRow) continue;
    let byte = 0;
    h += '<span class="off">' + (r * 8).toString(16).toUpperCase().padStart(2, '0') + '</span>';
    for (let c = 0; c < 8; c++) {
      const i = r * 8 + c, l = TL[i];
      if (!l) { h += '<span></span>'; continue; }
      const s = l === extra ? 'done' : lstate(l), first = !i || TL[i - 1].mod !== l.mod;
      if (s === 'done') byte |= 128 >> c;
      h += '<a class="bit ' + (s === 'done' ? 'on' : s === 'part' ? 'half' : '') + (l === extra ? ' new' : '') + '" style="--i:' + (s === 'done' ? lit++ : 0) + '" href="#' + l.key + '" title="' + esc(l.mod.label + ': ' + l.title) + '">' +
        (s === 'done' ? 1 : 0) + (first ? '<span class="w">' + (l.mod.n === 15 ? 'И' : l.mod.n) + '</span>' : '') + '</a>';
    }
    h += '<span class="hx' + (byte ? '' : ' zero') + '">' + byte.toString(16).toUpperCase().padStart(2, '0') + '</span>';
  }
  return '<div class="dump' + (anim ? ' anim' : '') + '" role="img" aria-label="Ключ: ' + keyHex(extra) + '">' + h + '</div>';
}
function homeKey(m) {

  const dots = nx.steps.map(s => '<i class="' + (!isTask(s) ? 'th' : sc(s.id) === 1 ? 'ok' : '') + '"></i>').join('');
  const kh = el('section', { class: 'kh' }, '<div><h1>Соберите ключ из ' + TL.length + ' бит</h1><p>Каждый урок с задачами — один бит. Решили все задачи урока, и бит загорается. Наполовину жёлтый бит — урок начат. Метка над битом — номер недели, с которой он начинается.</p>' +
    dumpHtml(true) + '<div class="hex">Ключ сейчас: <b>' + keyHex() + '</b>, горит ' + lit + ' ' + plural(lit, 'бит', 'бита', 'бит') + ' из ' + TL.length + '</div></div>');
  const now = el('aside', { class: 'now' }, '<div class="w">' + (totalGot() ? 'Сейчас: ' : 'Начните с урока: ') + esc(nx.mod.label) + '</div><h2>' + esc(nx.title) + '</h2><div class="dots">' + dots + '</div>');
  now.appendChild(el('button', { class: 'primary', on: { click: () => location.hash = nx.key } }, totalGot() ? 'Продолжить' : 'Начать курс'));
  now.appendChild(el('div', { class: 'sum' }, 'Решено задач в уроке: ' + nxs.done + ' из ' + nxs.n));
  const pys = el('div', { class: 'pystat' }); paintPy(pys); now.appendChild(pys);
  kh.appendChild(now); m.appendChild(kh);
  testBanner(m);
  m.appendChild(el('div', { class: 'sec-h' }, '<h2>Недели</h2><span class="small">' + fmt(totalGot()) + ' из ' + CAT.total + ' баллов</span>'));
  const route = el('section', { class: 'route' });

    route.appendChild(el('a', { class: 'wk' + (ms.g ? ' has' : ''), href: '#' + M.lessons[0].key },
      '<span class="n">' + (M.n === 15 ? 'И' : M.n) + '</span><span><span class="t">' + esc(shortTitle(M)) + '</span><br><span class="ls">' + M.lessons.length + ' ' + plural(M.lessons.length, 'урок', 'урока', 'уроков') + ', пройдено ' + done + '</span><span class="mini-bits">' + mini + '</span></span>' +
      '<span class="sc">' + fmt(ms.g) + ' из ' + ms.m + '<small>баллов</small></span>'));

/* главная «Рабочее место»: README и список нерешённых задач («Проблемы») */

    '<div class="resume"><div class="w">' + (totalGot() ? 'Продолжить: ' : 'Начать: ') + esc(nx.mod.label) + '</div><div class="t">' + esc(nx.title) + '</div></div>' +
    '<h2 class="md-h" data-h="##">Клавиши</h2><div class="keys"><span><kbd>Alt</kbd>+<kbd>→</kbd></span><span>следующий шаг</span><span><kbd>Alt</kbd>+<kbd>←</kbd></span><span>предыдущий шаг</span><span><kbd>Ctrl</kbd>+<kbd>B</kbd></span><span>скрыть проводник</span></div>' +
    '<h2 class="md-h" data-h="##">Прогресс по неделям</h2><div class="prog">' + prog + '</div></div>' +
    '<div class="problems"><div class="ph"><b>Проблемы<span class="cnt">' + unsolved.length + '</span></b><span>Сначала начатые уроки</span></div>' + (probs || '<a href="#">Нерешённых задач нет</a>') + '</div></div>');
  $('.resume', ws).appendChild(el('button', { class: 'primary', on: { click: () => location.hash = nx.key } }, 'Открыть урок'));
  const pys = el('div', { class: 'pystat' }); paintPy(pys); $('.resume', ws).appendChild(pys);
  m.appendChild(ws); testBanner(ws);

/* главная «Тетрадь»: титульный лист и оглавление учебника */
function homeNote(m) {
  const nx = nextLesson(), TL = TASK_LESSONS(), done = TL.filter(l => lstate(l) === 'done').length;

    '<p class="lead">От делимости и остатков до AES, RSA и эллиптических кривых. Каждую формулу вы проверите кодом на Python прямо на странице.</p>' +
    '<p class="meta">' + (S.name ? esc(S.name) + ': ' : '') + 'набрано <b>' + fmt(totalGot()) + '</b> из ' + CAT.total + ', пройдено уроков <b>' + done + '</b> из ' + TL.length + '</p><div class="cont"></div>');
  $('.cont', tp).append(el('button', { class: 'primary', on: { click: () => location.hash = nx.key } }, totalGot() ? 'Продолжить урок' : 'Начать курс'),

  m.appendChild(tp); testBanner(m);

function showStep(n, quiet) {

  const a = m.querySelector('.stepbar a.cur'); if (a && a.scrollIntoView) a.scrollIntoView({ block: 'nearest', inline: 'nearest' });

  window.scrollTo(0, quiet ? 0 : Math.min(window.scrollY, m.querySelector('.stepbar').offsetTop - 8));
}
function goStep(n) {
  if (oneStep()) return showStep(n);

}

/* ---------- запись по ссылке ---------- */
// ?join=<код> — ссылка преподавателя. Код (и ФИО со страницы записи) хранится в браузере, пока запись не закончена:
// ссылка из письма открывает сайт уже без ?join.
const JKEY = KEY + '-join';
function pendingJoin() {
  const q = new URLSearchParams(location.search).get('join');
  if (q) { saveJoin({ code: q.trim().toLowerCase() }); history.replaceState(null, '', location.pathname + location.hash); }
  try { const j = JSON.parse(localStorage.getItem(JKEY) || 'null'); if (j && j.code && Date.now() - j.at < 2 * 864e5) return j; } catch (e) {}
  return null;
}
function saveJoin(j) { try { localStorage.setItem(JKEY, JSON.stringify(Object.assign({}, j, { at: Date.now() }))); } catch (e) {} }
function doneJoin() { try { localStorage.removeItem(JKEY); } catch (e) {} }

/* ---------- вход по почте (код из письма) ---------- */
// join — запись в группу по ссылке: { code, group, term }; тогда спрашиваем ещё ФИО, а код приглашения уходит в запрос письма
function loginScreen(msg, join) {
  $('#side').innerHTML = ''; document.body.classList.add('bare');
  const m = $('#main'); m.innerHTML = '';
  // вход в два шага: почта → код из письма (ссылка из того же письма тоже работает)
  const box = el('div', { class: 'hero' }, '<div class="eyebrow">МОБАК · ' + (join ? 'запись в группу ' + esc(join.group) : 'вход в курс') + '</div><h1>Математические основы и базовые алгоритмы криптографии</h1><p class="lead"></p>');
  const lead = $('.lead', box), form = el('div', { class: 'login-form' }), res = el('div', { class: 'result', hidden: '' });
  const say = (cls, html) => { res.className = 'result ' + cls; res.innerHTML = html; res.hidden = false; };
  const acts = (...b) => { const a = el('div', { class: 'actions' }); a.append(...b); return a; };
  let email = '', timer = null, fio = (join && join.name) || '';
  const send = async e => {
    const options = { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true };
    if (join) options.data = { invite: join.code, full_name: fio };   // триггер на auth.users пропустит почту не из списка с действующим кодом
    const { error } = await sb.auth.signInWithOtp({ email: e, options });
    if (error) say('bad', 'Не получилось отправить письмо: ' + esc(join && /Database error saving new user/i.test(error.message || '') ? 'ссылка для записи больше не действует — попросите у преподавателя новую' : errText(error)) + '.');
    return !error;
  };
  const askEmail = () => {
    clearInterval(timer);
    if (join) lead.innerHTML = 'Вы записываетесь на курс в группу <b>' + esc(join.group) + '</b>' + (join.term ? ' (' + esc(join.term) + ')' : '') + '. Укажите фамилию и имя, как в журнале, и почту — на неё придёт письмо с кодом для входа. Пароль не нужен.';
    else lead.textContent = 'Введите почту, которую вы дали преподавателю. На неё придёт письмо с кодом для входа. Пароль не нужен.';
    form.innerHTML = '';
    const nm = join ? el('input', { type: 'text', class: 'answer', placeholder: 'Фамилия Имя', autocomplete: 'name', 'aria-label': 'Фамилия и имя', maxlength: '120' }) : null;
    if (nm) nm.value = fio;
    const inp = el('input', { type: 'email', class: 'answer', placeholder: 'почта@пример.ru', autocomplete: 'email', 'aria-label': 'Почта' }); inp.value = email;
    const btn = el('button', { class: 'primary' }, join ? 'Записаться' : 'Получить код');
    const cons = el('label', { class: 'chk consent' }, '<input type="checkbox"> <span>Согласен(на) на обработку моих данных (ФИО, почта, ответы и баллы) для учёта успеваемости по курсу. <a href="#" class="ppLink">Подробнее</a></span>');
    try { $('input', cons).checked = !!localStorage.getItem(KEY + '-consent'); } catch (e) {}
    $('.ppLink', cons).onclick = e => { e.preventDefault(); privacyModal(); };
    const go = async () => {
      const e = inp.value.trim().toLowerCase();
      if (!$('input', cons).checked) return toast('Отметьте согласие на обработку данных');
      try { localStorage.setItem(KEY + '-consent', new Date().toISOString()); } catch (x) {}
      if (nm) {
        fio = nm.value.trim().replace(/\s+/g, ' ');
        if (fio.split(' ').length < 2 || fio.length < 5) { nm.focus(); return toast('Введите фамилию и имя'); }
        saveJoin(Object.assign({}, join, { name: fio }));
      }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast('Введите почту');
      btn.disabled = true; btn.textContent = 'Отправляем…';
      const ok = await send(e);
      btn.disabled = false; btn.textContent = join ? 'Записаться' : 'Получить код';
      if (ok) { email = e; askCode(); }
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    if (nm) nm.addEventListener('keydown', e => { if (e.key === 'Enter') inp.focus(); });
    btn.addEventListener('click', go);
    const extra = [];
    if (join) extra.push(el('button', { class: 'link', on: { click: () => { doneJoin(); loginScreen(); } } }, 'Я уже в списке группы — просто войти'));
    form.append(...(nm ? [nm] : []), inp, cons, acts(btn, ...extra)); (nm && !fio ? nm : inp).focus();
  };
  const askCode = () => {
    lead.innerHTML = 'Код отправлен на <b>' + esc(email) + '</b>. Введите код из письма — или просто откройте ссылку из него. Письма нет несколько минут — проверьте «Спам» и «Промоакции».';
    res.hidden = true; form.innerHTML = '';
    const code = el('input', { type: 'text', class: 'answer otp', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '8', placeholder: 'Код из письма', 'aria-label': 'Код из письма' });
    const ok = el('button', { class: 'primary' }, 'Войти');
    const again = el('button', { class: 'link' }), other = el('button', { class: 'link' }, 'Другая почта');
    let left = 0;
    const tick = () => { again.disabled = left > 0; again.textContent = left > 0 ? 'Отправить код ещё раз через ' + left + ' с' : 'Отправить код ещё раз'; if (left > 0) left--; else clearInterval(timer); };
    const wait = () => { clearInterval(timer); left = 60; tick(); timer = setInterval(tick, 1000); };   // почта Supabase: не чаще раза в минуту
    wait();
    again.addEventListener('click', async () => { if (left > 0) return; again.disabled = true; if (await send(email)) { say('ok', 'Новый код отправлен на ' + esc(email) + '.'); wait(); } else again.disabled = false; });
    other.addEventListener('click', askEmail);
    const verify = async () => {
      const token = code.value.replace(/\D/g, '');
      if (token.length < 6) return toast('Введите код из письма');
      ok.disabled = true; ok.textContent = 'Проверяем…';
      const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
      if (error) {
        ok.disabled = false; ok.textContent = 'Войти';
        say('bad', /expired|invalid/i.test(error.message || '') ? 'Код неверный или устарел. Проверьте цифры или отправьте новый код.' : 'Не получилось войти: ' + esc(errText(error)) + '.');
        code.select(); return;
      }
      clearInterval(timer); location.reload();
    };
    code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, '').slice(0, 8); });
    code.addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
    ok.addEventListener('click', verify);
    form.append(code, acts(ok, again, other)); code.focus();
  };
  if (msg) say('bad', esc(msg));
  box.append(form, res); m.appendChild(box);
  $('#score').textContent = '';
  askEmail();
}

/* ---------- контрольная на паре (студент) ----------
   Преподаватель открывает контрольную во вкладке «Контрольная» панели; студент входит по коду с доски. Сервер
   (exam_gate в schema.sql) принимает сдачи КТ и итогового теста только во время контрольной, с устройства входа
   (заголовок x-mobak-device), из сети аудитории и Safe Exam Browser, если преподаватель так задал. Сайт ведёт журнал:
   уходы со страницы и из полноэкранного режима, вставки текста извне (длинные — запрещены). Курс остаётся открыт. */
const isCtrlLesson = l => ['ctrl', 'test'].includes(category(l.title));
const inSEB = () => !!window.SafeExamBrowser || /\bSEB\/\d/.test(navigator.userAgent);
const SEB_FILE = 'exam/mobak-exam.seb';
let EXAMS = null, EXAMS_AT = 0;   // идущие контрольные группы студента (my_exams), кеш на 20 с
let EXAM = null;                  // контрольная, в которую студент вошёл с этого устройства
async function myExams(force) {
  if (!sb || !ME || ME.role !== 'student') return [];
  if (!force && EXAMS && Date.now() - EXAMS_AT < 20000) return EXAMS;
  const { data, error } = await sb.rpc('my_exams').then(r => r, e => ({ error: e }));
  EXAMS = error ? [] : data || []; EXAMS_AT = Date.now();
  return EXAMS;
}
async function sebInfo() {
  const S = window.SafeExamBrowser;
  if (!S || !S.security) return { seb: inSEB() };
  try { if (S.security.updateKeys) await new Promise(ok => { S.security.updateKeys(ok); setTimeout(ok, 1500); }); } catch (e) {}
  return { seb: true, url: location.href.split('#')[0], hash: S.security.configKey || '' };
}
function sebLinks() {
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  return '<a href="' + esc(base.replace(/^https?:/, 'sebs:') + SEB_FILE) + '">открыть в Safe Exam Browser</a> · <a href="' + esc(SEB_FILE) + '" download>скачать файл контрольной</a> · ' +
    '<a href="https://safeexambrowser.org/download_en.html" target="_blank" rel="noopener">установить Safe Exam Browser</a> (Windows, macOS)';
}
// экран входа в контрольную вместо урока
function examGate(m, l, ex, want) {
  m.className = ''; m.innerHTML = '';
  m.appendChild(el('h1', { class: 'lesson-h' }, esc(l.title)));
  const box = el('section', { class: 'pblock examgate' });
  const until = new Date(ex.ends_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (ex.joined && ex.device !== DEVICE) {
    box.innerHTML = '<h2>Контрольная открыта на другом устройстве</h2><p>Сдавать её можно только там, где вы вошли. Если устройство сломалось или браузер закрылся — подойдите к преподавателю: он сбросит вход, и вы войдёте снова.</p>';
    m.appendChild(box); return;
  }
  box.innerHTML = '<h2>Контрольная идёт до ' + until + '</h2>' +
    '<p>Введите код с доски. Войти можно один раз и только с этого устройства. Во время контрольной курс открыт, но уходы со страницы и вставка текста извне записываются.</p>' +
    (ex.require_seb && !inSEB() ? '<p class="result bad">Эту контрольную пишут в Safe Exam Browser: ' + sebLinks() + '.</p>' : '') +
    '<div class="filters"><label>Код <input class="exCode" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]*" placeholder="6 цифр"></label></div>';
  const go = pbtn('Войти в контрольную', async () => {
    const code = $('.exCode', box).value.replace(/\D/g, '');
    if (code.length !== 6) return toast('Код — 6 цифр с доски');
    go.disabled = true;
    const { data, error } = await sb.rpc('exam_join', { p_code: code, p_device: DEVICE, p_seb: await sebInfo() }).then(r => r, e => ({ error: e }));
    go.disabled = false;
    if (error) return toast(errText(error));
    if (!data || !data.ok) return toast((data && data.error) || 'не удалось войти');
    try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {}
    await myExams(true);
    lesson(l, want);

function startExamMode(ex) {

  EXAM = { exam_id: ex.exam_id, section_id: ex.section_id, ends_at: ex.ends_at, status: ex.status || 'active' };
  if (!examTimer) {
    let tick = 0;
    examTimer = setInterval(() => {
      examBar();
      if (++tick % 5 === 0) examFlush();
      if (EXAM && Date.parse(EXAM.ends_at) < Date.now() - 60000) { examFlush(); EXAM = null; examBar(); }
    }, 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { awayFrom.hidden = Date.now(); examLog('hidden'); }

    });

    window.addEventListener('focus', () => { if (awayFrom.blur) examLog('focus', { sec: Math.round((Date.now() - awayFrom.blur) / 1000) }); awayFrom.blur = 0; });
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) examLog('fullscreen_exit'); examBar(); });

      const t = ((e.clipboardData && e.clipboardData.getData('text/plain')) || '').trim();
      if (!t) return;
      const own = !!examCopied && t === examCopied.trim();
      if (own || t.length <= 20) return examLog('paste', { len: t.length, own });
      e.preventDefault(); e.stopPropagation();
      examLog('paste_blocked', { len: t.length });
      toast('На контрольной вставлять текст извне нельзя — попытка записана');
    }, true);
    document.addEventListener('drop', e => {
      if (!EXAM || EXAM.status !== 'active') return;

    }, true);

}

}

function category(lesson) {

// лектор — на сайте его нет, буквенную оценку без него не посчитать. Поменять — uni_modules и bonus_max в lms/config.json.

// вклад каждой категории в рейтинг из 100: вес × доля баллов категории, набранных в срок (как rating() в weekly_report.py).
// U — модуль вуза: только его недели, веса делятся на сумму весов частей, которые в нём есть.
// rej — работы, по которым студент «не допущен» устной проверкой: их баллы не засчитываются
function ratingParts(bestByStep, rej, U) {
  const got = {}, max = {};

    if (!s.cost || (U && (s.lesson.mod.n < U.from || s.lesson.mod.n > U.to))) return;
    const c = category(s.lesson.title); max[c] = (max[c] || 0) + s.cost;
    const b = bestByStep[s.id]; if (b && !(rej && rej.has(itemOf(s.lesson.title)))) got[c] = (got[c] || 0) + s.cost * (b.best_on_time || 0);
  });
  const W = Object.keys(WEIGHTS).reduce((a, c) => a + (max[c] ? WEIGHTS[c] : 0), 0) || 100;
  return Object.keys(WEIGHTS).filter(c => max[c] || !U).map(c => ({ c, w: max[c] ? 100 * WEIGHTS[c] / W : 0, got: got[c] || 0, max: max[c] || 0,
    part: max[c] ? 100 * WEIGHTS[c] / W * (got[c] || 0) / max[c] : 0 }));
}

function uniOf(bestByStep, rej, bonus) {
  const mods = UNI.map(U => { const parts = ratingParts(bestByStep, rej, U), r = parts.reduce((a, x) => a + x.part, 0); return { U, parts, rating: r, points: r * U.max / 100 }; });

}

function groupCard(g, td, rows, now) {
  const st = rows.filter(x => x.r.group_name === g.group_name), joined = st.filter(x => x.p).length;
  const viaLink = st.filter(x => x.r.source === 'invite').length, fresh = st.filter(x => x.r.source === 'invite' && now - Date.parse(x.r.added_at) < 7 * DAY).length;
  const pend = st.reduce((a, x) => a + x.pend, 0), lazy = st.filter(x => idle(x, now)).length, rej = st.filter(x => x.rej.size).length;
  const avg = st.length ? st.reduce((a, x) => a + x.uni.total, 0) / st.length : 0;
  const nd = nextDue(td, g.group_name, now);
  const staff = td.tg.filter(t => t.group_name === g.group_name).map(t => nameOf(td, t.email) + ((td.roster.find(r => r.email === t.email) || {}).role === 'assistant' ? ' (ассистент)' : ''));
  const c = el('section', { class: 'gcard' + (g.archived ? ' archived' : '') });
  c.innerHTML = '<header><h2>' + esc(g.group_name) + '</h2>' + (g.term ? '<span class="small">' + esc(g.term) + '</span>' : '') + (g.archived ? '<span class="badge">архив</span>' : '') + '</header>' +
    '<div class="gstats"><div><b>' + st.length + '</b><span>' + plural(st.length, 'студент', 'студента', 'студентов') + '</span></div><div><b>' + joined + '</b><span>вошли на сайт</span></div>' +
    '<div><b>' + fmt(avg) + '</b><span title="' + UNI.map(u => u.short).join(' + ') + ' + доп., без экзамена">средний итог</span></div><div><b>' + pend + '</b><span>ждут проверки</span></div></div>' +
    '<ul class="gnotes">' + [nd ? 'Ближайший срок: ' + esc(nd.label) + ' — ' + fmtDate(nd.due) : 'Ближайших сроков нет',
      lazy ? '<span class="warn">без сдач больше недели: ' + lazy + '</span>' : '',
      rej ? '<span class="warn">не допущены по устной проверке: ' + rej + '</span>' : '',
      viaLink ? 'записались по ссылке: ' + viaLink + (fresh ? ' (за неделю — ' + fresh + ')' : '') : '',
      'Ведут: ' + (staff.length ? staff.map(esc).join(', ') : '<b>не назначены</b>')].filter(Boolean).map(x => '<li>' + x + '</li>').join('') + '</ul>';
  if (!g.archived) c.appendChild(inviteBlock(g, td));
  const a = el('div', { class: 'actions' });
  a.append(pbtn('Ведомость', () => { setGroup(g.group_name); location.hash = 'teacher/sheet'; }, true),
    pbtn('Устная проверка', () => { setGroup(g.group_name); location.hash = 'teacher/oral'; }),
    pbtn('Сроки', () => { DLG = g.group_name; location.hash = 'teacher/deadlines'; }));
  if (isTeacher()) a.append(pbtn('Добавить списком', () => addStudents(td, g.group_name)));
  if (isAdmin()) a.append(pbtn(g.archived ? 'Вернуть из архива' : 'В архив', async () => {
    if (!g.archived && !confirm('Отправить группу ' + g.group_name + ' в архив? Данные останутся, ссылка для записи перестанет работать.')) return;
    const { error } = await sb.from('groups').update({ archived: !g.archived }).eq('group_name', g.group_name);
    if (error) return toast(errText(error));
    reloadPanel('');
  }));
  c.appendChild(a);
  return c;
}

/* ссылка для записи в группу: ?join=<код>; код генерирует сервер (group_invites.code) */
const joinUrl = code => location.origin + location.pathname + '?join=' + code;
const inviteText = (g, url) => 'Курс «МОБАК», группа ' + g + '.\nЗапишитесь по ссылке: ' + url + '\nНужна только почта: на неё придёт код для входа, пароль не нужен.';
function inviteBlock(g, td) {
  const inv = td.inv.find(x => x.group_name === g.group_name);
  const live = inv && (!inv.expires_at || Date.parse(inv.expires_at) > Date.now());
  const b = el('div', { class: 'invite' + (live ? ' on' : '') });
  if (live) {
    const url = joinUrl(inv.code);
    b.innerHTML = '<div class="ih"><b>Запись по ссылке открыта</b> ' + (inv.expires_at ? 'до ' + fmtDate(inv.expires_at) : 'без срока') + '</div>' +
      '<input type="text" readonly class="ilink" aria-label="Ссылка для записи в группу ' + esc(g.group_name) + '"><div class="actions"></div>' +
      '<p class="small">Разошлите ссылку в чат группы. Студент вводит ФИО и почту, подтверждает её кодом из письма — и сразу попадает в группу.</p>';
    const inp = $('.ilink', b); inp.value = url; inp.onclick = () => inp.select();
    $('.actions', b).append(pbtn('Копировать ссылку', () => copy(url), true), pbtn('Копировать приглашение', () => copy(inviteText(g.group_name, url))));
    if (isTeacher()) $('.actions', b).append(
      linkBtn('Новая ссылка', async () => { if (confirm('Сделать новую ссылку? Старая перестанет работать; уже записавшиеся останутся в группе.')) await makeInvite(g.group_name, inv.expires_at); }),
      linkBtn('Закрыть запись', async () => {
        if (!confirm('Закрыть запись по ссылке для группы ' + g.group_name + '? Уже записавшиеся останутся в группе.')) return;
        const { error } = await sb.from('group_invites').delete().eq('group_name', g.group_name);
        if (error) return toast(errText(error));
        reloadPanel('');
      }));
  } else if (isTeacher()) {
    b.innerHTML = '<div class="ih">' + (inv ? 'Ссылка истекла ' + fmtDate(inv.expires_at) + '.' : 'Запись по ссылке закрыта.') + ' Откройте её — студенты запишутся сами.</div>' +
      '<div class="actions"><label class="small">Ссылка действует <select class="idays"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="">без срока</option></select></label></div>';
    $('.actions', b).appendChild(pbtn('Открыть запись по ссылке', () => { const d = $('.idays', b).value; makeInvite(g.group_name, d ? new Date(Date.now() + d * DAY).toISOString() : null); }, true));
  } else b.innerHTML = '<div class="ih">Запись по ссылке закрыта — открыть её может преподаватель группы.</div>';
  return b;
}
// новая ссылка: прежняя строка удаляется, новый код ставит сервер (значение по умолчанию group_invites.code)
async function makeInvite(gname, expiresAt) {
  const del = await sb.from('group_invites').delete().eq('group_name', gname);
  if (del.error) return toast(errText(del.error));
  const { error } = await sb.from('group_invites').insert({ group_name: gname, expires_at: expiresAt && Date.parse(expiresAt) > Date.now() ? expiresAt : null });
  if (error) return toast(errText(error));
  await reloadPanel('');
  toast('Ссылка для записи готова — скопируйте и разошлите');
}

function newGroupCard() {
  const c = el('section', { class: 'gcard new' }, '<header><h2>Новая группа</h2></header>' +
    '<div class="filters"><label>Код группы <input type="text" class="ngN" placeholder="ИБ-1-24" maxlength="40"></label><label>Семестр <input type="text" class="ngT" placeholder="2026-осень"></label></div>' +
    '<label class="chk"><input type="checkbox" class="ngI" checked> сразу открыть запись по ссылке на 30 дней</label>' +
    (isAdmin() ? '<label class="chk"><input type="checkbox" class="ngMe" checked> я сам веду эту группу</label>' : '') + '<div class="actions"></div>');
  $('.actions', c).appendChild(pbtn('Создать группу', async () => {
    const n = $('.ngN', c).value.trim(), term = $('.ngT', c).value.trim(), me = !isAdmin() || $('.ngMe', c).checked;

/* преподаватели и ассистенты (руководитель): кто какие группы ведёт, назначить и снять */
function teachersBlock(td, groups) {
  const box = el('section', { class: 'pblock tblock' }, '<h2>Преподаватели и ассистенты</h2><p class="small">Преподаватель видит и ведёт только назначенные ему группы: студентов, сдачи, сроки, продления и ссылку для записи. Ассистент видит те же группы, ставит устные проверки и пишет замечания, но не меняет список, сроки и продления.</p>');
  const staff = td.roster.filter(r => r.role !== 'student').sort((a, b) => a.full_name.localeCompare(b.full_name, 'ru'));
  const t = el('table', { class: 'grade' });
  t.innerHTML = '<tr><th>Кто</th><th>Почта</th><th>Группы</th></tr>' + staff.map(r => '<tr><td>' + esc(r.full_name) + ' <span class="badge">' + ROLE_NAMES[r.role] + '</span></td><td>' + esc(r.email) + '</td><td>' +
    (td.tg.filter(x => x.email === r.email).map(x => '<span class="badge">' + esc(x.group_name) + ' <button class="link" title="Снять с группы" data-un="' + esc(x.email) + '" data-g="' + esc(x.group_name) + '">×</button></span>').join(' ') || '<span class="small">—</span>') + '</td></tr>').join('');
  t.querySelectorAll('[data-un]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('teacher_groups').delete().eq('email', b.dataset.un).eq('group_name', b.dataset.g);
    if (error) return toast(errText(error));
    reloadPanel('');
  });
  box.appendChild(el('div', { style: 'overflow-x:auto' })).appendChild(t);
  const f = el('div', { class: 'filters' }, '<label>Группа <select class="tcG">' + groupOptions(groups.filter(g => !g.archived), '', []) + '</select></label>' +
    '<label>Почта <input type="email" class="tcE" list="tcList" placeholder="teacher@kstu.kg"></label>' +
    '<label>ФИО <input type="text" class="tcN" placeholder="если почты ещё нет в списке"></label>' +
    '<label>Роль <select class="tcR"><option value="teacher">преподаватель</option><option value="assistant">ассистент</option></select></label>' +
    '<datalist id="tcList">' + staff.map(r => '<option value="' + esc(r.email) + '">' + esc(r.full_name) + '</option>').join('') + '</datalist>');
  f.appendChild(pbtn('Назначить', async () => {
    const g = $('.tcG', f).value, email = $('.tcE', f).value.trim().toLowerCase(), fio = $('.tcN', f).value.trim(), role = $('.tcR', f).value;
    if (!g) return toast('Сначала создайте группу');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Введите почту');
    const ex = td.roster.find(r => r.email === email);
    if (ex && ex.role === 'student') return toast('Эта почта в списке как студент группы ' + (ex.group_name || '—'));
    if (!ex) {

      if (error) return toast(errText(error));
    }
    const { error } = await sb.from('teacher_groups').upsert({ email, group_name: g }, { onConflict: 'email,group_name', ignoreDuplicates: true });
    if (error) return toast(errText(error));
    reloadPanel('');
  }, true));
  box.appendChild(f);
  return box;
}
