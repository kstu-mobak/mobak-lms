/* ---------- контрольная на паре (студент) ----------
   Преподаватель открывает контрольную во вкладке «Контрольная» панели; студент входит по коду с доски. Сервер
   (exam_gate в schema.sql) принимает сдачи КТ и итогового теста только во время контрольной, с устройства входа
   (заголовок x-mobak-device), из сети аудитории и Safe Exam Browser, если преподаватель так задал. Сайт ведёт журнал:
   уходы со страницы и из полноэкранного режима, вставки текста извне (длинные — запрещены). Курс остаётся открыт. */
const isCtrlLesson = l => ['ctrl', 'test'].includes(category(l.title));
const inSEB = () => !!window.SafeExamBrowser || /\bSEB\/\d/.test(navigator.userAgent);
const SEB_FILE = 'exam/mobak-exam.seb';
let EXAMS = null, EXAMS_AT = 0;   // идущие контрольные группы студента (my_exams), кеш на 20 с
let EXAM = null;                  // контрольная, в которую студент вошёл с этого устройства
async function myExams(force) {
  if (!sb || !ME || ME.role !== 'student') return [];
  if (!force && EXAMS && Date.now() - EXAMS_AT < 20000) return EXAMS;
  const { data, error } = await sb.rpc('my_exams').then(r => r, e => ({ error: e }));
  EXAMS = error ? [] : data || []; EXAMS_AT = Date.now();
  return EXAMS;
}
async function sebInfo() {
  const S = window.SafeExamBrowser;
  if (!S || !S.security) return { seb: inSEB() };
  try { if (S.security.updateKeys) await new Promise(ok => { S.security.updateKeys(ok); setTimeout(ok, 1500); }); } catch (e) {}
  return { seb: true, url: location.href.split('#')[0], hash: S.security.configKey || '' };
}
function sebLinks() {
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  return '<a href="' + esc(base.replace(/^https?:/, 'sebs:') + SEB_FILE) + '">открыть в Safe Exam Browser</a> · <a href="' + esc(SEB_FILE) + '" download>скачать файл контрольной</a> · ' +
    '<a href="https://safeexambrowser.org/download_en.html" target="_blank" rel="noopener">установить Safe Exam Browser</a> (Windows, macOS)';
}
// экран входа в контрольную вместо урока
function examGate(m, l, ex, want) {
  m.className = ''; m.innerHTML = '';
  m.appendChild(el('h1', { class: 'lesson-h' }, esc(l.title)));
  const box = el('section', { class: 'pblock examgate' });
  const until = new Date(ex.ends_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (ex.joined && ex.device !== DEVICE) {
    box.innerHTML = '<h2>Контрольная открыта на другом устройстве</h2><p>Сдавать её можно только там, где вы вошли. Если устройство сломалось или браузер закрылся — подойдите к преподавателю: он сбросит вход, и вы войдёте снова.</p>';
    m.appendChild(box); return;
  }
  box.innerHTML = '<h2>Контрольная идёт до ' + until + '</h2>' +
    '<p>Введите код с доски. Войти можно один раз и только с этого устройства. Во время контрольной курс открыт, но уходы со страницы и вставка текста извне записываются.</p>' +
    (ex.require_seb && !inSEB() ? '<p class="result bad">Эту контрольную пишут в Safe Exam Browser: ' + sebLinks() + '.</p>' : '') +
    '<div class="filters"><label>Код <input class="exCode" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]*" placeholder="6 цифр"></label></div>';
  const go = pbtn('Войти в контрольную', async () => {
    const code = $('.exCode', box).value.replace(/\D/g, '');
    if (code.length !== 6) return toast('Код — 6 цифр с доски');
    go.disabled = true;
    const { data, error } = await sb.rpc('exam_join', { p_code: code, p_device: DEVICE, p_seb: await sebInfo() }).then(r => r, e => ({ error: e }));
    go.disabled = false;
    if (error) return toast(errText(error));
    if (!data || !data.ok) return toast((data && data.error) || 'не удалось войти');
    try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {}
    await myExams(true);
    lesson(l, want);
  }, true);
  box.appendChild(go);
  $('.exCode', box).addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
  m.appendChild(box);
}
// журнал контрольной: события копятся и уходят пачкой раз в 5 секунд
const EXQ = [];
function examLog(kind, detail) {
  if (!EXAM || EXAM.status !== 'active') return;
  EXQ.push({ exam_id: EXAM.exam_id, user_id: ME.user_id, kind, detail: detail || null });
}
async function examFlush() {
  if (!EXQ.length || !sb) return;
  const rows = EXQ.splice(0, 50);
  const { error } = await sb.from('exam_events').insert(rows).then(r => r, e => ({ error: e }));
  if (error && isNetwork(error)) EXQ.unshift(...rows);
}
let examCopied = '', awayFrom = { hidden: 0, blur: 0 }, examTimer = null;
function examSelText() {
  const a = document.activeElement, cm = a && a.closest && a.closest('.CodeMirror');
  if (cm && cm.CodeMirror) return cm.CodeMirror.getSelection();
  return String(window.getSelection() || '');
}
// полоса контрольной: текст обновляется каждую секунду, кнопки — только при смене состояния (чтобы клик не терялся)
function examBar() {
  let b = $('#exambar');
  if (!EXAM) { if (b) b.remove(); return; }
  if (!b) { b = el('div', { id: 'exambar', class: 'exambar', role: 'status' }, '<span class="t"></span><span class="b"></span>'); document.body.appendChild(b); }
  const left = Date.parse(EXAM.ends_at) - Date.now(), live = EXAM.status === 'active' && left > 0;
  const mm = Math.max(0, Math.floor(left / 60000)), ss = Math.max(0, Math.floor(left / 1000) % 60);
  $('.t', b).textContent = EXAM.status !== 'active' ? 'Контрольная завершена — сдачи по ней больше не принимаются'
    : left <= 0 ? 'Время контрольной вышло'
    : 'Контрольная · осталось ' + mm + ':' + String(ss).padStart(2, '0') + ' · уходы со страницы и вставки записываются';
  const st = (live ? 'live' : 'off') + (document.fullscreenElement ? '-fs' : '');
  if (b.dataset.st === st) return;
  b.dataset.st = st;
  const btns = $('.b', b); btns.innerHTML = '';
  if (!live) return;
  if (document.fullscreenEnabled && !document.fullscreenElement) btns.appendChild(el('button', { on: { click: () => document.documentElement.requestFullscreen().catch(() => {}) } }, 'На весь экран'));
  btns.appendChild(el('button', { on: { click: async () => {
    if (!confirm('Завершить контрольную? После этого сдавать её задачи будет нельзя.')) return;
    await examFlush();
    const { error } = await sb.rpc('exam_finish', { p_exam: EXAM.exam_id }).then(r => r, e => ({ error: e }));
    if (error) return toast(errText(error));
    EXAM.status = 'finished'; EXAMS = null; examBar(); toast('Контрольная завершена');
  } } }, 'Завершить'));
}
function startExamMode(ex) {
  if (EXAM && EXAM.exam_id === ex.exam_id) { EXAM.status = ex.status; examBar(); return; }
  EXAM = { exam_id: ex.exam_id, section_id: ex.section_id, ends_at: ex.ends_at, status: ex.status || 'active' };
  if (!examTimer) {
    let tick = 0;
    examTimer = setInterval(() => {
      examBar();
      if (++tick % 5 === 0) examFlush();
      if (EXAM && Date.parse(EXAM.ends_at) < Date.now() - 60000) { examFlush(); EXAM = null; examBar(); }
    }, 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { awayFrom.hidden = Date.now(); examLog('hidden'); }
      else { examLog('visible', { sec: awayFrom.hidden ? Math.round((Date.now() - awayFrom.hidden) / 1000) : null }); awayFrom.hidden = 0; examFlush(); }
    });
    window.addEventListener('blur', () => { awayFrom.blur = Date.now(); examLog('blur'); });
    window.addEventListener('focus', () => { if (awayFrom.blur) examLog('focus', { sec: Math.round((Date.now() - awayFrom.blur) / 1000) }); awayFrom.blur = 0; });
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) examLog('fullscreen_exit'); examBar(); });
    const copied = () => { if (EXAM) examCopied = examSelText(); };
    document.addEventListener('copy', copied, true);
    document.addEventListener('cut', copied, true);
    document.addEventListener('paste', e => {
      if (!EXAM || EXAM.status !== 'active') return;
      const t = ((e.clipboardData && e.clipboardData.getData('text/plain')) || '').trim();
      if (!t) return;
      const own = !!examCopied && t === examCopied.trim();
      if (own || t.length <= 20) return examLog('paste', { len: t.length, own });
      e.preventDefault(); e.stopPropagation();
      examLog('paste_blocked', { len: t.length });
      toast('На контрольной вставлять текст извне нельзя — попытка записана');
    }, true);
    document.addEventListener('drop', e => {
      if (!EXAM || EXAM.status !== 'active') return;
      e.preventDefault(); e.stopPropagation(); examLog('paste_blocked', { drop: true });
    }, true);
  }
  examBar();
}
// после входа: студент уже вошёл в контрольную с этого устройства (страницу обновили) — журнал продолжается
async function examResume() {
  const ex = (await myExams(true)).find(e => e.joined && e.device === DEVICE && e.status === 'active');
  if (ex) startExamMode(ex);
}
// урок контрольной: если по его модулю идёт контрольная — вход по коду; true — урок не показывать
let EXAM_MODE = null;
async function examCheck(m, l, want) {
  if (!SERVER || !ME || ME.role !== 'student' || !isCtrlLesson(l)) return false;
  const ex = (await myExams()).find(e => e.section_id === l.mod.sectionId);
  if (!ex) {
    if (EXAM_MODE === null) { const r = await sb.rpc('my_exam_mode').then(x => x, e => ({ error: e })); EXAM_MODE = !r.error && !!r.data; }
    if (!EXAM_MODE) return false;
    m.className = ''; m.innerHTML = '';
    m.appendChild(el('h1', { class: 'lesson-h' }, esc(l.title)));
    m.appendChild(el('section', { class: 'pblock examgate' }, '<h2>Контрольная откроется на паре</h2><p>Когда преподаватель её начнёт, обновите страницу и введите код с доски. ' +
      'Если контрольную пишут в Safe Exam Browser, подготовьте его заранее: ' + sebLinks() + '.</p>'));
    return true;
  }
  if (!ex.joined || ex.device !== DEVICE) { examGate(m, l, ex, want); return true; }
  startExamMode(ex);
  return false;
}

// ошибки сайта у вошедших — в client_errors (руководитель видит их в «Журнале»); не больше 10 за загрузку
const ERRS = new Set();
function reportError(message, stack) {
  if (!sb || !ME || ERRS.size >= 10 || ERRS.has(message)) return;
  ERRS.add(message);
  sb.from('client_errors').insert({ message: String(message).slice(0, 1000), stack: stack ? String(stack).slice(0, 4000) : null,
    page: (location.hash || '#').slice(0, 300), user_agent: navigator.userAgent.slice(0, 400) }).then(() => {}, () => {});
}
window.addEventListener('error', e => reportError(e.message || 'ошибка', e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => { const r = e.reason; if (!isNetwork(r)) reportError('Promise: ' + ((r && r.message) || r), r && r.stack); });

/* ---------- панель преподавателя ---------- */
const WEIGHTS = (CONFIG && CONFIG.weights) || { week: 10, prac: 10, lab: 40, ctrl: 20, final: 15, test: 5 };
// категория шага по названию урока — то же правило, что category() в stepik/teacher/weekly_report.py
function category(lesson) {
  if (lesson.startsWith('Итоговый тест')) return 'test';
  if (/КТ-\d|Входная/.test(lesson)) return 'ctrl';
  if (lesson.startsWith('ЛР-')) return 'lab';
  if (/^П\d/.test(lesson)) return 'prac';
  if (lesson.startsWith('Итоговая работа')) return 'final';
  return 'week';
}
const CAT_NAMES = { week: 'Задачи недели', prac: 'Практики', lab: 'ЛР', ctrl: 'КТ', final: 'Итоговая работа', test: 'Итоговый тест' };
// работа для устной проверки (допуска) — начало названия урока: ЛР-2, КТ-1, П3, «Итоговая работа»
const itemOf = title => { const m = /^(ЛР-\d+|КТ-\d+|П\d+|Итоговая работа|Итоговый тест)/.exec(title || ''); return m ? m[1] : null; };
// модули вуза: в каждом свой рейтинг из 100 (веса WEIGHTS среди частей курса, которые в модуле есть) — коэффициент,
// баллы модуля = рейтинг × max / 100. Допбаллы (до BONUS_MAX) ставит преподаватель вручную; экзамен (40) ставит
// лектор — на сайте его нет, буквенную оценку без него не посчитать. Поменять — uni_modules и bonus_max в lms/config.json.
const UNI = (CONFIG && CONFIG.uni_modules) || [{ name: 'Модуль 1', short: 'М1', max: 30, from: 1, to: 7 }, { name: 'Модуль 2', short: 'М2', max: 30, from: 8, to: 15 }];
const BONUS_MAX = (CONFIG && CONFIG.bonus_max) || 20;
const UNI_MAX = UNI.reduce((a, u) => a + u.max, 0);
const uniWeeks = U => 'недели ' + U.from + '–' + Math.min(U.to, 14) + (U.to >= 15 ? ' и итоговая работа' : '');
const DAY = 864e5;
// роли: teacher — свои группы (teacher_groups), assistant — те же группы, но без изменения списка, сроков и ссылок,
// admin — руководитель курса, всё
const isStaff = () => !!ME && ['teacher', 'admin', 'assistant'].includes(ME.role);
const isTeacher = () => !!ME && (ME.role === 'teacher' || ME.role === 'admin');
const isAdmin = () => !!ME && ME.role === 'admin';
const ROLE_NAMES = { student: 'студент', teacher: 'преподаватель', admin: 'руководитель курса', assistant: 'ассистент' };
const pbtn = (text, fn, primary) => el('button', primary ? { class: 'primary', on: { click: fn } } : { on: { click: fn } }, text);
const linkBtn = (text, fn) => el('button', { class: 'link', on: { click: fn } }, text);
let TD = null;   // данные панели: roster, profiles, best (v_best), сроки, группы, ссылки, устные проверки — только то, что разрешает RLS
async function teacherData(force) {
  if (TD && !force && Date.now() - TD.at < 60000) return TD;
  const names = ['roster', 'profiles', 'v_best', 'deadlines', 'extensions', 'groups', 'teacher_groups', 'group_deadlines', 'group_invites', 'oral_checks', 'bonus_points'];
  const res = await Promise.all(names.map(t => sb.from(t).select('*').limit(100000)));
  for (const x of res) if (x.error) throw x.error;
  const [roster, profiles, best, deadlines, ext, groups, tg, gd, inv, oral, bonus] = res.map(x => x.data);
  TD = { roster, profiles, best, deadlines, ext, groups, tg, gd, inv, oral, bonus, at: Date.now() };
  return TD;
}
const reloadPanel = async sub => { TD = null; await teacher(sub); };
// вклад каждой категории в рейтинг из 100: вес × доля баллов категории, набранных в срок (как rating() в weekly_report.py).
// U — модуль вуза: только его недели, веса делятся на сумму весов частей, которые в нём есть.
// rej — работы, по которым студент «не допущен» устной проверкой: их баллы не засчитываются
function ratingParts(bestByStep, rej, U) {
  const got = {}, max = {};
  Object.values(STEPMETA).forEach(s => {
    if (!s.cost || (U && (s.lesson.mod.n < U.from || s.lesson.mod.n > U.to))) return;
    const c = category(s.lesson.title); max[c] = (max[c] || 0) + s.cost;
    const b = bestByStep[s.id]; if (b && !(rej && rej.has(itemOf(s.lesson.title)))) got[c] = (got[c] || 0) + s.cost * (b.best_on_time || 0);
  });
  const W = Object.keys(WEIGHTS).reduce((a, c) => a + (max[c] ? WEIGHTS[c] : 0), 0) || 100;
  return Object.keys(WEIGHTS).filter(c => max[c] || !U).map(c => ({ c, w: max[c] ? 100 * WEIGHTS[c] / W : 0, got: got[c] || 0, max: max[c] || 0,
    part: max[c] ? 100 * WEIGHTS[c] / W * (got[c] || 0) / max[c] : 0 }));
}
const rating = (bestByStep, rej) => ratingParts(bestByStep, rej).reduce((a, x) => a + x.part, 0);
// баллы для ведомости вуза: модули (рейтинг × max / 100), допбаллы, итого без экзамена
function uniOf(bestByStep, rej, bonus) {
  const mods = UNI.map(U => { const parts = ratingParts(bestByStep, rej, U), r = parts.reduce((a, x) => a + x.part, 0); return { U, parts, rating: r, points: r * U.max / 100 }; });
  const b = Math.min(BONUS_MAX, Math.max(0, +bonus || 0));
  return { mods, bonus: b, total: mods.reduce((a, x) => a + x.points, 0) + b };
}
const rejectedOf = (oral, uid) => new Set((oral || []).filter(o => o.user_id === uid && o.status === 'rejected').map(o => o.item));
function studentRows(td) {
  const prof = Object.fromEntries(td.profiles.map(p => [p.email, p]));
  return td.roster.filter(r => r.role === 'student').map(r => {
    const p = prof[r.email], best = {}, rej = p ? rejectedOf(td.oral, p.user_id) : new Set();
    if (p) td.best.filter(b => b.user_id === p.user_id).forEach(b => { best[b.step_id] = b; });
    const mods = CAT.modules.map(M => M.lessons.reduce((a, l) => a + (rej.has(itemOf(l.title)) ? 0 : l.steps.reduce((x, s) => x + s.cost * ((best[s.id] || {}).best_on_time || 0), 0)), 0));
    const late = Object.values(best).reduce((a, b) => a + (b.best_late && !b.best_on_time ? 1 : 0), 0);
    const last = Object.values(best).reduce((a, b) => (b.last_at > a ? b.last_at : a), '');
    const pend = Object.values(best).reduce((a, b) => a + (b.attempts - b.verified), 0);
    const parts = ratingParts(best, rej), rt = parts.reduce((a, x) => a + x.part, 0);
    const bonusRow = p ? (td.bonus || []).find(b => b.user_id === p.user_id) : null;
    return { r, p, best, rej, mods, parts, total: mods.reduce((a, x) => a + x, 0), rating: rt, uni: uniOf(best, rej, bonusRow && bonusRow.points), bonusRow, late, last, pend };
  }).sort((a, b) => a.r.full_name.localeCompare(b.r.full_name, 'ru'));
}
const fmtDate = t => t ? new Date(t).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const nameOf = (td, email) => (td.roster.find(r => r.email === email) || {}).full_name || email;
const nameByUid = (td, uid) => { const p = td.profiles.find(x => x.user_id === uid); return p ? nameOf(td, p.email) : uid; };
// студент давно ничего не сдавал (или вошёл и ещё не начал)
const idle = (x, now) => !!x.p && (!x.last || now - Date.parse(x.last) > 7 * DAY);

// группы, которые ведёт вошедший: руководителю — все, преподавателю и ассистенту — назначенные; архивные в конце
function myGroups(td) {
  const mine = isAdmin() ? td.groups : td.groups.filter(g => td.tg.some(t => t.email === ME.email && t.group_name === g.group_name));
  return mine.slice().sort((a, b) => (!!a.archived - !!b.archived) || a.group_name.localeCompare(b.group_name, 'ru'));
}
// выбранная в панели группа (в браузере преподавателя): '' — все текущие группы, '-' — студенты без группы (руководителю)
const GKEY = () => KEY + '-group';
function curGroup(td) {
  let g = ''; try { g = localStorage.getItem(GKEY()) || ''; } catch (e) {}
  return (g === '-' && isAdmin()) || myGroups(td).some(x => x.group_name === g) ? g : '';
}
function setGroup(g) { try { localStorage.setItem(GKEY(), g); } catch (e) {} }
function groupOptions(groups, cur, extra) {
  const o = (v, t) => '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(t) + '</option>';
  const act = groups.filter(g => !g.archived), arch = groups.filter(g => g.archived);
  return (extra || []).map(([v, t]) => o(v, t)).join('') + act.map(g => o(g.group_name, g.group_name + (g.term ? ' · ' + g.term : ''))).join('') +
    (arch.length ? '<optgroup label="Архив">' + arch.map(g => o(g.group_name, g.group_name + (g.term ? ' · ' + g.term : ''))).join('') + '</optgroup>' : '');
}
// студенты выбранной группы ('' — все текущие, '-' — без группы)
function inGroup(rows, td, g) {
  const arch = new Set(td.groups.filter(x => x.archived).map(x => x.group_name));
  return rows.filter(x => g === '' ? !arch.has(x.r.group_name) : g === '-' ? !x.r.group_name : x.r.group_name === g);
}
function groupBar(m, td, g, onchange, extraHtml) {
  const bar = el('div', { class: 'filters' }, '<label>Группа <select class="pgSel">' + groupOptions(myGroups(td), g, [['', 'Все текущие группы']].concat(isAdmin() ? [['-', 'Без группы']] : [])) + '</select></label>' + (extraHtml || ''));
  $('.pgSel', bar).onchange = e => { setGroup(e.target.value); onchange(e.target.value); };
  m.appendChild(bar);
  return bar;
}
// ближайший срок группы: срок группы по модулю, иначе общий
function nextDue(td, gname, now) {
  return CAT.modules.map(M => {
    const d = td.gd.find(x => x.group_name === gname && x.section_id === M.sectionId) || td.deadlines.find(x => x.section_id === M.sectionId) || {};
    return { label: M.label, due: d.due_at };
  }).filter(x => x.due && Date.parse(x.due) > now).sort((a, b) => Date.parse(a.due) - Date.parse(b.due))[0];
}
// срок модуля для группы (без продлений): строка группы, иначе общая
const dueOf = (td, gname, sid) => (td.gd.find(x => x.group_name === gname && x.section_id === sid) || td.deadlines.find(x => x.section_id === sid) || {}).due_at;

// вкладки панели
const TABS = [['', 'Группы'], ['sheet', 'Ведомость'], ['oral', 'Устная проверка'], ['exam', 'Контрольная'], ['stats', 'Аналитика'], ['deadlines', 'Сроки'], ['log', 'Журнал']];
function panelTabs(m, cur) {
  const t = el('nav', { class: 'ptabs', 'aria-label': 'Панель преподавателя' });

    const a = el('a', { href: '#teacher' + (k ? '/' + k : '') }, name);

async function teacher(sub) {
  CUR = null; drawSide();
  const m = $('#main'); m.innerHTML = '<div class="loading">Загрузка…</div>';
  const isUid = /^[0-9a-f-]{36}$/i.test(sub || '');
  let td;
  try { td = await teacherData(); } catch (e) { m.innerHTML = '<div class="result bad">Не удалось загрузить данные: ' + esc(errText(e)) + '</div>'; return; }
  m.innerHTML = '';
  if (isUid) return teacherStudent(m, studentRows(td).find(x => x.p && x.p.user_id === sub), td);
  const page = { sheet: sheetPage, oral: oralPage, exam: examPage, stats: statsPage, deadlines: deadlinesPage, log: logPage }[sub] || panelHome;
  return page(m, td);
}

// перепроверка отстаёт: сдачи ждут сервер дольше 2 часов в часы её работы (08:00–23:00 по Бишкеку)
async function graderBanner(slot) {
  const { data, error } = await sb.rpc('grader_status');
  const g = !error && data && data[0];
  if (!g || !g.pending || !g.oldest_pending) return;
  const age = Date.now() - Date.parse(g.oldest_pending), h = (new Date().getUTCHours() + 6) % 24;
  if (age < 2 * 36e5 || h < 10) return;
  const b = el('div', { class: 'result bad' }, '<b>Перепроверка отстаёт.</b> ' + g.pending + ' ' + plural(g.pending, 'сдача ждёт', 'сдачи ждут', 'сдач ждут') + ' сервер, самая ранняя — с ' + fmtDate(g.oldest_pending) +
    '. Последняя проверка: ' + fmtDate(g.last_verified) + '. Посмотрите запуски в GitHub: kstu-mobak/mobak-grader → Actions.');
  slot.appendChild(b);
}

/* группы: карточка на группу — студенты, рейтинг, сроки, ссылка для записи */

    const d = el('details', { class: 'arch' }, '<summary>Архив — ' + arch.length + ' ' + plural(arch.length, 'группа', 'группы', 'групп') + '</summary>');

function groupCard(g, td, rows, now) {
  const st = rows.filter(x => x.r.group_name === g.group_name), joined = st.filter(x => x.p).length;
  const viaLink = st.filter(x => x.r.source === 'invite').length, fresh = st.filter(x => x.r.source === 'invite' && now - Date.parse(x.r.added_at) < 7 * DAY).length;
  const pend = st.reduce((a, x) => a + x.pend, 0), lazy = st.filter(x => idle(x, now)).length, rej = st.filter(x => x.rej.size).length;
  const avg = st.length ? st.reduce((a, x) => a + x.uni.total, 0) / st.length : 0;
  const nd = nextDue(td, g.group_name, now);
  const staff = td.tg.filter(t => t.group_name === g.group_name).map(t => nameOf(td, t.email) + ((td.roster.find(r => r.email === t.email) || {}).role === 'assistant' ? ' (ассистент)' : ''));
  const c = el('section', { class: 'gcard' + (g.archived ? ' archived' : '') });
  c.innerHTML = '<header><h2>' + esc(g.group_name) + '</h2>' + (g.term ? '<span class="small">' + esc(g.term) + '</span>' : '') + (g.archived ? '<span class="badge">архив</span>' : '') + '</header>' +
    '<div class="gstats"><div><b>' + st.length + '</b><span>' + plural(st.length, 'студент', 'студента', 'студентов') + '</span></div><div><b>' + joined + '</b><span>вошли на сайт</span></div>' +
    '<div><b>' + fmt(avg) + '</b><span>средний балл (' + UNI.map(u => u.short).join(' + ') + ' + доп.)</span></div><div><b>' + pend + '</b><span>ждут проверки</span></div></div>' +
    '<ul class="gnotes">' + [nd ? 'Ближайший срок: ' + esc(nd.label) + ' — ' + fmtDate(nd.due) : 'Ближайших сроков нет',
      lazy ? '<span class="warn">без сдач больше недели: ' + lazy + '</span>' : '',
      rej ? '<span class="warn">не допущены по устной проверке: ' + rej + '</span>' : '',
      viaLink ? 'записались по ссылке: ' + viaLink + (fresh ? ' (за неделю — ' + fresh + ')' : '') : '',
      'Ведут: ' + (staff.length ? staff.map(esc).join(', ') : '<b>не назначены</b>')].filter(Boolean).map(x => '<li>' + x + '</li>').join('') + '</ul>';
  if (!g.archived) c.appendChild(inviteBlock(g, td));
  const a = el('div', { class: 'actions' });
  a.append(pbtn('Ведомость', () => { setGroup(g.group_name); location.hash = 'teacher/sheet'; }, true),
    pbtn('Устная проверка', () => { setGroup(g.group_name); location.hash = 'teacher/oral'; }),
    pbtn('Сроки', () => { DLG = g.group_name; location.hash = 'teacher/deadlines'; }));
  if (isTeacher()) a.append(pbtn('Добавить списком', () => addStudents(td, g.group_name)));
  if (isAdmin()) a.append(pbtn(g.archived ? 'Вернуть из архива' : 'В архив', async () => {
    if (!g.archived && !confirm('Отправить группу ' + g.group_name + ' в архив? Данные останутся, ссылка для записи перестанет работать.')) return;
    const { error } = await sb.from('groups').update({ archived: !g.archived }).eq('group_name', g.group_name);
    if (error) return toast(errText(error));
    reloadPanel('');
  }));
  c.appendChild(a);
  return c;
}

/* ссылка для записи в группу: ?join=<код>; код генерирует сервер (group_invites.code) */
const joinUrl = code => location.origin + location.pathname + '?join=' + code;
const inviteText = (g, url) => 'Курс «МОБАК», группа ' + g + '.\nЗапишитесь по ссылке: ' + url + '\nНужна только почта: на неё придёт код для входа, пароль не нужен.';
function inviteBlock(g, td) {
  const inv = td.inv.find(x => x.group_name === g.group_name);
  const live = inv && (!inv.expires_at || Date.parse(inv.expires_at) > Date.now());
  const b = el('div', { class: 'invite' + (live ? ' on' : '') });
  if (live) {
    const url = joinUrl(inv.code);
    b.innerHTML = '<div class="ih"><b>Запись по ссылке открыта</b> ' + (inv.expires_at ? 'до ' + fmtDate(inv.expires_at) : 'без срока') + '</div>' +
      '<input type="text" readonly class="ilink" aria-label="Ссылка для записи в группу ' + esc(g.group_name) + '"><div class="actions"></div>' +
      '<p class="small">Разошлите ссылку в чат группы. Студент вводит ФИО и почту, подтверждает её кодом из письма — и сразу попадает в группу.</p>';
    const inp = $('.ilink', b); inp.value = url; inp.onclick = () => inp.select();
    $('.actions', b).append(pbtn('Копировать ссылку', () => copy(url), true), pbtn('Копировать приглашение', () => copy(inviteText(g.group_name, url))));
    if (isTeacher()) $('.actions', b).append(
      linkBtn('Новая ссылка', async () => { if (confirm('Сделать новую ссылку? Старая перестанет работать; уже записавшиеся останутся в группе.')) await makeInvite(g.group_name, inv.expires_at); }),
      linkBtn('Закрыть запись', async () => {
        if (!confirm('Закрыть запись по ссылке для группы ' + g.group_name + '? Уже записавшиеся останутся в группе.')) return;
        const { error } = await sb.from('group_invites').delete().eq('group_name', g.group_name);
        if (error) return toast(errText(error));
        reloadPanel('');
      }));
  } else if (isTeacher()) {
    b.innerHTML = '<div class="ih">' + (inv ? 'Ссылка истекла ' + fmtDate(inv.expires_at) + '.' : 'Запись по ссылке закрыта.') + ' Откройте её — студенты запишутся сами.</div>' +
      '<div class="actions"><label class="small">Ссылка действует <select class="idays"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="">без срока</option></select></label></div>';
    $('.actions', b).appendChild(pbtn('Открыть запись по ссылке', () => { const d = $('.idays', b).value; makeInvite(g.group_name, d ? new Date(Date.now() + d * DAY).toISOString() : null); }, true));
  } else b.innerHTML = '<div class="ih">Запись по ссылке закрыта — открыть её может преподаватель группы.</div>';

}
// новая ссылка: прежняя строка удаляется, новый код ставит сервер (значение по умолчанию group_invites.code)
async function makeInvite(gname, expiresAt) {
  const del = await sb.from('group_invites').delete().eq('group_name', gname);
  if (del.error) return toast(errText(del.error));
  const { error } = await sb.from('group_invites').insert({ group_name: gname, expires_at: expiresAt && Date.parse(expiresAt) > Date.now() ? expiresAt : null });
  if (error) return toast(errText(error));
  await reloadPanel('');
  toast('Ссылка для записи готова — скопируйте и разошлите');
}

/* преподаватели и ассистенты (руководитель): кто какие группы ведёт, назначить и снять */

  const staff = td.roster.filter(r => r.role !== 'student').sort((a, b) => a.full_name.localeCompare(b.full_name, 'ru'));
  const t = el('table', { class: 'grade' });
  t.innerHTML = '<tr><th>Кто</th><th>Почта</th><th>Группы</th></tr>' + staff.map(r => '<tr><td>' + esc(r.full_name) + ' <span class="badge">' + ROLE_NAMES[r.role] + '</span></td><td>' + esc(r.email) + '</td><td>' +
    (td.tg.filter(x => x.email === r.email).map(x => '<span class="badge">' + esc(x.group_name) + ' <button class="link" title="Снять с группы" data-un="' + esc(x.email) + '" data-g="' + esc(x.group_name) + '">×</button></span>').join(' ') || '<span class="small">—</span>') + '</td></tr>').join('');
  t.querySelectorAll('[data-un]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('teacher_groups').delete().eq('email', b.dataset.un).eq('group_name', b.dataset.g);
    if (error) return toast(errText(error));
    reloadPanel('');
  });
  box.appendChild(el('div', { style: 'overflow-x:auto' })).appendChild(t);
  const f = el('div', { class: 'filters' }, '<label>Группа <select class="tcG">' + groupOptions(groups.filter(g => !g.archived), '', []) + '</select></label>' +
    '<label>Почта <input type="email" class="tcE" list="tcList" placeholder="teacher@kstu.kg"></label>' +
    '<label>ФИО <input type="text" class="tcN" placeholder="если почты ещё нет в списке"></label>' +
    '<label>Роль <select class="tcR"><option value="teacher">преподаватель</option><option value="assistant">ассистент</option></select></label>' +
    '<datalist id="tcList">' + staff.map(r => '<option value="' + esc(r.email) + '">' + esc(r.full_name) + '</option>').join('') + '</datalist>');
  f.appendChild(pbtn('Назначить', async () => {
    const g = $('.tcG', f).value, email = $('.tcE', f).value.trim().toLowerCase(), fio = $('.tcN', f).value.trim(), role = $('.tcR', f).value;
    if (!g) return toast('Сначала создайте группу');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Введите почту');
    const ex = td.roster.find(r => r.email === email);
    if (ex && ex.role === 'student') return toast('Эта почта в списке как студент группы ' + (ex.group_name || '—'));
    if (!ex) {
      if (!fio) return toast('Укажите ФИО: этой почты ещё нет в списке');

    }
    const { error } = await sb.from('teacher_groups').upsert({ email, group_name: g }, { onConflict: 'email,group_name', ignoreDuplicates: true });
    if (error) return toast(errText(error));
    reloadPanel('');
  }, true));
  box.appendChild(f);
  return box;
}

    const rows = filtered();
    info.textContent = 'Студентов: ' + shown.length + (rows.length !== shown.length ? ', найдено: ' + rows.length : '') + ', вошли на сайт: ' + shown.filter(x => x.p).length + '.';

        x.mods.map(v => '<td>' + (v ? fmt(v) : '') + '</td>').join('') + '<td><b>' + fmt(x.total) + '</b></td>' + x.uni.mods.map(u => '<td title="рейтинг модуля ' + fmt(u.rating) + ' из 100">' + fmt(u.points) + '</td>').join('') +
        '<td>' + (x.uni.bonus ? fmt(x.uni.bonus) : '') + '</td><td><b>' + fmt(x.uni.total) + '</b></td><td>' + (x.pend || '') + '</td><td>' + fmtDate(x.last) + '</td><td class="st">' + status(x) + '</td></tr>').join('');

    wrap.innerHTML = ''; wrap.appendChild(t);

  q.addEventListener('input', () => { SHEET.q = q.value; draw(); });
  draw();
}

/* карточка студента: баллы по модулям, ответы и замечания, устные проверки, продление, перевод, исключение */
function teacherStudent(m, x, td) {
  if (!x) { m.innerHTML = '<div class="result bad">Студент не найден.</div>'; return; }
  m.appendChild(el('div', { class: 'crumbs' }, '<a href="#teacher/sheet">← Ведомость</a>'));
  m.appendChild(el('h1', { class: 'lesson-h' }, esc(x.r.full_name)));
  m.appendChild(el('p', { class: 'small' }, esc(x.r.email) + (x.r.group_name ? ' · группа ' + esc(x.r.group_name) : '') + ' · ' + (x.r.source === 'invite' ? 'записался по ссылке ' : 'в списке с ') + fmtDate(x.r.added_at) +
    ' · согласие на обработку данных: ' + (x.r.consent_at ? fmtDate(x.r.consent_at) : 'не отмечено') +
    ' · баллы в срок ' + fmt(x.total) + ' из ' + CAT.total + ' · ' + x.uni.mods.map(u => u.U.short + ' ' + fmt(u.points) + ' из ' + u.U.max).join(' · ') +
    ' · доп. ' + fmt(x.uni.bonus) + ' · итого без экзамена ' + fmt(x.uni.total)));
  const ex = td.ext.filter(e => e.user_id === x.p.user_id);
  if (ex.length) m.appendChild(el('p', { class: 'small' }, 'Продления: ' + ex.map(e => esc((CAT.modules.find(M => M.sectionId === e.section_id) || { label: e.section_id }).label) + ' — до ' + fmtDate(e.due_at)).join(', ')));
  const acts = el('div', { class: 'actions' });
  if (isTeacher()) {
    const others = myGroups(td).filter(g => !g.archived && g.group_name !== x.r.group_name);
    acts.append(pbtn('Продлить срок', () => extendForm([x], x.p.user_id)));
    if (others.length) {
      const sel = el('select', { 'aria-label': 'Перевести в группу' }, '<option value="">Перевести в группу…</option>' + groupOptions(others, '', []));
      sel.onchange = async () => {
        if (!sel.value || !confirm('Перевести ' + x.r.full_name + ' в группу ' + sel.value + '? Сроки и «в срок» пересчитаются по новой группе.')) { sel.value = ''; return; }
        const { error } = await sb.from('roster').update({ group_name: sel.value }).eq('email', x.r.email);
        if (error) { sel.value = ''; return toast(errText(error)); }
        TD = null; toast('Переведён в группу ' + sel.value); teacher(x.p.user_id);
      };
      acts.append(sel);
    }
    acts.append(pbtn('Исключить из курса', async () => {
      if (!confirm('Исключить ' + x.r.full_name + ' из курса? Сдачи и баллы сохранятся, но сдавать новые задачи и входить в группу студент не сможет. Вернуть — добавить почту заново.')) return;
      const { error } = await sb.from('roster').delete().eq('email', x.r.email);
      if (error) return toast(errText(error));
      TD = null; toast('Студент исключён'); location.hash = 'teacher/sheet';
    }));
  }
  if (acts.children.length) m.appendChild(acts);
  m.appendChild(bonusBlock(x));
  m.appendChild(oralBlock(x, td, () => teacher(x.p.user_id)));
  CAT.modules.forEach(M => {
    const tasks = M.lessons.flatMap(l => l.steps.filter(s => isTask(s)).map(s => [l, s]));
    const done = tasks.filter(([, s]) => x.best[s.id]);
    const det = el('details', { class: 'pblock' }, '<summary><b>' + esc(M.label) + '</b> — ' + fmt(x.mods[M.n - 1]) + ' из ' + modStat(M).m + ' · сдано шагов ' + done.length + ' из ' + tasks.length + '</summary>');
    const t = el('table');
    t.innerHTML = '<tr><th>Урок · шаг</th><th>Баллы</th><th>В срок</th><th>После срока</th><th>Попыток</th><th>Последняя</th><th></th></tr>' +
      tasks.map(([l, s]) => { const b = x.best[s.id]; return '<tr><td>' + esc(l.title) + ' · ' + s.num + ' ' + esc(s.title) + '</td><td>' + s.cost + '</td><td>' + (b && b.best_on_time !== null ? fmt(b.best_on_time * s.cost) : '') + '</td><td>' + (b && b.best_late !== null ? fmt(b.best_late * s.cost) : '') + '</td><td>' + (b ? b.attempts + (b.attempts > b.verified ? ' (ждут ' + (b.attempts - b.verified) + ')' : '') : '') + '</td><td>' + (b ? fmtDate(b.last_at) : '') + '</td><td>' + (b ? '<button class="link" data-s="' + s.id + '">ответ и замечание</button>' : '') + '</td></tr>'; }).join('');
    t.querySelectorAll('button[data-s]').forEach(bt => bt.onclick = () => showAnswer(x, +bt.dataset.s));
    det.appendChild(el('div', { style: 'overflow-x:auto' })).appendChild(t);
    m.appendChild(det);
  });
}

// устные проверки студента по работам курса: допущен / не допущен / не проверялся
const ITEMS = () => [...new Set(LESSONS.map(l => itemOf(l.title)).filter(Boolean))];
// модули вуза и допбаллы студента; допбаллы меняет преподаватель (не ассистент)

      '<label>За что <input type="text" class="bnN" maxlength="500" placeholder="олимпиада, доклад, помощь группе" value="' + esc((x.bonusRow && x.bonusRow.note) || '') + '"></label>');

        : sb.from('bonus_points').upsert({ user_id: x.p.user_id, points: pts, note: $('.bnN', f).value.trim() || null }, { onConflict: 'user_id' });

function oralBlock(x, td, after, only) {
  const box = el('section', { class: 'pblock' }, '<h2>Устная проверка (допуск)</h2><p class="small">«Не допущен» — баллы за работу не идут в рейтинг, пока студент не объяснит свой код (тогда отметьте «допущен»).</p>');

  const t = el('table', { class: 'grade oral' });
  t.innerHTML = '<tr><th>Работа</th><th>Итог</th><th>Комментарий</th><th>Кто, когда</th></tr>' + items.map(it => {
    const o = td.oral.find(z => z.user_id === x.p.user_id && z.item === it) || {};
    return '<tr data-it="' + esc(it) + '"><td>' + esc(it) + '</td><td><select aria-label="Итог по ' + esc(it) + '"><option value="">не проверялся</option><option value="admitted"' + (o.status === 'admitted' ? ' selected' : '') + '>допущен</option><option value="rejected"' + (o.status === 'rejected' ? ' selected' : '') + '>не допущен</option></select></td>' +
      '<td><input type="text" maxlength="1000" value="' + esc(o.note || '') + '" placeholder="что спросили, что ответил"></td><td class="small">' + (o.checked_by ? esc(nameOf(td, o.checked_by)) + ', ' + fmtDate(o.checked_at) : '') + '</td></tr>';
  }).join('');
  t.querySelectorAll('tr[data-it]').forEach(tr => {

  m.appendChild(el('p', { class: 'small' }, 'Как в недельном отчёте: кандидаты — высокое и заметное структурное сходство решений (сравниваются необычные части кода; общие для задачи конструкции не в счёт), «ЛР высоко / КТ низко» и случайная выборка ~10 % группы, не больше ' + ORAL_CFG.max_per_week + ' человек за пару. Сходство — повод поговорить, а не доказательство списывания.'));
  const out = el('div', {}, '<div class="loading">Считаю сходство решений…</div>');
  m.appendChild(out);
  const M = CAT.modules.find(x => x.n === ORALM);
  const st = studentRows(td).filter(x => x.r.group_name === g && x.p);
  if (!st.length) { out.innerHTML = '<div class="result">В группе пока нет вошедших студентов.</div>'; return; }
  const codeSteps = M.lessons.flatMap(l => l.steps.filter(s => s.t === 'code').map(s => [l, s]));
  const md = await loadModule(M.n);
  const tpl = {}; md.lessons.forEach(l => l.steps.forEach(s => { if (s.t === 'code') tpl[s.id] = s.tpl || ''; }));
  let subs = [];
  if (codeSteps.length) {
    const r = await sb.from('submissions').select('user_id, step_id, payload, prelim_score, created_at').in('step_id', codeSteps.map(([, s]) => s.id)).order('created_at').limit(50000);
    if (r.error) { out.innerHTML = '<div class="result bad">' + esc(errText(r.error)) + '</div>'; return; }
    const uids = new Set(st.map(x => x.p.user_id));
    subs = r.data.filter(s => uids.has(s.user_id) && s.payload && s.payload.code);
  }
  // код по (студент, шаг): последнее решение с лучшим предварительным баллом
  const last = {};
  subs.forEach(s => { const k = s.user_id + ':' + s.step_id, o = last[k]; if (!o || (s.prelim_score || 0) >= (o.prelim_score || 0)) last[k] = s; });
  const pairs = codeSteps.flatMap(([, s]) => similarity(s.id, tpl[s.id], Object.values(last).filter(x => x.step_id === s.id).map(x => [x.user_id, x.payload.code])));
  const flags = {}, add = (uid, kind, text, stepId) => (flags[uid] = flags[uid] || []).push({ kind, text, stepId });
  pairs.forEach(p => { const sm = STEPMETA[p.stepId]; [[p.a, p.b], [p.b, p.a]].forEach(([u, v]) => add(u, p.level, SIM_TEXT[p.level] + ' с ' + nameByUid(td, v) + ' · ' + sm.lesson.title + ', шаг ' + sm.num + ' (структура ' + Math.round(p.ts * 100) + ' %, строки ' + Math.round(p.ls * 100) + ' %)', p.stepId)); });
  // ЛР высоко / КТ низко — по модулям до выбранного включительно
  const upto = new Set(CAT.modules.filter(x => x.n <= M.n).flatMap(x => x.lessons.flatMap(l => l.steps.map(s => s.id))));
  st.forEach(x => {
    let lg = 0, lm = 0, cg = 0, cm = 0;
    Object.values(STEPMETA).forEach(s => { if (!s.cost || !upto.has(s.id)) return; const c = category(s.lesson.title), b = x.best[s.id], v = s.cost * ((b && b.best_on_time) || 0);
      if (c === 'lab' || c === 'prac') { lg += v; lm += s.cost; } else if (c === 'ctrl') { cg += v; cm += s.cost; } });
    if (lm && cm && lg / lm >= ORAL_CFG.lab_high && cg / cm < ORAL_CFG.ctrl_low) add(x.p.user_id, 'labctrl', 'ЛР и практики ' + Math.round(100 * lg / lm) + ' %, контрольные ' + Math.round(100 * cg / cm) + ' % — «ЛР высоко / КТ низко»');
  });
  // случайная выборка ~10 % среди сдававших модуль — одна и та же для группы и модуля
  const active = st.filter(x => M.lessons.some(l => l.steps.some(s => x.best[s.id])));
  const rnd = seeded(g + ':' + M.n), pool = active.slice();
  for (let i = 0; i < Math.ceil(ORAL_CFG.sample_share * active.length) && pool.length; i++) add(pool.splice(Math.floor(rnd() * pool.length), 1)[0].p.user_id, 'random', 'случайная выборка');
  const rank = u => Math.min(...flags[u].map(f => ({ high: 0, labctrl: 1, noticeable: 2, random: 3 })[f.kind]));
  const order = Object.keys(flags).sort((a, b) => rank(a) - rank(b) || nameByUid(td, a).localeCompare(nameByUid(td, b), 'ru'));
  const call = order.slice(0, ORAL_CFG.max_per_week), later = order.slice(ORAL_CFG.max_per_week);
  const items = [...new Set(M.lessons.map(l => itemOf(l.title)).filter(Boolean))];
  out.innerHTML = '';
  out.appendChild(el('p', { class: 'small' }, esc(M.label) + ': сдавали ' + active.length + ' из ' + st.length + ', решений с кодом ' + Object.keys(last).length + ', пар со сходством ' + pairs.length + '. На устную проверку: ' + call.length + (later.length ? ' (ещё ' + later.length + ' — на следующую пару)' : '') + '.'));
  if (!call.length) { out.appendChild(el('div', { class: 'result ok' }, 'Заметного сходства и других поводов нет — можно вызвать кого-то по своему выбору из ведомости.')); return; }
  const rows = studentRows(td);
  [...call, ...later].forEach((u, i) => {
    const x = rows.find(r => r.p && r.p.user_id === u);
    if (!x) return;
    const f = flags[u], simStep = (f.find(z => z.stepId) || {}).stepId;
    const solved = codeSteps.filter(([, s]) => last[u + ':' + s.id]).sort((a, b) => b[1].cost - a[1].cost);
    const qStep = simStep ? STEPMETA[simStep] : solved.length ? solved[0][1] : null;
    const code = qStep && last[u + ':' + qStep.id] ? last[u + ':' + qStep.id].payload.code : '';
    const card = el('section', { class: 'pblock ocard' + (i >= call.length ? ' later' : '') });
    card.innerHTML = '<h2>' + (i + 1) + '. <a href="#teacher/' + u + '">' + esc(x.r.full_name) + '</a>' + (i >= call.length ? ' <span class="badge">следующая пара</span>' : '') + '</h2>' +
      '<ul class="gnotes">' + f.map(z => '<li>' + esc(z.text) + '</li>').join('') + '</ul>' +
      '<h3>Вопросы' + (qStep ? ' по коду: ' + esc(qStep.lesson.title) + ', шаг ' + qStep.num : '') + '</h3><ol>' + oralQuestions(qStep ? qStep.lesson.title : M.title, code).map(q => '<li>' + q + '</li>').join('') + '</ol>' +
      (code ? '<details><summary>Код студента</summary><pre>' + esc(code) + '</pre></details>' : '');
    if (items.length) card.appendChild(oralBlock(x, td, () => { TD = null; teacher('oral'); }, items));
    else card.appendChild(el('p', { class: 'small' }, 'В этом модуле нет лабораторных и контрольных с допуском — отметки ставятся в карточке студента.'));
    out.appendChild(card);
  });
}

async function statsPage(m, td) {

  if (!rows.length) { m.appendChild(el('div', { class: 'result' }, 'В выбранной группе пока нет вошедших студентов.')); return; }

    if (error) { box.lastChild.outerHTML = '<div class="result bad">' + esc(errText(error)) + '</div>'; return; }
    const pick = (data || []).filter(r => g === '' ? true : g === '-' ? !r.group_name : r.group_name === g);
    const by = {}; pick.forEach(r => { const d = by[r.day] = by[r.day] || { n: 0, s: 0 }; d.n += +r.submissions; d.s += +r.students; });
    const days = []; for (let i = 29; i >= 0; i--) { const d = new Date(Date.now() + 6 * 36e5 - i * DAY).toISOString().slice(0, 10); days.push([d, by[d] || { n: 0, s: 0 }]); }
    const mx = Math.max(1, ...days.map(([, v]) => v.n));
    box.lastChild.outerHTML = '<div class="bars" role="img" aria-label="Сдачи по дням за 30 дней">' + days.map(([d, v]) => '<div class="bar" title="' + d.slice(8) + '.' + d.slice(5, 7) + ': ' + v.n + ' ' + plural(v.n, 'сдача', 'сдачи', 'сдач') + ', ' + v.s + ' ' + plural(v.s, 'студент', 'студента', 'студентов') + '"><i style="height:' + (100 * v.n / mx).toFixed(1) + '%"></i><span>' + (+d.slice(8)) + '</span></div>').join('') + '</div>' +
      '<p class="small">Всего сдач: ' + days.reduce((a, [, v]) => a + v.n, 0) + '. Наведите на столбец — число сдач и студентов за день (время Бишкека).</p>';
  });
  // трудные шаги
  const stat = {};
  td.best.filter(b => uids.has(b.user_id)).forEach(b => { const s = stat[b.step_id] = stat[b.step_id] || { tried: 0, solved: 0, att: 0 }; s.tried++; s.att += b.attempts; if (b.best >= 1) s.solved++; });
  const hard = Object.entries(stat).filter(([id, s]) => STEPMETA[id] && s.tried >= Math.min(3, rows.length)).map(([id, s]) => ({ s: STEPMETA[id], ...s, rate: s.solved / s.tried, avg: s.att / s.tried }))
    .sort((a, b) => a.rate - b.rate || b.avg - a.avg).slice(0, 12);
  const hb = el('section', { class: 'pblock' }, '<h2>Самые трудные шаги</h2><p class="small">Меньше всего решили из тех, кто пробовал; при равенстве — больше попыток на человека. Стоит разобрать на паре или поправить условие.</p>');
  const ht = el('table', { class: 'grade' });
  ht.innerHTML = '<tr><th>Шаг</th><th>Пробовали</th><th>Решили</th><th>Попыток на человека</th></tr>' + (hard.length ? hard.map(h => '<tr><td><a href="#' + h.s.lesson.key + '/' + h.s.num + '">' + esc(h.s.lesson.mod.label + ' · ' + h.s.lesson.title + ' · шаг ' + h.s.num) + '</a></td><td>' + h.tried + '</td><td>' + h.solved + ' (' + Math.round(100 * h.rate) + ' %)</td><td>' + fmt(h.avg) + '</td></tr>').join('') : '<tr><td colspan="4" class="small">Пока мало данных.</td></tr>');
  hb.appendChild(el('div', { style: 'overflow-x:auto' })).appendChild(ht);
  m.appendChild(hb);
  // прохождение модулей
  const mb = el('section', { class: 'pblock' }, '<h2>Прохождение модулей</h2><p class="small">Доля студентов, набравших в срок не меньше 80 % баллов модуля, и средний балл модуля.</p>');
  const mt = el('table', { class: 'grade' });
  mt.innerHTML = '<tr><th>Модуль</th><th>Срок</th><th>≥ 80 % в срок</th><th>Средний балл</th></tr>' + CAT.modules.map(M => {
    const mx = modStat(M).m, i = M.n - 1, ok = rows.filter(x => mx && x.mods[i] >= 0.8 * mx).length, avg = rows.reduce((a, x) => a + x.mods[i], 0) / rows.length;
    return '<tr><td>' + esc(M.label) + '</td><td>' + fmtDate(g && g !== '-' ? dueOf(td, g, M.sectionId) : (td.deadlines.find(d => d.section_id === M.sectionId) || {}).due_at) + '</td><td>' + ok + ' из ' + rows.length + '</td><td>' + fmt(avg) + ' из ' + mx + '</td></tr>';
  }).join('');
  mb.appendChild(el('div', { style: 'overflow-x:auto' })).appendChild(mt);
  m.appendChild(mb);
}

/* сроки: общие сроки курса (руководитель) и сроки группы (преподаватель своих групп) */
const toLocal = t => { if (!t) return ''; const d = new Date(t), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const fromLocal = v => v ? new Date(v).toISOString() : null;
const sameMin = (a, b) => (a ? Math.floor(Date.parse(a) / 60000) : null) === (b ? Math.floor(Date.parse(b) / 60000) : null);
const DL_COLS = [['class_start', 'Пара: начало'], ['class_end', 'Пара: конец'], ['due_at', 'Срок сдачи']];
let DLG = null;   // группа, открытая на странице сроков; '*' — общие сроки курса
function deadlinesPage(m, td) {
  const mg = myGroups(td).filter(x => !x.archived);
  panelTabs(m, 'deadlines');
  m.appendChild(el('h1', { class: 'lesson-h' }, 'Сроки'));
  if (!isAdmin() && !mg.length) { m.appendChild(el('div', { class: 'result' }, 'У вас пока нет групп — создайте её во вкладке «Группы».')); return; }
  const cg = curGroup(td);
  if (DLG === null || (DLG === '*' && !isAdmin()) || (DLG !== '*' && !mg.some(x => x.group_name === DLG))) DLG = cg && cg !== '-' && mg.some(x => x.group_name === cg) ? cg : mg[0] ? mg[0].group_name : '*';
  const g = DLG, course = g === '*', canEdit = course ? isAdmin() : isTeacher();
  const off = -new Date().getTimezoneOffset() / 60;
  m.appendChild(el('p', { class: 'small' }, 'Общие сроки курса задаёт руководитель. Если группа идёт по своему расписанию, задайте ей свои сроки: они заменяют общие для студентов группы, а модули с общими сроками следуют за общими. ' +
    'Окно пары важно для КТ: сдача КТ вне окна не засчитывается в срок (кроме продлённых). Продления отдельным студентам — в ведомости. Время — по часам этого компьютера (UTC' + (off >= 0 ? '+' : '') + off + ').' +
    (canEdit ? '' : ' Менять сроки может преподаватель группы.')));
  const bar = el('div', { class: 'filters' }, '<label>Сроки <select id="dlSel">' + groupOptions(mg, g, isAdmin() ? [['*', 'Общие сроки курса']] : []) + '</select></label>');
  $('#dlSel', bar).onchange = e => { DLG = e.target.value; m.innerHTML = ''; deadlinesPage(m, td); };
  m.appendChild(bar);
  const base = id => td.deadlines.find(d => d.section_id === id) || {};
  const own = id => td.gd.find(d => d.group_name === g && d.section_id === id);
  const t = el('table', { class: 'grade dl' });
  t.innerHTML = '<tr><th>Модуль</th>' + DL_COLS.map(([, h]) => '<th>' + h + '</th>').join('') + (course ? '' : '<th>Откуда</th>') + '</tr>' +
    CAT.modules.map(M => {
      const v = (course ? base(M.sectionId) : own(M.sectionId) || base(M.sectionId));
      return '<tr data-s="' + M.sectionId + '"><td>' + esc(M.label) + '</td>' + DL_COLS.map(([c]) => '<td><input type="datetime-local" data-c="' + c + '" value="' + toLocal(v[c]) + '"' + (canEdit ? '' : ' disabled') + '></td>').join('') +
        (course ? '' : '<td class="src">' + (own(M.sectionId) ? 'группы' : 'общий') + '</td>') + '</tr>';
    }).join('');
  m.appendChild(el('div', { style: 'overflow-x:auto' })).appendChild(t);
  if (!canEdit) return;
  // заполнение по расписанию — то же правило, что seed_deadlines.sql: неделя w — пара в день первой пары + 7(w−1),
  // срок — через неделю в начало пары; итоговая работа — день пары 14-й недели, 23:59
  const fill = el('details', { class: 'pblock' }, '<summary><b>Заполнить по расписанию</b></summary><p class="small">Пары раз в неделю. Срок сдачи недели — начало следующей пары; итоговая работа — до 23:59 в день пары 14-й недели.</p>' +
    '<div class="filters"><label>Первая пара <input type="date" id="fD"></label><label>с <input type="time" id="fA" value="11:30"></label><label>до <input type="time" id="fB" value="19:00"></label><button id="fGo">Заполнить</button></div>');
  m.appendChild(fill);
  $('#fGo', fill).onclick = () => {
    const d0 = $('#fD', fill).value, a = $('#fA', fill).value || '11:30', b = $('#fB', fill).value || '19:00';
    if (!d0) return toast('Укажите дату первой пары');
    const day = k => { const d = new Date(d0 + 'T00:00'); d.setDate(d.getDate() + 7 * k); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
    CAT.modules.forEach(M => {
      const tr = $('tr[data-s="' + M.sectionId + '"]', t), w = M.n === 15 ? 14 : M.n;
      const val = { class_start: day(w - 1) + 'T' + a, class_end: day(w - 1) + 'T' + b, due_at: M.n === 15 ? day(13) + 'T23:59' : day(w) + 'T' + a };
      DL_COLS.forEach(([c]) => { $('input[data-c="' + c + '"]', tr).value = val[c]; });
    });
    toast('Заполнено — проверьте и сохраните');
  };
  const res = el('div', { class: 'result', hidden: '' });
  const acts = el('div', { class: 'actions' });
  const save = async () => {
    const rows = [], bad = [];
    t.querySelectorAll('tr[data-s]').forEach(tr => {
      const r = { section_id: +tr.dataset.s };
      DL_COLS.forEach(([c]) => { r[c] = fromLocal($('input[data-c="' + c + '"]', tr).value); });
      if (r.class_start && r.class_end && r.class_end <= r.class_start) bad.push(tr.cells[0].textContent);
      rows.push(r);
    });
    res.hidden = false;
    if (bad.length) { res.className = 'result bad'; res.textContent = 'Конец пары раньше начала: ' + bad.join(', '); return; }
    let error;
    if (course) ({ error } = await sb.from('deadlines').upsert(rows, { onConflict: 'section_id' }));
    else {
      // свои строки — только у модулей, где сроки группы отличаются от общих
      const differ = rows.filter(r => DL_COLS.some(([c]) => !sameMin(r[c], base(r.section_id)[c])));
      const same = rows.filter(r => !differ.includes(r)).map(r => r.section_id).filter(id => own(id));
      if (differ.length) ({ error } = await sb.from('group_deadlines').upsert(differ.map(r => Object.assign({ group_name: g }, r)), { onConflict: 'group_name,section_id' }));
      if (!error && same.length) ({ error } = await sb.from('group_deadlines').delete().eq('group_name', g).in('section_id', same));
    }
    if (error) { res.className = 'result bad'; res.textContent = 'Не сохранено: ' + errText(error); return; }
    await reloadPanel('deadlines'); toast('Сроки сохранены');
  };
  acts.append(pbtn('Сохранить', save, true));
  if (!course && td.gd.some(d => d.group_name === g)) acts.append(pbtn('Вернуть общие сроки', async () => {
    if (!confirm('Вернуть группе ' + g + ' общие сроки курса по всем модулям?')) return;
    const { error } = await sb.from('group_deadlines').delete().eq('group_name', g);
    if (error) { res.hidden = false; res.className = 'result bad'; res.textContent = errText(error); return; }
    await reloadPanel('deadlines'); toast('У группы снова общие сроки');
  }));
  m.append(acts, res);
}

/* ---------- кабинет студента ---------- */
// достижения — считаются по проверенным сервером баллам; [ключ, название, условие, (данные) → [сделано, нужно]]
const BADGES = [
  ['first', 'Первая задача', 'решить первую задачу', c => [c.solved, 1]],
  ['ten', 'Десятка', 'решить 10 задач', c => [c.solved, 10]],
  ['fifty', 'Полсотни', 'решить 50 задач', c => [c.solved, 50]],
  ['firsttry', 'С первой попытки', '10 задач — с первой попытки', c => [c.firstTry, 10]],
  ['module', 'Модуль закрыт', 'все задачи модуля в срок', c => [c.modules, 1]],
  ['three', 'Три модуля', 'три модуля полностью в срок', c => [c.modules, 3]],
  ['lab', 'Лаборант', 'лабораторная полностью в срок', c => [c.labs, 1]],
  ['ctrl', 'Контрольная на максимум', 'полный балл за контрольную', c => [c.ctrl, 1]],
  ['streak3', 'Три дня подряд', 'сдавать задачи 3 дня подряд', c => [c.streak, 3]],
  ['streak7', 'Неделя подряд', 'сдавать задачи 7 дней подряд', c => [c.streak, 7]],
  ['half', 'Половина курса', 'половина баллов курса в срок', c => [Math.floor(c.total), Math.ceil(CAT.total / 2)]],
  ['key', 'Ключ собран', 'решены все задачи курса', c => [c.solved, c.tasks]],
];
function achievements(best, rej, dates) {
  const tasks = Object.values(STEPMETA).filter(s => isTask(s) && s.cost);
  const ok = s => best[s.id] && best[s.id].best >= 1, onTime = s => best[s.id] && best[s.id].best_on_time >= 1 && !rej.has(itemOf(s.lesson.title));
  const byItem = {}; tasks.forEach(s => { const it = itemOf(s.lesson.title); if (it) (byItem[it] = byItem[it] || []).push(s); });
  const days = [...new Set(dates.map(t => new Date(Date.parse(t) + 6 * 36e5).toISOString().slice(0, 10)))].sort();
  let streak = 0, cur = 0, prev = null;
  days.forEach(d => { cur = prev && Date.parse(d) - Date.parse(prev) === DAY ? cur + 1 : 1; streak = Math.max(streak, cur); prev = d; });
  const c = {
    tasks: tasks.length, solved: tasks.filter(ok).length,
    firstTry: tasks.filter(s => ok(s) && best[s.id].attempts === 1).length,
    modules: CAT.modules.filter(M => { const ts = M.lessons.flatMap(l => l.steps.filter(s => isTask(s) && s.cost)); return ts.length && ts.every(onTime); }).length,
    labs: Object.entries(byItem).filter(([it, ss]) => it.startsWith('ЛР') && ss.every(onTime)).length,
    ctrl: Object.entries(byItem).filter(([it, ss]) => it.startsWith('КТ') && ss.every(onTime)).length,
    streak, total: tasks.reduce((a, s) => a + (onTime(s) ? s.cost : 0), 0),
  };
  return BADGES.map(([k, name, cond, f]) => { const [have, need] = f(c); return { k, name, cond, have: Math.min(have, need), need, done: have >= need }; });
}

/* настройки студента на всех устройствах (student_prefs) */
let PREFS = null;
function savePrefs(patch) {
  if (!SERVER || !sb || !ME) return Promise.resolve({ error: null });
  PREFS = Object.assign({}, PREFS, patch);
  // запрос supabase-js уходит, только когда его ждут — then() запускает его сразу, даже если результат не нужен
  return sb.from('student_prefs').upsert(Object.assign({ user_id: ME.user_id }, patch), { onConflict: 'user_id' }).then(r => r, e => ({ error: e }));
}
async function loadPrefs() {
  const { data } = await sb.from('student_prefs').select('*').eq('user_id', ME.user_id).maybeSingle();
  PREFS = data || {};
  if (PREFS.design && DESIGNS[PREFS.design] && PREFS.design !== design()) {
    document.documentElement.dataset.design = PREFS.design;
    try { localStorage.setItem(KEY + '-design', PREFS.design); localStorage.setItem(KEY + '-design-picked', '1'); } catch (e) {}
    window.loadDesignFonts && window.loadDesignFonts(PREFS.design);
  }
  if (PREFS.theme && PREFS.theme !== document.documentElement.dataset.theme) {
    document.documentElement.dataset.theme = PREFS.theme;
    try { localStorage.setItem(KEY + '-theme', PREFS.theme); } catch (e) {}
  }
}

  const inp = $('#nm', md); inp.value = S.name || ''; inp.focus();
  const ok = () => {
    const v = inp.value.trim().replace(/\s+/g, ' ');
    if (v.length < 3) return toast('Введите фамилию и имя');
    S.name = v; save(); md.remove(); refreshChrome(); route(); maybePickDesign();
  };
  $('#nmOk', md).onclick = ok; inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  if (force) $('#nmNo', md).onclick = () => md.remove();
}

function report() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const L = [];
  L.push('МОБАК — отчёт студента', 'Студент: ' + S.name, 'Код студента: ' + S.uid,
    'Дата отчёта: ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()),
    'Итого: ' + fmt(totalGot()) + ' из ' + ofBalls(CAT.total), '');
  CAT.modules.forEach(M => {
    const ms = modStat(M);
    L.push('== ' + M.title + ' — ' + fmt(ms.g) + ' из ' + ms.m);
    M.lessons.forEach(l => l.steps.forEach(s => {
      if (!isTask(s) || !s.cost) return;
      const r = S.steps[s.id] || {}, v = sc(s.id), mark = v === 1 ? '[+]' : v > 0 ? '[~]' : r.att ? '[-]' : '[ ]';
      L.push('  ' + mark + ' ' + fmt(got(s)) + '/' + s.cost + '  ' + l.title + ' — ' + s.title + (r.att ? '  (попыток: ' + r.att + ')' : ''));
    }));
    L.push('');
  });
  L.push('Обозначения: [+] решено, [~] частично, [-] есть попытки, [ ] не начато.', '', '== Решения задач на программирование (принятые проверкой)');
  Object.values(STEPMETA).forEach(s => {
    const r = S.steps[s.id] || {};
    if (s.t === 'code' && r.solved) L.push('', '--- ' + s.lesson.mod.label + ' · ' + s.lesson.title + ' — ' + s.title + ' (шаг ' + s.id + ')', r.solved.replace(/\s+$/, ''));
  });
  const text = L.join('\n') + '\n';
  const md = el('div', { class: 'modal' });
  md.innerHTML = '<div class="box wide"><h2>Отчёт преподавателю</h2><p class="small">Скачайте файл и отправьте его преподавателю (или скопируйте текст в сообщение).</p><textarea readonly></textarea><div class="actions"><button class="primary" id="rDl">Скачать файл</button><button id="rCp">Копировать</button><button id="rX">Закрыть</button></div></div>';
  document.body.appendChild(md);
  $('textarea', md).value = text;
  const fname = 'МОБАК_отчёт_' + S.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.txt';
  $('#rDl', md).onclick = () => download(fname, text);
  $('#rCp', md).onclick = () => copy(text);
  $('#rX', md).onclick = () => md.remove();
  md.addEventListener('click', e => { if (e.target === md) md.remove(); });
}

function menu() {
  if ($('.menu')) return $('.menu').remove();
  const mn = el('div', { class: 'menu' });
  const item = (t, fn) => mn.appendChild(el('button', { on: { click: () => { mn.remove(); fn(); } } }, t));
  if (SERVER) {
    if (isStaff()) item('Панель преподавателя', () => { location.hash = 'teacher'; });
    if (ME) item('Мой кабинет', () => { location.hash = 'me'; });
    item('Справка', helpModal);
    item('Как обрабатываются данные', privacyModal);
    if (ME) item('Выйти (' + ME.email + ')', async () => { await sb.auth.signOut(); location.hash = ''; location.reload(); });
  } else {
    item('Сменить имя', () => askName(true));
    item('Сохранить прогресс в файл', () => download('МОБАК_прогресс_' + S.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.json', JSON.stringify(S)));
    item('Загрузить прогресс из файла', () => {
      const f = el('input', { type: 'file', accept: '.json,application/json' });
      f.onchange = async () => { try { const o = JSON.parse(await f.files[0].text()); if (!o.steps || !o.uid) throw 0; S = Object.assign({ uid: '', name: '', steps: {} }, o); save(); refreshChrome(); route(); toast('Прогресс загружен'); } catch (e) { toast('Это не файл прогресса'); } };
      f.click();
    });
  }
  mn.appendChild(el('div', { class: 'sep' }));
  mn.appendChild(el('div', { class: 'mh' }, 'Оформление'));
  Object.entries(DESIGNS).forEach(([k, v]) => item((design() === k ? '● ' : '○ ') + v.name, () => setDesign(k)));
  item('Сравнить оформления…', () => pickDesign(false));
  mn.appendChild(el('div', { class: 'sep' }));
  // «Рабочее место» по умолчанию тёмное, остальные — как в системе
  item('Тема: светлая / тёмная', () => { const cur = document.documentElement.dataset.theme; const dark = cur ? cur === 'dark' : design() === 'ide' || matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem(KEY + '-theme', document.documentElement.dataset.theme); } catch (e) {} if (ME) savePrefs({ theme: document.documentElement.dataset.theme }); });
  document.body.appendChild(mn);
  setTimeout(() => document.addEventListener('click', function off(e) { if (!mn.contains(e.target)) { mn.remove(); document.removeEventListener('click', off); } }), 0);
}

try { const th = localStorage.getItem(KEY + '-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
$('#navBtn').onclick = () => document.body.classList.toggle('nav-open');
$('#expBtn').onclick = () => document.body.classList.toggle('noexp');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');
// схема из урока — на весь экран по клику
$('#main').addEventListener('click', e => {
  const im = e.target.closest('.step .body img');
  if (!im) return;
  const md = el('div', { class: 'modal zoom' }); md.appendChild(el('img', { src: im.src, alt: im.alt }));
  md.onclick = () => md.remove(); document.body.appendChild(md);
});
$('#brand').onclick = () => location.hash = '';
$('#reportBtn').onclick = report;
$('#moreBtn').onclick = menu;
(async () => {
  try { await loadCatalog(); }
  catch (e) { $('#main').innerHTML = '<div class="result bad">Не удалось загрузить курс. Проверьте интернет и обновите страницу.</div>'; return; }
  if (!SERVER) {
    save();
    window.addEventListener('hashchange', route);
    refreshChrome(); route(); askName(); maybePickDesign();
    return;
  }
  if (!sb) { $('#main').innerHTML = '<div class="result bad">Не загрузилась библиотека входа. Проверьте интернет и обновите страницу.</div>'; return; }
  $('#reportBtn').hidden = true;   // на платформе ведомость у преподавателя, отчёт файлом не нужен
  const urlErr = authErrorFromUrl(), join = pendingJoin();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    if (!join) return loginScreen(urlErr);
    const { data, error } = await sb.rpc('invite_info', { invite_code: join.code });
    const inv = !error && data && data[0];
    if (inv) { const j = Object.assign({}, join, { group: inv.group_name, term: inv.term }); saveJoin(j); return loginScreen(urlErr, j); }
    doneJoin();
    return loginScreen(error ? 'Не удалось проверить ссылку для записи: ' + errText(error) : 'Ссылка для записи недействительна или устарела — попросите у преподавателя новую. Если вы уже в списке группы, просто войдите по почте.');
  }
  if (/access_token|refresh_token/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  const loadProfile = () => sb.from('profiles').select('user_id, email, full_name, role').eq('user_id', session.user.id).maybeSingle();
  let { data: prof, error } = await loadProfile(), joinNote = '';
  if (!error && join) {   // запись по ссылке: почта уже подтверждена кодом из письма
    const r = await sb.rpc('join_group', { invite_code: join.code, full_name: join.name || null });
    doneJoin();
    if (r.error) joinNote = errText(r.error);
    else {
      joinNote = { joined: 'Вы записаны в группу ' + (join.group || ''), moved: 'Вы переведены в группу ' + (join.group || ''), staff: 'Это ссылка для студентов — вы вошли как преподаватель' }[r.data] || '';
      if (r.data === 'joined' || r.data === 'moved') ({ data: prof, error } = await loadProfile());
    }
  }
  if (error || !prof || !prof.role) {
    await sb.auth.signOut();
    return loginScreen(error ? 'Не удалось загрузить профиль: ' + errText(error) : joinNote || 'Эта почта не входит в список группы — обратитесь к преподавателю.');
  }
  ME = prof;
  loadLocal(KEY + ':' + ME.user_id);
  try { await loadPrefs(); } catch (e) {}
  examResume().catch(() => {});
  try { if (localStorage.getItem(KEY + '-consent')) sb.rpc('accept_terms').then(() => {}); } catch (e) {}
  S.uid = ME.user_id; S.name = ME.full_name || ME.email;   // uid — seed личных данных (общий с перепроверкой)
  const hb = isStaff() ? el('button', { class: 'primary', on: { click: () => { location.hash = 'teacher'; } } }, 'Панель')
    : el('button', { on: { click: () => { location.hash = 'me'; } } }, 'Мой кабинет');
  $('#reportBtn').after(hb);
  try { await flushOutbox(); await pullProgress(); } catch (e) { toast('Прогресс с сервера не загрузился: ' + errText(e)); }
  save();
  window.addEventListener('hashchange', route);
  refreshChrome(); route(); maybePickDesign();
  if (joinNote) toast(joinNote);
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
})();
</script>
